// ── CHỨNG TỪ (ảnh / PDF) lưu và xem trên app (anh chốt 08/10) ──────────────
// Kho riêng tư; Edge Function kt-chung-tu kiểm phiên + quyền rồi cấp link ký tên sống 5 phút. Ảnh nén trên máy trước khi tải lên.
const FN_CT=SB_URL+'/functions/v1/kt-chung-tu';
const TEN_BANG={thu:'Thu',chi:'Chi',dieu_chuyen:'Dieu-chuyen',vay:'Vay',tai_san:'Tai-san'};
async function ctFn(b){const r=await fetch(FN_CT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phien:S.phien,...b})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.loi||'Lỗi chứng từ '+r.status);return j}
// Nén ảnh: cạnh dài tối đa 1600px, JPEG 80% (~250–350 KB, vẫn đọc rõ hoá đơn — 19/10 giảm từ 2000px / 82% cho tải nhanh hơn). PDF / ảnh không đọc được (HEIC trên máy không hỗ trợ) giữ nguyên.
async function nenAnh(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<300*1024)return f;
  try{const bm=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));if(!b||b.size>=f.size)return f;
    return new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})}catch(e){return f}}
// Ô chứng từ (anh 08/10: "gọn nhất cho người up, giảm dung lượng ngầm, click lại ra luôn"):
// bấm ＋ / kéo thả / dán Ctrl+V là xong — nén + tải lên chạy NGẦM theo hàng đợi, ô hiện ảnh xem trước + %; đóng phiếu vẫn tải tiếp.
// Phiếu MỚI chưa lưu: ảnh chọn trước được giữ lại, bấm Lưu phiếu là tự tải lên. ganCT() tự vẽ ô sau khi mở form / ngăn kéo.
const CTQ=[],CT_MOI={};let ctChay=false,ctUid=0;
const ctBox=(bang,id,sua,loc)=>{if(!id&&!loc)CT_MOI[bang]=[];
  return `<div class="sec" style="margin-top:14px">${loc==='unc'?'Ảnh giao dịch (uỷ nhiệm chi / phiếu chi ký nhận)':'Chứng từ đính kèm'}</div><div class="ct" data-bang="${bang}" data-id="${id||''}" data-sua="${sua?1:0}"${loc?` data-loc="${loc}"`:''}><div class="muted" style="font-size:12px">Đang tải chứng từ…</div></div>`};
function ganCT(){$$('.ct[data-bang]:not([data-xong])').forEach(el=>{el.dataset.xong=1;veCT(el)})}
const ctAnh=f=>/^image\//.test(f.type||'');
const ctNhan=q=>({cho:'Chờ tải',nen:'Đang nén…',tai:'Đang tải '+(q.pct||0)+'%',xong:'✓ Đã lưu',loi:'Lỗi — bấm thử lại',moi:'Lưu phiếu là tải lên'}[q.tt]);
function ctO(q,i){return `<div class="ct-item dang ${q.tt}" data-q="${q.uid||''}">
    <div class="ct-thumb" ${q.tt==='loi'?`onclick="ctThuLai(${q.uid})" title="${esc(q.loi||'')}"`:''}>${q.url?`<img src="${q.url}" alt="">`:`<span class="ct-pdf">${ctNhanTep(q.file.type,q.file.name)}</span>`}<span class="ct-tt">${ctNhan(q)}</span></div>
    <div class="ct-ten" title="${esc(q.file.name)}">${esc(q.file.name)}</div>
    ${q.tt==='moi'?`<div class="ct-nut"><button title="Bỏ" onclick="ctBoMoi('${q.bang}',${q.uid})">✕</button></div>`:''}</div>`}
const laUNC=t=>/^UNC_/i.test(t||'');
// 22/10: phiếu có ô "Ảnh giao dịch" thì ô "Chứng từ đính kèm" không hiện ảnh UNC_ nữa — mỗi ô chỉ ảnh của mình
const ctHop=el=>{if(el.dataset.loc==='unc')return laUNC;
  return document.querySelector(`.ct[data-bang="${el.dataset.bang}"][data-id="${el.dataset.id||''}"][data-loc="unc"]`)?t=>!laUNC(t):()=>true};
function ctLuoi(bang,id,ds,u,sua,loc,hop){
  const dang=(id?CTQ.filter(q=>q.k===bang+':'+id):(CT_MOI[bang]||[])).filter(q=>!hop||hop(q.file.name));
  return `<div class="ct-grid">${ds.map(x=>{const anh=/^image\//.test(x.mime||'');return `<div class="ct-item">
        <div class="ct-thumb" onclick="xemCT('${bang}',${id},${x.id})">${anh&&u[x.id]?`<img src="${esc(u[x.id])}" alt="${esc(x.ten)}" loading="lazy">`:`<span class="ct-pdf">${ctNhanTep(x.mime||'',x.ten||'')}</span>`}</div>
        <div class="ct-ten" title="${esc(x.ten)} · ${esc(x.tao_boi||'')} ${fmtDT(x.tao_luc)}">${esc(x.ten)}</div>
        <div class="ct-nut"><button title="Tải về" onclick="taiVeCT([${x.id}])">⬇</button>${sua?`<button title="Xoá" onclick="xoaCT('${bang}',${id},${x.id})">✕</button>`:''}</div></div>`}).join('')}
      ${dang.map(ctO).join('')}
      ${sua?`<label class="ct-them"><input type="file" multiple accept="image/*,application/pdf,.xlsx,.xls,.csv,.docx,.doc" hidden onchange="ctThem('${bang}',${id||0},this.files${loc?`,'${loc}'`:''});this.value=''"><b>＋</b><span>${loc==='unc'?'Thêm ảnh giao dịch':'Thêm ảnh / tệp / PDF'}</span><small>kéo thả · Ctrl+V</small></label>`:''}</div>
    ${ds.length>1?`<div style="margin-top:6px"><button class="btn sm" onclick="taiVeCT([${ds.map(x=>x.id).join(',')}])">⬇ Tải tất cả (${ds.length})</button></div>`:''}
    ${!ds.length&&!dang.length&&!sua?'<div class="muted" style="font-size:12px">Chưa có chứng từ</div>':''}`}
async function veCT(el){
  const bang=el.dataset.bang,id=+el.dataset.id||0,sua=el.dataset.sua==='1';
  const loc=el.dataset.loc||'',hop=ctHop(el);
  if(!id){el.innerHTML=ctLuoi(bang,0,[],{},sua,loc,hop);return}
  try{const ds=(await rpc('kt_ds_chung_tu',{p_bang:bang,p_dong_id:id})).filter(x=>hop(x.ten));
    const urls=ds.length?(await ctFn({viec:'xem',ids:ds.map(x=>x.id)})).ds:[];const u=Object.fromEntries(urls.map(x=>[x.id,x.url]));
    const cu=(S.cache['ct_'+bang+id]||[]).filter(x=>!hop(x.ten));   // 2 ô cùng phiếu: gộp, không ghi đè nhau (trình xem ảnh dùng chung)
    S.cache['ct_'+bang+id]=[...cu,...ds.map(x=>({...x,url:u[x.id]}))];
    el.innerHTML=ctLuoi(bang,id,ds,u,sua,loc,hop);
  }catch(e){el.innerHTML=`<div class="neg" style="font-size:12px">${esc(e.message)}</div>`}}
// vẽ lại ô của 1 phiếu đang mở (nếu có): taiLai = đọc lại danh sách từ máy chủ, không thì chỉ vẽ lại phần đang tải
function veLaiCT(bang,id,taiLai){$$(`.ct[data-bang="${bang}"][data-id="${id||''}"]`).forEach(el=>{
  if(taiLai||!id){veCT(el);return}
  const g=el.querySelector('.ct-grid');if(!g)return;g.querySelectorAll('.ct-item.dang').forEach(n=>n.remove());
  const them=g.querySelector('.ct-them'),hop=ctHop(el);const h=CTQ.filter(q=>q.k===bang+':'+id&&hop(q.file.name)).map(ctO).join('');
  them?them.insertAdjacentHTML('beforebegin',h):g.insertAdjacentHTML('beforeend',h)})}
function veTienDo(q){$$(`.ct-item[data-q="${q.uid}"] .ct-tt`).forEach(n=>n.textContent=ctNhan(q))}
function ctThem(bang,id,files,loc){
  let fs=[...(files||[])].filter(f=>ctAnh(f)||/\.(pdf|jpe?g|png|webp|heic|heif|xlsx?|csv|docx?)$/i.test(f.name)).map(ctLoai);
  if(loc==='unc')fs=fs.map(f=>laUNC(f.name)?f:new File([f],'UNC_'+f.name,{type:f.type}));
  if(!fs.length)return toast('Chỉ nhận ảnh, PDF, Excel, Word');
  const moi=fs.map(f=>({uid:++ctUid,bang,id,k:bang+':'+id,file:f,url:ctAnh(f)?URL.createObjectURL(f):null,tt:id?'cho':'moi',pct:0}));
  if(!id){(CT_MOI[bang]=CT_MOI[bang]||[]).push(...moi);veLaiCT(bang,0);return}
  CTQ.push(...moi);veLaiCT(bang,id);chayCT()}
const CT_DUOI={pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',xls:'application/vnd.ms-excel',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',doc:'application/msword',csv:'text/csv',heic:'image/heic',heif:'image/heif'};
function ctLoai(f){const d=(f.name.split('.').pop()||'').toLowerCase();if(f.type&&!/octet/.test(f.type))return f;return CT_DUOI[d]?new File([f],f.name,{type:CT_DUOI[d]}):f}
const ctNhanTep=(mime,ten)=>/pdf/i.test(mime+ten)?'PDF':/sheet|excel|csv|\.xlsx?$|\.csv$/i.test(mime+' '+ten)?'XLS':/word|\.docx?$/i.test(mime+' '+ten)?'DOC':'TỆP';
function ctBoMoi(bang,uid){const d=CT_MOI[bang]||[],i=d.findIndex(q=>q.uid===uid);if(i<0)return;if(d[i].url)URL.revokeObjectURL(d[i].url);d.splice(i,1);veLaiCT(bang,0)}
// Gọi ngay sau khi lưu phiếu mới (có id) → đẩy ảnh đã chọn vào hàng đợi
function ctGuiMoi(bang,id){const d=CT_MOI[bang]||[];CT_MOI[bang]=[];if(!id||!d.length)return;
  d.forEach(q=>{q.id=id;q.k=bang+':'+id;q.tt='cho'});CTQ.push(...d);chayCT()}
function ctThuLai(uid){const q=CTQ.find(x=>x.uid===uid);if(!q)return;q.tt='cho';q.pct=0;veTienDo(q);chayCT()}
function putTienDo(url,f,cb){return new Promise((ok,loi)=>{const x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('Content-Type',f.type||'application/octet-stream');
  x.upload.onprogress=e=>{if(e.lengthComputable)cb(Math.round(e.loaded*100/e.total))};
  x.onload=()=>x.status<300?ok():loi(new Error('Tải lên lỗi '+x.status));x.onerror=()=>loi(new Error('Mất mạng khi tải lên'));x.send(f)})}
// 19/10 anh: "up chứng từ có bị lâu không, thử up nhiều ảnh" — đo: mỗi file ~1s thủ tục + ~2,5s đẩy ảnh 500 KB; tải 3 file cùng lúc nhanh ~2,5 lần → 3 luồng
async function chayCT(){if(ctChay)return;ctChay=true;let n=0;
  const mot=async q=>{
    try{q.tt='nen';veTienDo(q);const f=await nenAnh(q.file);if(f.size>15*1024*1024)throw new Error(q.file.name+' quá 15 MB');
      const {duong_dan,url}=await ctFn({viec:'tai_len',bang:q.bang,dong_id:q.id,ten:f.name});
      q.tt='tai';veTienDo(q);await putTienDo(url,f,p=>{q.pct=p;veTienDo(q)});
      await rpc('kt_them_chung_tu',{p_bang:q.bang,p_dong_id:q.id,p_duong_dan:duong_dan,p_ten:f.name,p_mime:f.type||null,p_kich_thuoc:f.size});
      q.tt='xong';n++}catch(e){q.tt='loi';q.loi=e.message}
    veTienDo(q);
    // xong cả lô của phiếu này → bỏ khỏi hàng đợi, vẽ lại ô từ máy chủ (ảnh thật + nút xem / tải / xoá)
    if(!CTQ.some(x=>x.k===q.k&&['cho','nen','tai'].includes(x.tt))){
      for(let i=CTQ.length-1;i>=0;i--)if(CTQ[i].k===q.k&&CTQ[i].tt==='xong'){if(CTQ[i].url)URL.revokeObjectURL(CTQ[i].url);CTQ.splice(i,1)}
      veLaiCT(q.bang,q.id,true)}};
  try{await Promise.all([0,1,2].map(async()=>{for(let q;(q=CTQ.find(x=>x.tt==='cho'));)await mot(q)}))}finally{ctChay=false}
  const loi=CTQ.filter(x=>x.tt==='loi').length;

async function moChuong(b){const d=b.parentNode,o=d.classList.contains('open');$$('.tb-dd.open').forEach(x=>x.classList.remove('open'));if(o)return;

async function veChuong(){const box=$('.tb-chuong .cb-ds');if(!box)return;
  try{const ds=await rpc('kt_ds_thong_bao');S.cache.tb=ds;S.tb=ds.filter(x=>!x.da_doc).length;veSoChuong();

async function moThongBao(id){const x=(S.cache.tb||[]).find(t=>t.id===id);if(!x)return;
  $$('.tb-dd.open').forEach(d=>d.classList.remove('open'));
  if(!x.da_doc){x.da_doc=true;S.tb=Math.max(0,S.tb-1);veSoChuong();docChuong(id)}
  const trang=x.bang==='chi'?'chi':x.bang==='dieu_chuyen'?'dieu_chuyen':x.bang==='kt_kiot'?'cd_kiot':null;if(!trang||!coXem(trang))return;
  if(trang==='cd_kiot'){go('cd_kiot');return}
  // thông báo gộp (vd nhiều đề xuất chi từ Kiot) → mở tab chờ kế toán kiểm, lọc nguồn Kiot
  if(!x.dong_id){if(trang==='chi'){S.f.chi_tt='cho_duyet';S.f.chi_nguon=x.loai==='chi_kiot'?'kiot':''}setKy('nam',true);go(trang);return}
  // mở trang + kỳ "Từ 1/9" để chắc chắn thấy phiếu, đợi danh sách tải xong rồi mở đúng phiếu
  const k=trang==='chi'?'chi':'dc';delete S.cache[k];setKy('nam',true);if(trang==='chi')S.f.chi_tt='tat_ca';
  S.page=trang;location.hash=trang;shell();
  for(let i=0;i<80;i++){await new Promise(r=>setTimeout(r,100));const c=S.cache[k];if(!c)continue;
    if(c.find(r=>r.id===x.dong_id))trang==='chi'?xemChi(x.dong_id):formDC(x.dong_id);else toast('Phiếu không còn (đã xoá) hoặc anh/chị không có quyền xem');return}}

// 16/10: phiếu đã thanh toán không cần ghi trên Kiot (chi ngoài hệ thống cửa hàng…) → bỏ khỏi danh sách đối soát, ghi lý do
async function khongCanKiot(id,ngay){const ly=prompt('Lý do không cần ghi phiếu chi này trên Kiot (vd: chi công ty, chi ngoài hệ thống cửa hàng):');if(ly===null)return;
  if(!ly.trim())return alert('Cần ghi lý do');
  try{const ds=await rpc('kt_ds',{p_bang:'chi',p_tu:ngay,p_den:ngay});const x=ds.find(c=>c.id===id);if(!x)throw new Error('Không tìm thấy phiếu #'+id);
    const o={...x};['tao_luc','sua_luc','duyet_luc','kiem_luc'].forEach(k=>delete o[k]);o.kiot='khong_tao';o.kiot_ly_do=ly.trim();
    await rpc('kt_luu_chi',{p_dong:o});toast('Đã bỏ khỏi đối soát Kiot');render()}catch(e){alert(e.message)}}
async function moLoi(bang,id){
  if(bang==='tai_khoan'){S.f.dt_view='tk';S.f.dt_tk=id;setKy('thang',true);go('dong_tien');return}
  if(bang!=='chi'&&bang!=='dieu_chuyen')return;
  const k=bang==='chi'?'chi':'dc';delete S.cache[k];setKy('nam',true);if(bang==='chi')S.f.chi_tt='tat_ca';S.f.chi_nguon='';
  S.page=bang;location.hash=bang;shell();
  for(let i=0;i<80;i++){await new Promise(r=>setTimeout(r,100));const c=S.cache[k];if(!c)continue;if(c.find(r=>r.id===id))bang==='chi'?xemChi(id):formDC(id);else toast('Không thấy phiếu trong kỳ');return}}

    (l.length?nhom.map(n=>`<div class="sec">${esc(n)}${(c=>c?` <span class="badge" style="margin-left:6px">còn ${c} câu</span>`:'')(l.filter(x=>x.nhom===n&&!x.tra_loi).length)}</div>`+l.filter(x=>x.nhom===n).map(x=>`<div class="panel cauhoi ${x.tra_loi?'xong':''}" id="ch${x.id}">

  <div class="acts" style="margin-top:6px"><button class="btn pri" onclick="luuTL(${x.id})">Lưu trả lời</button></div></div>`}
function chonTL(id,i){const x=S.cache.ch.find(c=>c.id===id);const t=$('#tl'+id);const v=x.lua_chon[i];
  t.value=t.value&&!x.lua_chon.includes(t.value.split('\n')[0])?v+'\n'+t.value:v+(t.value.includes('\n')?t.value.slice(t.value.indexOf('\n')):'');t.focus()}

 ['chi_so','Phiếu chi · Số phiếu trong tháng','Số phiếu chi theo ngày sử dụng dịch vụ + số lần trả gốc vay trong tháng (trang Vay).','Bằng số dòng sheet đề nghị lọc theo ngày sử dụng.','19/10'],
 ['chi_so','Phiếu thu · Tổng thu tháng','Phiếu thu ĐÃ THU có ngày thu trong tháng; tách tiền mặt / ngân hàng.','Thu Kiot tự kéo + thu nhập tay. Điều chuyển nội bộ không tính.','19/10'],
 ['chi_so','Phiếu thu · Thu bán hàng / công nợ / đặt cọc / khác','Theo loại thu của phiếu (đã thu, trong tháng). Thu khác = mọi loại còn lại (lãi NH, hoàn tiền, vốn góp…).','Bấm thẻ → lọc danh sách đúng loại.','19/10'],
 ['chi_so','Phiếu thu · Chưa thu','Phiếu thu trạng thái Chưa thu trong tháng.','','19/10'],
 ['chi_so','Sổ quỹ · Tổng số dư (sổ sách)','Tồn đầu kỳ của tài khoản (ngày mốc) + thu − chi ± điều chuyển ± vay, đến cuối ngày đang xem; cộng mọi tài khoản đang dùng.','Tiền mặt = két + quỹ quầy cửa hàng; Ngân hàng = các tài khoản ngân hàng.','19/10'],
 ['chi_so','Sổ quỹ · Thu / Chi trong kỳ','Tiền thật vào / ra tài khoản theo ngày thu / ngày chi, KHÔNG gồm điều chuyển nội bộ.','Khác \"Chi phí hạch toán\" ở Tổng quan (theo tháng sử dụng / phân bổ).','19/10'],
 ['chi_so','Sổ quỹ · Kiểm két hôm nay','Số đếm két cuối ngày (thủ quỹ nhập) so với số dư sổ sách cuối ngày.','Lệch → Đối soát lỗi tự báo.','19/10'],
 // ── DỮ LIỆU CHUNG
 ['chung','Phạm vi dữ liệu','Số chuẩn tính từ 01/09/2026; trước đó là số tham khảo.','Việc / câu hỏi chỉ dính trước T9 đóng tạm; HĐ đỏ chưa nhận đếm từ 01/09.','09/10'],
 ['chung','Phạm vi dữ liệu','Có dữ liệu cả năm 2026: Kiot và chi từ 01/01, điều chuyển từ 01/05, số dư tài khoản từ 01/09.','Trước 01/09 sheet cũ không ghi thu ngoài Kiot (lãi, hộ trả tiền, GĐ nộp…) → kỳ trước 01/09 có nhãn cảnh báo, không hiện số dư.','09/10'],
 ['chung','Phạm vi dữ liệu','Mỗi tài khoản có tồn đầu tại 1 ngày mốc (mặc định 01/09/2026); phát sinh trước mốc không tính.','Xem bảng "Mốc tồn đầu" ở tab Danh mục.','05/10'],
 ['chung','Phạm vi dữ liệu','Không gồm 2 nhà hàng AMHP (Saikung / Hongkong).','Đã ẩn phiếu thu / chi của nhà hàng (trước 01/09, không ảnh hưởng số dư).','12/10'],
 ['chung','Phạm vi dữ liệu','Shidai = Công ty THT (Tổng kho sỉ Shidai trên Kiot).','','12/10'],
 ['chung','Phạm vi dữ liệu','Loại chi tháng 1–4 (sheet không ghi) do hệ thống tự gán theo mẫu phiếu từ T5.','Từ 22/10 phiếu chỉ giữ mục cha; mục con do bước phân loại 23:00 hằng ngày gán (xem dòng "Loại chi: chọn mục cha, mục con tự động").','22/10'],
 ['chung','Phân quyền','Đăng nhập tài khoản + mật khẩu riêng của app kế toán; sai 5 lần khoá 15 phút.','Không dùng chung tài khoản app MKT/Sale.','05/10'],
 ['chung','Phân quyền','Supreme / Admin toàn quyền; người khác tick từng trang: Xem / Nhập-sửa.','Quyền kiểm ở máy chủ, không chỉ ẩn nút.','05/10'],
 ['chung','Phân quyền','Quyền chi: "Kế toán kiểm lượt 1 & thanh toán" · "Giám đốc xác nhận lượt 2" (tick riêng, không theo Toàn quyền) · "Chỉ tạo đề nghị".','Tài khoản anh Hải luôn có quyền GĐ xác nhận.','08/10'],
 ['chung','Phân quyền','Trang mới phải tick quyền riêng: Tạm ứng & hoàn ứng, Khoá kỳ / chốt tháng.','Báo cáo quản trị 3–8 theo quyền trang P&L.','15/10'],
 ['chung','Nhật ký','Mọi thêm / sửa / xoá ghi nhật ký (ai, lúc nào, nội dung). Xoá = ẩn, không mất dữ liệu.','','05/10'],
 ['chung','Chứng từ','Thu, Chi, Điều chuyển, Vay, Tạm ứng, Kiểm két đều đính kèm được ảnh / PDF / Excel / Word.','Kéo thả, Ctrl+V, hoặc chọn file; ảnh tự nén; tối đa 15 MB / file.','08/10'],
 ['chung','Chứng từ','Kho file riêng tư: chỉ người có quyền xem trang mới mở được; link xem sống 5 phút.','','08/10'],
 ['chung','Chuông thông báo','Chuông trên menu báo việc cần làm theo đúng người; bấm thông báo mở đúng phiếu.','Chi: phiếu mới → kế toán; KT kiểm → GĐ; GĐ duyệt → KT thanh toán + người tạo.','08/10'],
 ['chung','Nhập liệu','Ô bắt buộc có dấu * đỏ; thiếu thì không lưu được.','Phiếu cũ thiếu thông tin: sửa lại phải điền đủ.','15/10'],
 ['chung','Nhập liệu','Tài khoản, cơ sở, bộ phận, loại thu / chi, ngân hàng chỉ chọn từ danh sách.','Danh mục sửa ở Cài đặt.','05/10'],
 ['chung','Xuất Excel','Mọi nút Xuất Excel ra file .xlsx: cột tiền là số (#,##0), cột ngày là ngày, có lọc cột.','Cột mã phiếu / số tài khoản giữ dạng chữ.','15/10'],
 // ── THU CHI & NGÂN QUỸ
 ['thu_chi','Phiếu đề nghị','Mọi phiếu (trừ tạm ứng) bắt buộc chọn hoá đơn xuất về: Công ty / HKD Hiền Thủy / HKD Chánh Tâm — ô riêng, không liên quan ô Hoá đơn đỏ (hoá đơn trắng cũng chọn).','Kế toán + anh 16/10.','16/10'],
 ['thu_chi','Tạm ứng','Phiếu đề nghị tick TẠM ỨNG → tự tạo dòng ở Tạm ứng & hoàn ứng; từ chối / xoá / bỏ tick → tự gỡ (nếu chưa hoàn). Tạm ứng không tính chi phí.','Không bắt chọn đơn vị chịu chi phí / hoá đơn — quyết toán khi hoàn ứng. Vẫn là tiền ra ở Dòng tiền.','16/10'],
 ['thu_chi','Phiếu trang chủ','2 lựa chọn: Đề nghị thanh toán | Tạm ứng & hoàn ứng (bên trong: Xin tạm ứng / Hoàn ứng = trả lại tiền đã ứng).','Hoàn ứng không chi tiền, không là chi phí.','16/10'],
 ['thu_chi','Hồ sơ phiếu trang chủ','Bắt buộc đính kèm ảnh / PDF cho cả 3 loại; hoàn ứng = ảnh chuyển khoản / biên nhận nộp tiền.','Anh 16/10.','16/10'],
 ['thu_chi','Nối hoàn ứng','Kế toán nối phiếu hoàn ứng vào phiếu tạm ứng ngay trong cửa sổ phiếu (khung Tạm ứng · hoàn ứng / Nối vào phiếu tạm ứng) → xác nhận tiền về → clear.','Cũng làm được ở trang Tạm ứng & hoàn ứng.','16/10'],
 ['thu_chi','Clear tạm ứng','Khoản tạm ứng chỉ "Đã clear" khi tiền trả lại đã về và kế toán bấm Xác nhận tiền về (tạo phiếu thu "Thu hoàn ứng" vào tài khoản nhận). Chưa đủ → "Đã tạm ứng · chưa clear", theo dõi ở Tạm ứng & hoàn ứng.','Anh 16/10.','16/10'],
 ['thu_chi','Tiền mặt quầy cửa hàng','Kiot thu tiền mặt ở quầy Hiền Thủy / Chánh Tâm vào quỹ "TIỀN MẶT QUẦY CỬA HÀNG (chưa nộp két)", KHÔNG vào thẳng két. Cửa hàng nộp tiền về két = điều chuyển quầy → két (đúng ngày nộp, như file dòng tiền).','Anh 16/10 (khớp file dòng tiền). Số dư quầy = tiền cửa hàng đang giữ chưa nộp.','16/10'],
 ['thu_chi','Chờ tôi xử lý — thủ quỹ','Tài khoản thủ quỹ chỉ thấy phiếu đến lượt mình: đã xác nhận, đi tiền từ két / TK thủ quỹ chi, chưa lập lệnh.','Kế toán 22/10. Admin / Supreme / giám đốc vẫn thấy như cũ.','22/10'],
 ['thu_chi','Loại chi ẩn','Bỏ khỏi ô chọn: COGS - Giá vốn & Nhập hàng, CAPEX - Đầu tư, FINANCE - Lãi vay & phí tài chính / Trả gốc vay / Trả thẻ tín dụng.','Kế toán 22/10. Phiếu cũ giữ loại; bật lại ở Danh mục nếu cần.','22/10'],
 ['thu_chi','Tài khoản ngừng dùng','Bỏ tick "Đang dùng" ở Cài đặt → Danh mục: ẩn khỏi lựa chọn, số dư, tổng tồn; phiếu cũ giữ nguyên tên TK.','Xem lại: Sổ quỹ → "TK ngừng dùng".','16/10'],
 ['thu_chi','Tiền vào / ra / tồn','Tiền vào = phiếu thu Đã thu, theo ngày thu.','','05/10'],
 ['thu_chi','Tiền vào / ra / tồn','Tiền ra = phiếu chi Đã thanh toán, theo ngày thanh toán.','Phiếu chờ duyệt / chờ thanh toán / từ chối không tính.','05/10'],
 ['thu_chi','Tiền vào / ra / tồn','Điều chuyển nội bộ không tính vào thu / chi; chỉ giảm TK đi, tăng TK nhận.','Sheet cũ cộng cả điều chuyển nên thu / chi bị đội.','05/10'],
 ['thu_chi','Tiền vào / ra / tồn','Tồn TK = tồn đầu + thu − chi + điều chuyển nhận − điều chuyển đi.','TK tồn âm báo đỏ — thường do thiếu phiếu.','05/10'],
 ['thu_chi','Phiếu thu','Trạng thái chỉ có Đã thu / Chưa thu.','','14/10'],
 ['thu_chi','Phiếu thu','Thu từ Kiot tự kéo 15 phút / lần, chỉ xem — sai thì sửa trên Kiot.','Thu ngoài Kiot (vốn, vay, hoàn BHXH…) nhập tay trên app.','14/10'],
 ['thu_chi','Phiếu thu','Bấm thẻ số (Thu bán hàng / công nợ / đặt cọc / khác) → bảng lọc đúng khoản đó.','','15/10'],
 ['thu_chi','Phiếu thu','Lọc theo tài khoản → hiện tổng đã thu của tài khoản đó.','Phiếu chi tương tự: tổng đã chi.','15/10'],
 ['thu_chi','Phiếu chi — xuất phiếu','Nút "Xuất phiếu Word" trong cửa sổ phiếu: giấy xác nhận nhận tiền (.doc mở bằng Word) để in cho người nhận ký.','Chỉ thông tin phổ thông: số phiếu, ngày, nội dung, số tiền + bằng chữ, hình thức, người nhận (+ TK nhận nếu chuyển khoản), người đề nghị, bộ phận. Không có phân bổ chi phí, loại chi, tài khoản công ty. 1 chỗ ký: người nhận tiền.','16/10'],
 ['thu_chi','Hạch toán — phiếu chi / thu / điều chuyển','Tạo phiếu bắt buộc chọn Hạch toán: Có (giao dịch công ty) / Không (cá nhân); chọn Không thì khoá đơn vị chịu chi phí, tháng hạch toán (chi) / cơ sở (thu). Trong cửa sổ phiếu chi, mục Phân bổ có ô "Có hạch toán chi phí": bỏ tick = khoản cá nhân, khoá phần phân bổ.','Vẫn trừ tiền tài khoản (sổ quỹ, dòng tiền, số dư) nhưng KHÔNG vào chi phí hạch toán, P&L, báo cáo quản trị; không bắt buộc loại chi.','19/10'],
 ['thu_chi','Phiếu chi — chi tiền mặt','Đi tiền từ két tiền mặt: thủ quỹ ghi Người đến nhận tiền (bắt buộc) + up ảnh phiếu chi có ký nhận rồi mới bấm Đã chi tiền.','Không phải chuyển khoản nên không có uỷ nhiệm chi — tên người nhận thay cho thông tin người thụ hưởng.','16/10'],
 ['thu_chi','Phiếu chi — luồng duyệt','Đề nghị → Giám đốc / kế toán XÁC NHẬN + chọn tài khoản đi tiền → Thủ quỹ (két + 3 TK công ty) hoặc Giám đốc (TK cá nhân) chi tiền + up ảnh giao dịch → Đã thanh toán.','Kế toán không tự duyệt lượt 2. Giám đốc / Supreme bấm Duyệt = qua luôn 2 bước; GĐ có thể từ chối / trả lại.','16/10'],
 ['thu_chi','Phiếu chi — luồng duyệt','Thanh toán bắt buộc: ngày thanh toán, tài khoản chi, loại chi.','','05/10'],
 ['thu_chi','Phiếu chi — luồng duyệt','Kế toán tự chi tick "Đã thanh toán luôn" — không cần GĐ xác nhận.','','09/10'],
 ['thu_chi','Phiếu chi — thanh toán','Bấm Đã thanh toán: ngày, tài khoản chi, loại chi + đính kèm ảnh uỷ nhiệm chi (tuỳ chọn). Không còn hỏi "ảnh hưởng tài khoản cửa hàng trên Kiot".','Kiot chỉ để đối soát: hệ thống tự tìm phiếu chi Kiot cùng tiền / tài khoản ±5 ngày. Ảnh UNC lưu thành chứng từ của phiếu (tên UNC_…). Link UNC cũ vẫn mở được.','16/10'],
 ['thu_chi','Phiếu chi — đề nghị','Màn đầu app: trái là phiếu đề xuất thanh toán (không cần tài khoản), phải là đăng nhập; gửi xong vào thẳng Chờ kế toán kiểm.','Tối đa 10 phiếu / giờ / máy; chặn gửi trùng trong 30 phút. Điện thoại: 2 tab.','15/10'],
 ['thu_chi','Phiếu chi — đề nghị','Đã đăng nhập: tạo bằng nút "+ Tạo phiếu chi" ở trang Phiếu chi (bỏ nút Đề xuất thanh toán trên đầu trang — trùng). Người không có tài khoản: gửi qua link công khai màn đăng nhập.','','16/10'],
 ['thu_chi','Phiếu chi — đề nghị','Hình thức nhận tiền: Chuyển khoản → bắt buộc ngân hàng + số tài khoản; Tiền mặt → không cần.','','15/10'],
 ['thu_chi','Phiếu chi — đề nghị','Đơn vị chịu chi phí lúc đề nghị: chọn 1 (Tổng công ty / HT / CT / SD); chia nhiều đơn vị làm ở tab Phân bổ.','','14/10'],
 ['thu_chi','Phiếu chi — hiển thị','Tổng chi = CHỈ phiếu đã thanh toán (tách tiền mặt / ngân hàng). Tổng đề nghị = mọi phiếu trong tháng trừ từ chối (gồm cả chưa thanh toán).','Tháng theo ngày sử dụng dịch vụ. Trả gốc vay không tính.','16/10'],
 ['thu_chi','Phiếu chi — hiển thị','Nhà cung cấp = người bán trên HĐ đã ghép → thụ hưởng (nếu khác người đề nghị) → đối tác Kiot.','Thụ hưởng = người đề nghị → "Hoàn cho NV".','15/10'],
 ['thu_chi','Phiếu chi — hiển thị','Cột Loại chi tách riêng; phiếu Kiot chưa phân loại hiện nhóm Kiot.','','15/10'],
 ['thu_chi','Phiếu chi — QR','Phiếu chưa thanh toán có ngân hàng + số TK → tự tạo mã QR VietQR (số tiền, nội dung điền sẵn). QR tĩnh: quét xong sửa được nội dung.','Tạo trên máy, không gửi số TK ra ngoài. Thiếu số TK → dòng nhắc bổ sung. Một số app ngân hàng vẫn tự khoá ô nội dung khi QR có sẵn nội dung — do app ngân hàng, không chỉnh được từ mã.','16/10'],
 ['thu_chi','Phiếu chi — từ Kiot','Phiếu chi & duyệt thanh toán CHỈ gồm luồng đề nghị thanh toán (sheet đề nghị / phiếu trên app). Phiếu chi Kiot chỉ để đối chiếu, không vào danh sách duyệt.','Phiếu Kiot (chi két quầy CTM, trả khách TTTH, ngân hàng tự trích nợ…) xem ở Sổ quỹ; 67 đề xuất Kiot cũ đã ẩn 16/10.','16/10'],
 ['thu_chi','Phiếu chi — tháng','Phiếu chi thuộc tháng theo NGÀY SỬ DỤNG DỊCH VỤ (cột F sheet đề nghị), thiếu thì theo ngày đề nghị — số phiếu khớp sheet.','Trả gốc vay không phải chi phí → trang Vay, thẻ "Số phiếu trong tháng" ghi thêm "+N trả gốc vay" để cộng ra đúng số dòng sheet. Phiếu tháng trước còn chờ: nút "Tháng trước còn chờ". Kiot: chỉ ở Đối soát lỗi (phiếu đã thanh toán chưa thấy trên Kiot).','16/10'],
 ['chung','Tự kiểm Supabase','Job kt-kiem-he-thong 09:00 ngày 15 + ngày cuối tháng: đo dữ liệu, kho chứng từ, nhật ký, lịch chạy lỗi, kéo Kiot, khoá RLS / quyền anon → chuông cho Supreme (luôn có tóm tắt, có vấn đề ghi rõ cảnh báo).','Gói Pro: cảnh báo khi dữ liệu > 4 GB, kho > 50 GB, tăng > 5 GB kho / 1 GB dữ liệu giữa 2 lần kiểm, có bảng tắt RLS. Băng thông không đo được từ SQL — xem Dashboard.','16/10'],
 ['chung','Xem như','Admin (Supreme) và giám đốc bấm icon người cạnh chuông (hoặc nút Xem như ở trang Phân quyền) → app mở đúng như tài khoản đó thấy (menu, nút, dữ liệu theo quyền của họ). Thanh vàng trên cùng → Thoát Xem như.','Chỉ xem: máy chủ chặn mọi lệnh thêm / sửa / xoá trong phiên Xem như. Phiên tự hết hạn sau 2 giờ.','16/10'],
 ['chung','Xem như — giữ trang','Bật / đổi / thoát Xem như: app ở nguyên trang, tab và bộ lọc đang xem, chỉ đổi giao diện theo tài khoản được chọn.','Tài khoản đó không có quyền trang đang xem → về trang đầu tiên tài khoản đó được xem.','19/10'],
 ['thu_chi','Phiếu chi — hoạt động','Khung Hoạt động trong cửa sổ phiếu: lưu vết từ lúc tạo (mọi lần đổi trạng thái / sửa, trường nào đổi từ → sang, chứng từ, ảnh giao dịch) + bình luận.','Bình luận báo chuông cho người trong phiếu: người tạo / đề nghị, người xác nhận, người đã bình luận, người đang phải xử lý bước hiện tại. Xoá được bình luận của mình.','16/10'],
 ['thu_chi','Phiếu chi — loại chi','Kế toán đổi Loại chi ngay trên bảng Phiếu chi (ô chọn ở cột Loại chi), lưu luôn.','Phiếu đã thanh toán bắt buộc có loại chi; kỳ đã khoá thì không đổi được.','16/10'],
 ['chung','Lọc cơ sở','Chỉ 1 ô lọc cơ sở ở thanh trên (cạnh ô kỳ), tick chọn 1 hoặc nhiều cơ sở cùng lúc; áp dụng cho mọi trang. Bỏ ô cơ sở trong từng trang và ở cột lọc bên trái.','Bỏ tick hết = Tất cả cơ sở. Bấm tên cơ sở trên dòng phiếu chi vẫn lọc nhanh theo cơ sở đó.','19/10'],
 ['chung','Người đang trong app','Thanh trên cạnh chuông: avatar con vật của những ai đang mở app (rê chuột xem tên + trang đang xem). Như app MKT, ảnh con vật lấy từ app MKT.','Mỗi trình duyệt 30 giây báo danh 1 lần (kt_bao_danh, bảng kt_dang_xem riêng app kế toán); quá 90 giây không báo = đã thoát; đăng xuất = rời ngay. Lúc Xem như không báo danh.','19/10'],
 ['thu_chi','Huỷ "Đã chi tiền"','Phiếu đã bấm Đã chi tiền nhầm (vd chưa duyệt lệnh ngân hàng): người xác nhận (kế toán có quyền xác nhận) hoặc giám đốc bấm "↩ Huỷ đã chi" ở chân cửa sổ phiếu → về Chờ chi tiền.','Không phải tạo lại phiếu; tiền không còn trừ tài khoản cho tới khi bấm Đã chi tiền lại; chuông báo người chi; nhật ký ghi lại.','20/10'],
 ['thu_chi','Nộp két từ Kiot (quầy → két)','Mỗi lần cửa hàng nộp doanh thu tiền mặt trên Kiot (cặp phiếu Chuyển rút CTM… chi tiền mặt quầy + TTD_CTM… thu vào Két) → app tự tạo điều chuyển "Nộp két" TIỀN MẶT QUẦY → KÉT TIỀN MẶT, 15 phút / lần. Phiếu Kiot bị huỷ → app ẩn theo.','Đã có điều chuyển quầy → két cùng số tiền, lệch ≤ 4 ngày (từ file dòng tiền / nhập tay) thì chỉ gắn mã Kiot, không tạo trùng. Thủ quỹ up ảnh chứng từ nộp tiền vào chính phiếu điều chuyển đó; kế toán xem ảnh rồi bấm Xác nhận.','19/10'],
 ['thu_chi','Nội dung chuyển khoản','Người làm phiếu (link công khai hoặc trên app) điền ô Nội dung chuyển khoản (tối đa 25 ký tự). Mã QR trên phiếu gài sẵn nội dung đó; để trống thì gài số phiếu + nội dung chi.','Quét QR: app ngân hàng điền sẵn nội dung, người chuyển vẫn sửa được. App ngân hàng nào khoá ô nội dung thì bấm "Bỏ nội dung khỏi mã" dưới mã QR.','20/10'],
 ['thu_chi','Chuyển khoản TK công ty: lập lệnh → duyệt lệnh','Thủ quỹ lập lệnh trên ngân hàng, up ảnh lệnh (UNC), bấm "✓ Đã lập lệnh" → chuông báo kế toán. Kế toán duyệt lệnh trên ngân hàng xong bấm "✓ Đã duyệt lệnh" (ngày thanh toán mặc định hôm duyệt). Tab Cần chú ý: Chờ duyệt lệnh.','Chỉ khi Đã duyệt lệnh phiếu mới thành Đã thanh toán và trừ số dư — hết lệch khi lập lệnh hôm trước, duyệt hôm sau. Két tiền mặt vẫn bấm Đã chi tiền như cũ.','20/10'],
 ['thu_chi','Thủ quỹ xác nhận nhận tiền vào két','Phiếu thu / điều chuyển vào két: thủ quỹ bấm "✓ Đã nhận tiền" khi nhận đủ tiền mặt (tab Chờ thủ quỹ nhận ở Phiếu thu, Điều chuyển). Điều chuyển vào két (vd quỹ cửa hàng → két): thủ quỹ nhận = xác nhận; tài khoản admin kế toán không bấm xác nhận được.','Chưa bấm vẫn tính vào số dư két — kiểm két cuối ngày sẽ lộ nếu chưa nhận thật.','20/10'],
 ['thu_chi','Khoản tài khoản tự trừ','Phí ngân hàng, phí vận chuyển / COD… (tài khoản tự trừ): tạo phiếu chi, tick "Đã thanh toán luôn" (quyền tự chi). Bỏ nút "+ Khoản tự trừ" riêng (21/10).','','21/10'],
 ['thu_chi','Sửa ngày thanh toán phiếu đã chi','Người có quyền sửa Chi mở phiếu đã chi → đổi ô Ngày thanh toán → Lưu (vd ngân hàng trừ tiền khác ngày ghi trên phiếu, lệch quỹ cuối ngày).','Tháng đã khoá sổ không đổi được. Nhật ký ghi ngày cũ → ngày mới.','21/10'],
 ['thu_chi','Kế toán tự chi không cần duyệt','Tài khoản có quyền "Chi — tự chi không cần duyệt" tạo phiếu chi tick "Đã thanh toán luôn" (vd phiếu cân tài khoản cuối ngày).','Mỗi phiếu tự chi có chuông báo giám đốc; vẫn nhắc Thiếu ảnh giao dịch.','20/10'],
 ['thu_chi','Tự chi: phiếu đang chờ + chọn nhiều phiếu','Phiếu mình tạo còn chờ duyệt: nút "✓ Tự chi (đã thanh toán)" trong phiếu. Tick chọn nhiều phiếu trên bảng → "✓ Tự chi n phiếu" (chọn tài khoản, ngày, loại chi 1 lần) hoặc "✓ Đã duyệt lệnh n phiếu" (kế toán).','Tick "Đã thanh toán luôn" thì không cần thông tin người nhận tiền.','21/10'],
 ['bao_cao','P&L theo danh mục như sheet','Chi phí chia 9 nhóm cha giống sheet BÁO CÁO P&L (1 Nhân sự · 2 Sales Online phân bổ · 3 Kho tổng phân bổ · 4 Tổng công ty phân bổ · 5 Marketing · 6 Cửa hàng · 7 Đóng gói & vận chuyển · 8 Sửa chữa & khấu hao · 9 Khác) + mục con 1.1 … 9.4 (5.1 có 5.1.1–5.1.5). Bấm ▸ ở nhóm cha để mở mục con; bấm dòng để xem danh sách phiếu.','Loại OPEX cũ đã ẩn; 771 phiếu cũ hệ thống tự gán sang mục con theo nội dung → Phiếu chi: chip Loại tự gán — cần soát, bấm ✓ (hoặc tick nhiều → ✓ Đúng loại n phiếu) hoặc đổi loại là xong. Ô chọn loại chỉ hiện mục con, có mã.','21/10'],
 ['bao_cao','Đơn đặt: nhóm nào được tính','Đơn KiotViet tạo trong kỳ chia nhóm: Đã đi hàng · Đã cọc chưa đi · Nghi đã đi hàng → TÍNH (số đơn, giá trị, tỷ lệ đi hàng). Báo giá chưa cọc (phiếu tạm) · Báo giá không chốt (huỷ khi chưa cọc) · Huỷ thật (đã cọc mà không lấy / COD trả lại) · Hàng tặng / mẫu / khuyến mãi (đơn hoàn thành 0đ) → KHÔNG tính.','Anh 22/10. Cọc theo luật app MKT (kt_v_don_coc). Tổng quan và Hiệu suất đơn dùng chung cách chia.','22/10'],
 ['bao_cao','Dòng tiền khớp phân loại chi phí','Báo cáo dòng tiền đặt tên + thứ tự loại chi giống báo cáo chi phí (theo danh mục). Giao dịch cá nhân tách mục riêng "IV. Giao dịch cá nhân".','Vẫn tính vào tiền thuần trong kỳ và số dư (tiền thật đi qua tài khoản).','21/10'],
 ['thu_chi','Form phiếu chi 4 nhóm','Đề nghị · Hạch toán & hoá đơn · Người nhận tiền · Ghi chú & thanh toán.','','21/10'],
 ['chung','Loại thu / chi — nhóm cha, mục con','Cài đặt → Loại thu / chi xếp cây: nhóm cha (in đậm, ▶ đóng / mở) → mục con → mục cháu. Sửa loại có ô Mã, Nhóm cha, tick "Là nhóm" (nhóm chỉ để gom, không chọn trên phiếu). Nút "+ mục con" trên dòng nhóm.','Kế toán 22/10. Mục con mới lấy sẵn nhóm báo cáo + cách chia của nhóm cha. P&L / báo cáo đọc cùng cây này.','22/10'],
 ['thu_chi','Loại chi: chọn mục cha, mục con tự động','Ô Loại chi trên phiếu / form / bộ lọc chỉ có 9 mục cha (1 Nhân sự … 9 Khác). 23:00 hằng ngày hệ thống đọc mục cha + nội dung + người nhận, gán mục con theo bảng từ khoá; mục cha không có con thì mục con = chính nó.','Mục con chỉ hiện trong chi tiết phiếu, không sửa được. Không đoán được → "Loại chi KXĐ" (dải Cần chú ý); chỉ giám đốc chọn mục con. Đổi mục cha → mục con xoá, đêm đó phân loại lại. P&L tính theo mục con.','22/10'],
 ['thu_chi','Phiếu chi — 3 loại hạch toán','Hạch toán (chi phí công ty) · Không hạch toán (khoản công ty không tính chi phí, vd nộp lại BHXH — ở nhóm Giao dịch công ty) · Chi phí cá nhân (tự là không hạch toán, sang nhóm Giao dịch cá nhân). Chọn ở form tạo phiếu và ô Hạch toán trong mục Phân bổ của cửa sổ phiếu.','Anh + kế toán 22/10. Hai loại không hạch toán đều không vào chi phí / P&L, vẫn trừ tiền tài khoản. Báo cáo dòng tiền: chỉ chi phí cá nhân vào mục IV. Giao dịch cá nhân. Phiếu thu / điều chuyển giữ 2 lựa chọn.','22/10'],
 ['thu_chi','Giao dịch cá nhân','Phiếu chi / thu / điều chuyển chọn Hạch toán: Không — giao dịch cá nhân → không hỏi đơn vị chịu chi phí, hoá đơn đỏ, hoá đơn xuất về, loại chi / loại thu. Mỗi trang có nút Giao dịch công ty / Giao dịch cá nhân để xem riêng, không lẫn.','Không vào báo cáo kết quả kinh doanh; vẫn tính vào số dư tài khoản (tiền thật đi qua tài khoản).','20/10'],
 ['thu_chi','Sổ quỹ theo ngày — chi tiết','Bấm 1 ngày trong Sổ quỹ theo ngày → xổ ra từng khoản thu / chi / điều chuyển / vay của ngày đó; bấm số phiếu để mở.','','20/10'],
 ['chung','Chat trong app','Nút chat cạnh chuông: Nhóm chung (mọi tài khoản) + nhắn riêng 1-1. Mã phiếu trong tin (PC… / PT… / DC…) bấm là mở thẳng phiếu; cửa sổ phiếu chi có nút "Gửi vào chat" điền sẵn mã phiếu.','Không realtime (bảng kt_ khoá RLS): mở khung chat hỏi máy chủ 3 giây / lần, đóng 15 giây / lần; có tin mới → số chưa đọc + tiếng bzzz. Tin cuối của mình hiện "Đã xem" (nhóm chung: tên người đã xem). Rê chuột vào tin → nút ✓ đánh dấu "Đã xử lý" (hiện tên người xử lý, bấm lại để bỏ). Lúc Xem như không gửi / đánh dấu được.','19/10'],
 ['chung','Bình luận: @nhắc tên, Nhắc việc, âm báo','Ô bình luận trong phiếu (chi, thu, điều chuyển, tạm ứng, vay): gõ @ chọn tên người có tài khoản app kế toán → người đó nhận chuông. Tick "Nhắc việc" → bình luận thành việc cần làm: nhãn "Cần bổ sung" trên phiếu + mục lọc ở dải Cần chú ý, tới khi bấm "✓ Đã xong".','Việc nhắc mở quá 2 ngày: 8:00 sáng hằng ngày báo chuông lại người ghi + kế toán (lịch kt-nhac-viec). Có thông báo mới: tiếng "bzzzz" rung + màn hình rung nhẹ như BUZZ Yahoo ngày xưa (tự tổng hợp, sau khi đã bấm vào trang 1 lần). Người gửi phiếu không có tài khoản: không nhắc — giám đốc / kế toán up thay.','19/10'],
 ['chung','Báo có bản mới','Mỗi lần đẩy bản mới, scripts/dong-dau.js ghi số phiên bản vào phien-ban.txt. App kiểm ngay 4 giây sau khi mở, rồi mỗi phút và lúc quay lại tab; có bản mới → hiện nút "Đã có bản cập nhật mới · Tải lại" ở đáy màn hình (như app MKT).','Không đang mở cửa sổ nhập liệu → đếm 10 giây rồi tự tải lại; đang nhập dở → chỉ hiện nút, bấm Tải lại khi xong. Lúc Xem như thì không báo.','19/10'],
 ['chung','Quyền Hệ thống & cài đặt','Cả mục Hệ thống & cài đặt (danh mục, phân quyền, nhật ký, Kiot, cần giải đáp, logic) là 1 quyền riêng: Supreme, Admin (toàn quyền), giám đốc, hoặc ai được tick "Hệ thống & cài đặt". Đổi mật khẩu mở cho mọi tài khoản.','Đổi quyền / vị trí / tên đăng nhập của 1 tài khoản → app người đó tự tải lại (như F5) trong vòng 1 phút, không phải đăng nhập lại; đang mở cửa sổ nhập liệu thì tải lại khi đóng. Trừ Supreme. Khoá tài khoản / đặt lại mật khẩu vẫn đăng xuất.','19/10'],
 ['chung','Phân quyền theo menu · Sổ quỹ 4 quyền','Trang Phân quyền xếp nhóm đúng menu trái (Tổng quan · Thu chi & Ngân quỹ · Công nợ · Hoá đơn & Thuế · Báo cáo · Hệ thống). Sổ quỹ chia 4 quyền theo 4 tab: Số dư tài khoản · Sổ quỹ theo ngày · Kiểm két cuối ngày · Quỹ tiền mặt cửa hàng — chỉ thấy tab, thẻ số và dữ liệu được cấp (máy chủ chặn phần còn lại).','Tài khoản có quyền Sổ quỹ cũ = đủ 4 quyền; mở sửa ở Phân quyền rồi Lưu là đổi sang 4 quyền mới. Quyền của trang ẩn (không hiện trên bảng) giữ nguyên khi lưu.','21/10'],
 ['thu_chi','Cửa sổ phiếu chi — 1 nút Lưu','Trong cửa sổ phiếu chi, đổi ô nào (hạch toán, phân bổ, hoàn quỹ, hoá đơn đỏ, hoá đơn xuất về, tài khoản đi tiền, loại chi…) cũng CHƯA lưu; bấm Lưu ở chân cửa sổ mới lưu hết.','Nút chuyển bước (Xác nhận, Đã chi tiền, Từ chối…) cũng lưu hết các thay đổi rồi mới chuyển bước. Đóng cửa sổ không bấm Lưu = bỏ thay đổi.','19/10'],
 ['thu_chi','Phiếu chi — chờ chi tiền: tiền mặt / chuyển khoản','Mỗi phiếu chờ chi có nhãn "Tiền mặt · KÉT…" hoặc "Chuyển khoản · <tài khoản>" (thẻ Chờ chi tiền chỉ còn tổng tiền + số phiếu — anh 19/10 bỏ khối chia theo tài khoản).','Đổi tài khoản đi tiền sau khi đã xác nhận: người xác nhận (kế toán có quyền xác nhận / giám đốc) bấm "Đổi tài khoản đi tiền" trong phiếu, báo chuông người chi mới; thủ quỹ không tự đổi được.','19/10'],
 ['thu_chi','Phiếu chi — hoá đơn đỏ theo HKD','Thủ quỹ theo dõi thủ công hoá đơn đỏ xuất về 2 HKD: thấy mọi phiếu ĐÃ CHI có cần hoá đơn, sửa được "Hoá đơn xuất về" + Đã nhận / ngày nhận trong cửa sổ phiếu.','Thẻ "Chưa nhận HĐ" chia theo HKD Hiền Thủy / HKD Chánh Tâm / Công ty / Chưa ghi xuất về (bấm để lọc); bộ lọc "HĐ xuất về" trên danh sách.','19/10'],
 ['thu_chi','Phiếu chi — thiếu ảnh giao dịch','Phiếu ĐÃ CHI từ 01/09/2026 chưa có ảnh giao dịch (file "UNC…" up ở ô Ảnh giao dịch, hoặc link UNC cũ từ sheet).','Nhắc admin up đủ: dải "Cần chú ý" → Thiếu ảnh giao dịch (theo tháng đang chọn) + Tổng quan → Cảnh báo & công việc cần xử lý (đếm từ 01/09).','19/10'],
 ['thu_chi','Phiếu chi — duyệt','Giám đốc / Supreme bấm Duyệt là qua luôn bước kế toán kiểm + giám đốc duyệt (cả 2 bước ghi tên người bấm) → Chờ thanh toán.','Kế toán chỉ kiểm lượt 1, không tự duyệt lượt 2 (không có quyền giám đốc). Duyệt thẳng vẫn cần có chứng từ.','16/10'],
 ['thu_chi','Phiếu chi — duyệt','Phiếu chưa có chứng từ đi kèm thì kế toán chưa kiểm được (lượt 1).','Dải "Cần chú ý" → Thiếu chứng từ. Chứng từ cũ trên Drive đã kéo về app.','16/10'],
 ['thu_chi','Phiếu chi — từ Kiot','Phiếu app đã đánh 4A cùng số tiền, lệch ≤ 5 ngày → ghép, không tạo mới; trùng nghi ngờ → nhãn "Nghi trùng".','','08/10'],
 ['thu_chi','Phiếu chi — từ Kiot','Phiếu Kiot bị huỷ → phiếu app chưa thanh toán tự chuyển Từ chối.','','08/10'],
 ['thu_chi','Quỹ ngoài cửa hàng','Phiếu Kiot chi bằng Quỹ ngoài KHÔNG tạo đề xuất chi.','Tránh tính 2 lần với phiếu hoàn quỹ.','15/10'],
 ['thu_chi','Quỹ ngoài cửa hàng','Chi phí quỹ ngoài ghi 1 lần ở phiếu hoàn quỹ ("thanh toán quỹ ngoài từ … đến …").','Lọc: Phiếu chi → nguồn "Phiếu hoàn Quỹ ngoài cửa hàng".','15/10'],
 ['thu_chi','Quỹ ngoài cửa hàng','Mở phiếu hoàn quỹ → bảng kê phiếu Kiot Quỹ ngoài từ lần hoàn trước, báo khớp / lệch với số đề nghị.','Phiếu mới không có chữ "quỹ ngoài" → kế toán chọn cửa hàng ở khung chi tiết.','15/10'],
 ['thu_chi','Loại chi','Loại tài chính tách 3: Trả gốc vay · Trả thẻ tín dụng · Lãi vay & phí tài chính.','Trả gốc vay là trả lại tiền mượn, KHÔNG phải chi phí: không cộng vào Tổng chi, Đã thanh toán, ngân sách; Dòng tiền xếp ở hoạt động tài chính.','15/10'],
 ['thu_chi','Loại chi','Phiếu chọn loại khác luật đã chốt → nhãn "Nghi sai loại", kế toán bấm Đổi / Giữ.','Thẻ tín dụng → FINANCE; phí NH, tiền điện, bù quỹ ngoài → OPEX Vận hành; phí CK nước ngoài, vận chuyển TQ → COGS.','09/10'],
 ['thu_chi','Điều chuyển — Kiot','Điều chuyển không còn ô "Ảnh hưởng tài khoản cửa hàng trên Kiot" (bỏ 19/10, như Phiếu chi 16/10).','Kiot chỉ để đối soát. Tiền cửa hàng nộp về két: ghi điều chuyển Tiền mặt quầy → Két.','19/10'],
 ['thu_chi','Điều chuyển','Nhập ngày, TK đi, TK nhận (khác nhau), số tiền; kế toán xác nhận ngay trên dòng.','Chưa xác nhận vẫn tính vào tồn.','14/10'],
 ['thu_chi','Sổ quỹ & kiểm két','Thủ quỹ điền tổng số đếm cuối ngày + up ảnh chụp sổ (bắt buộc, anh 22/10 — bỏ đếm theo mệnh giá); app so với sổ sách cuối ngày.','Lệch → Đối soát lỗi tự báo. Mỗi TK 1 lần / ngày, đếm lại thì ghi đè.','14/10'],
 ['thu_chi','Sổ quỹ & kiểm két','Quỹ tiền mặt 3 cửa hàng (Kiot): thu quầy − chi quầy − nộp về két = tiền còn giữ ở quầy.','Cuối ngày nộp đủ thì về 0.','09/10'],
 ['thu_chi','Tạm ứng & hoàn ứng','Sổ theo dõi ai đang cầm tiền ứng; không đổi số dư (tiền ra bằng Phiếu chi, trả lại bằng Phiếu thu).','','14/10'],
 ['thu_chi','Tạm ứng & hoàn ứng','Hoàn ứng 3 cách: chứng từ chi phí / trả lại tiền / trừ lương; không cho hoàn vượt số còn lại.','Quá hạn = còn phải hoàn và đã qua hạn.','14/10'],
 ['thu_chi','Vay','Khoản vay tách riêng khỏi Phiếu chi: trang Vay ghi các lần NHẬN TIỀN (giải ngân) và các lần TRẢ (gốc, lãi), mỗi lần gắn tài khoản → tính vào số dư.','Dư nợ = tổng nhận − gốc đã trả. 98 phiếu trả gốc cũ đã chuyển sang 7 khoản vay (15/10).','15/10'],
 ['thu_chi','Vay','Chỉ LÃI vay là chi phí (P&L: lãi ở trang Vay + phiếu chi loại Lãi vay & phí tài chính). Trả gốc không phải chi phí.','Lãi đã có phiếu chi thì lần trả ở trang Vay để lãi = 0.','15/10'],
 // ── CÔNG NỢ
 ['cong_no','Hạn công nợ','Đến hạn / quá hạn chỉ xét NỢ THẬT. COD chưa thu hồi (tiền đơn vị vận chuyển đang giữ) và hàng khách chưa lấy KHÔNG tính là nợ đến hạn.','Khách chỉ còn COD / chưa lấy hàng → trạng thái "Chờ thu COD / lấy hàng". Thẻ Tổng quan "Khách hàng quá hạn" = số khách có nợ thật quá hạn, tiền = nợ thật quá hạn.','19/10'],
 ['cong_no','Công nợ khách','Dùng số công nợ Kiot: dương = khách còn nợ, âm = khách trả trước.','Tự cập nhật 15 phút / lần.','08/10'],

 // ── HOÁ ĐƠN & THUẾ

 // ── BÁO CÁO & CHỐT KỲ
 ['bao_cao','P&L','Doanh thu = hoá đơn Kiot Hoàn thành + Đang xử lý (đang giao) — như Kiot. Doanh thu thuần = doanh thu − trả hàng.','Khớp màn Tổng quan Kiot (đã đối chiếu T9). Trước 16/10 app bỏ hoá đơn Đang xử lý.','16/10'],

 ['bao_cao','Dòng tiền vs KQKD','Dòng tiền / Sổ quỹ = tiền thật ra vào tài khoản theo ngày chi / thu. KQKD = chi phí hạch toán. Hai báo cáo tách riêng.','Cùng 1 phiếu: chi phí tháng sử dụng, dòng tiền tháng trả.','16/10'],
 ['bao_cao','Dòng tiền','Tiền thực: thu đã thu (ngày thu), chi đã trả (ngày trả) — chia Kinh doanh / Đầu tư / Tài chính.','Số dư đầu / cuối chỉ có từ mốc 01/09.','14/10'],
 ['bao_cao','Đã cọc · chưa đi hàng','Đơn đặt chưa hoàn thành / huỷ, có cọc = tiền trả trên đơn + trả trước của khách chia 1 lần cho đơn cũ nhất (FIFO). Loại ra: đơn đã có HĐ gắn đơn; khách có HĐ không gắn đơn ≥ 50% giá trị đơn từ ngày đặt (nghi đã đi hàng, liệt kê riêng). Đặt > 90 ngày: nhãn Treo.','Kế toán 16/10: cả năm thấy nhiều. Luật cũ lặp trả trước của khách ở mọi đơn + tính cả đơn đã ra HĐ.','16/10'],
 ['bao_cao','Doanh thu trên Tổng quan','Thực tế = HĐ đã đi hàng − trả hàng. Đã cọc chưa đi hàng = đơn đặt có cọc chưa ra HĐ (doanh thu dự kiến).','Đơn không dấu vết tiền = báo giá, không tính. Đã cọc · chưa đi hàng hiện theo từng cơ sở ở bảng Kết quả theo cơ sở.','15/10'],
 ['bao_cao','Phân bổ chi phí','Chia phiếu cho đơn vị (tự nhập / chia đều / % doanh số tháng) và ra nhiều tháng ở tab Phân bổ của phiếu.','Chỉ kế toán (quyền duyệt chi) sửa.','14/10'],
 ['bao_cao','Phân bổ chi phí','Chọn "% doanh số tháng" → mỗi đêm 00:15 hệ thống chia lại theo doanh số mới nhất đến hết tháng sau.','Sửa tay → giữ số đã sửa; tháng đã khoá thì không chia lại.','15/10'],
 ['bao_cao','Báo cáo 3–8','3 Hiệu suất đơn hàng: đơn đặt trong kỳ chia huỷ / đã đi hàng / đã cọc / báo giá.','','15/10'],
 ['bao_cao','Báo cáo 3–8','4 Dòng tiền dự kiến 8 tuần: số dư + thu bình quân − chi bình quân − lịch trả vay.','Ước tính theo 8 tuần qua.','15/10'],
 ['bao_cao','Báo cáo 3–8','5 Ngân sách: nhập theo tháng × loại chi; so với chi thực tế.','','15/10'],
 ['bao_cao','Báo cáo 3–8','6 Hàng tồn: tồn chậm = còn tồn, 90 ngày không bán; số ngày tồn = giá trị tồn ÷ giá vốn bán / ngày.','','15/10'],

 ['bao_cao','Báo cáo 3–8','8 Theo cơ sở: doanh thu thuần, giá vốn, lãi gộp, chi phí theo đơn vị chịu chi phí.','"Chung" = chi phí chưa chia cho cửa hàng.','15/10'],

 ['kiot','Kéo Kiot','Sổ quỹ lấy 10 ngày gần nhất; hoá đơn, trả hàng, nhập, đơn đặt, khách, NCC, hàng hoá lấy phần mới sửa.','','14/10'],

function veLogic(c){
  const f=S.f,tab=f.lg_tab||'chi_so',q=(f.lg_q||'').toLowerCase().trim();
  const ds=q?LOGIC2.filter(r=>r.join(' ').toLowerCase().includes(q)):LOGIC2.filter(r=>r[0]===tab);
  const tenNV=k=>(LG_NV.find(x=>x[0]===k)||[])[1]||k;
  let rows='',i=0;const nhom=[];ds.forEach(r=>{const g=(q?r[0]+'|':'')+r[1];const z=nhom[nhom.length-1];if(z&&z.g===g)z.r.push(r);else nhom.push({g,r:[r]})});
  nhom.forEach(z=>z.r.forEach((r,j)=>{i++;rows+=`<tr><td class="c lg-stt">${i}</td>${j===0?`<td class="lg-muc" rowspan="${z.r.length}">${q?`<div class="muted" style="font-size:11px">${esc(tenNV(r[0]))}</div>`:''}${esc(r[1])}</td>`:''}<td>${r[2]}</td><td class="lg-gc">${r[3]||''}</td><td class="c nw lg-ngay">${r[4]||''}</td></tr>`}));
  const lc=S.dm.loai.filter(x=>x.nhom==='chi'&&x.hoat_dong);
  const danhMuc=tab==='danh_muc'&&!q;
  c.innerHTML=`<div class="m-flt" style="align-items:center"><div class="m-seg">${[...LG_NV,['danh_muc','Danh mục đang áp dụng']].map(([k,t])=>`<button class="${!q&&tab===k?'on':''}" onclick="S.f.lg_tab='${k}';S.f.lg_q='';render()">${t}${k!=='danh_muc'?`<span class="c">${LOGIC2.filter(r=>r[0]===k).length}</span>`:''}</button>`).join('')}</div>
      <input class="m-in" type="search" placeholder="Tìm quy tắc…" value="${esc(f.lg_q||'')}" onchange="S.f.lg_q=this.value;render()" style="margin-left:auto;min-width:220px"></div>
    ${danhMuc?`<div class="sec">Cách chia từng loại chi</div><div class="m-card"><div class="scroll"><table class="lg-t"><tr><th>Loại chi</th><th>Nhóm báo cáo</th><th>Cách chia theo cơ sở</th></tr>${lc.map(x=>`<tr><td>${esc(x.ten)}</td><td>${esc(x.nhom_bc||'')}</td><td>${x.cach_chia==='ty_le_thu'?'Theo tỉ lệ thu':'Riêng (theo phiếu)'}</td></tr>`).join('')}</table></div></div>
      <div class="sec">Mốc tồn đầu từng tài khoản</div><div class="m-card"><div class="scroll"><table class="lg-t"><tr><th>Tài khoản</th><th>Ngày mốc</th><th class="num">Tồn đầu</th></tr>${S.dm.tai_khoan.filter(x=>x.hoat_dong).map(x=>`<tr><td>${esc(x.ten)}</td><td>${fmtD(x.ngay_ton_dau)}</td><td class="num">${fmt(x.ton_dau)}</td></tr>`).join('')}</table></div></div>`
    :`<div class="m-card"><div class="scroll"><table class="lg-t"><tr><th class="c" style="width:44px">STT</th><th style="width:190px">Mục</th><th>Quy tắc</th><th style="width:32%">Ghi chú / ví dụ</th><th class="c" style="width:80px">Cập nhật</th></tr>
      ${rows||'<tr><td colspan="5" class="m-empty">Không thấy quy tắc nào</td></tr>'}</table></div></div>`}`;
}

async function pageCaiDat(mod){
  const el=$('#page');S.f.cd=mod;
  el.innerHTML=head(PAGES[S.page].ten+' <span class="badge" style="vertical-align:middle">Cài đặt · '+PAGES[S.page].cd+'</span>')+'<div id="cd"></div>';
  const c=$('#cd');const qt=heThong();
  if(S.f.cd==='logic'){veLogic(c);
  }else if(S.f.cd==='tai_khoan'){
    c.innerHTML=`${qt?'<div class="bar"><button class="btn pri" onclick="formDM(\'tai_khoan\')">+ Thêm tài khoản</button></div>':''}<div class="card scroll"><table><tr><th>Tài khoản</th><th>Loại</th><th>Ngày mốc</th><th class="num">Tồn đầu</th><th>Bên Kiot</th><th>Trạng thái</th></tr>
      ${[...S.dm.tai_khoan].sort((a,c)=>(c.hoat_dong-a.hoat_dong)).map(x=>`<tr class="${qt?'click':''} ${x.hoat_dong?'':'muted'}" ${qt?`onclick="formDM('tai_khoan',${x.id})"`:''}><td>${esc(x.ten)}</td><td>${esc(LOAI_TK[x.loai])}</td><td>${fmtD(x.ngay_ton_dau)}</td><td class="num">${fmt(x.ton_dau)}</td><td>${esc((x.kiot_ma||[]).join(', '))}</td><td>${x.hoat_dong?vb('Đang dùng','ok'):vb('Ngừng dùng · giữ lịch sử','grey')}</td></tr>`).join('')}</table></div>`;
  }else if(S.f.cd==='don_vi'){
    c.innerHTML=`${qt?'<div class="bar"><button class="btn pri" onclick="formDM(\'don_vi\')">+ Thêm</button></div>':''}<div class="card scroll"><table><tr><th>Tên</th><th class="c">Chịu chi phí / báo cáo</th><th class="c">Bộ phận đề nghị</th><th>Chi nhánh Kiot</th><th>Trạng thái</th></tr>
      ${S.dm.don_vi.map(x=>`<tr class="${qt?'click':''}" ${qt?`onclick="formDM('don_vi',${x.id})"`:''}><td>${esc(x.ten)}</td><td class="c">${x.la_co_so?'✓':''}</td><td class="c">${x.la_bo_phan?'✓':''}</td><td>${esc((x.kiot_chi_nhanh||[]).join(', '))}</td><td>${x.hoat_dong?vb('Đang dùng','ok'):vb('Tắt','grey')}</td></tr>`).join('')}</table></div>`;
  }else if(S.f.cd==='loai'){
    // 22/10 kế toán: "cho chị nhóm cha nhóm con, nhìn cho dễ" — cây nhóm cha → mục con, bấm ▶ đóng / mở nhóm
    const nh=S.f.cd_ln||'chi',tat=!!S.f.cd_tat,dong=S.f.cd_dong||(S.f.cd_dong={});

    <div class="acts"><button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" onclick="luuDatLaiMK(${id})">Lưu</button></div>`)}
async function luuDatLaiMK(id){const x=S.cache.nd.find(n=>n.id===id);const m=$('#f [name=m1]').value;if(m.length<8)return alert('Mật khẩu từ 8 ký tự');
  await save('kt_luu_nguoi_dung',{p_dong:{id,ten_dang_nhap:x.ten_dang_nhap,ho_ten:x.ho_ten,vi_tri:x.vi_tri,quyen:x.quyen,hoat_dong:x.hoat_dong,mk_moi:m}},'Đã đặt lại mật khẩu');render()}
async function khoaND(id,mo){const x=S.cache.nd.find(n=>n.id===id);if(!mo&&!confirm('Khoá tài khoản '+x.ho_ten+'? Người này bị đăng xuất ngay.'))return;
  await save('kt_luu_nguoi_dung',{p_dong:{id,ten_dang_nhap:x.ten_dang_nhap,ho_ten:x.ho_ten,vi_tri:x.vi_tri,quyen:x.quyen,hoat_dong:mo}},mo?'Đã mở lại':'Đã khoá');render()}
async function doiMa(){const o=formData($('#f'));if(o.m1.length<8)return alert('Mật khẩu mới từ 8 ký tự');if(o.m1!==o.m2)return alert('Hai lần nhập không khớp');
  try{await rpc('kt_doi_mat_khau',{p_mk_cu:o.m0,p_mk_moi:o.m1});toast('Đã đổi mật khẩu');render()}catch(e){alert(e.message)}}

// Nút con mắt xem / ẩn mật khẩu — tự gắn cho MỌI ô mật khẩu xuất hiện trên trang (đăng nhập, đổi MK, form tài khoản)
const IC_MAT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const IC_MAT_TAT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.9 17.9A10 10 0 0 1 12 19c-7 0-11-7-11-7a18 18 0 0 1 5.1-5.9M9.9 5.2A9 9 0 0 1 12 5c7 0 11 7 11 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>';
function ganMat(){document.querySelectorAll('input[type=password]:not([data-mat])').forEach(i=>{i.dataset.mat=1;
  const w=document.createElement('span');w.className='mk-wrap';i.parentNode.insertBefore(w,i);w.appendChild(i);
  const b=document.createElement('button');b.type='button';b.className='mk-mat';b.title='Xem / ẩn mật khẩu';b.innerHTML=IC_MAT;
  b.onclick=()=>{const an=i.type==='password';i.type=an?'text':'password';b.innerHTML=an?IC_MAT_TAT:IC_MAT;i.focus()};w.appendChild(b)})}
new MutationObserver(ganMat).observe(document.body,{childList:true,subtree:true});

try{const th=localStorage.getItem('kt_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
(async()=>{let p=null;try{p=sessionStorage.getItem('kt_phien')||localStorage.getItem('kt_phien')}catch(e){}
  if(!p)return renderGate();S.phien=p;try{await boot()}catch(e){if(S.phien)renderGate(e.message)}})();
document.addEventListener('click',()=>{const d=$('.tb-dd.open');if(d)d.classList.remove('open')});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGES[h]&&h!==S.page&&S.toi){S.page=h;shell()}});

// 20/10/2026 rà soát (anh: "rà đủ các case người dùng có thể ấn nhầm"): bấm đúp nút Lưu tạo 2 phiếu → mỗi hàm lưu / duyệt chỉ chạy 1 lượt
// cho CÙNG 1 phiếu tại 1 thời điểm (khoá theo tham số đầu = id phiếu; phiếu mới = null), lượt bấm thêm khi đang chạy bị bỏ qua.
(()=>{const khoaLuu=fn=>{const dang=new Set();return async function(...a){const k=String(a[0]);if(dang.has(k))return;dang.add(k);try{return await fn.apply(this,a)}finally{dang.delete(k)}}};
  ['tuChiLoatLuu','duyetLenhLoat','lapLenh','tqNhan','luuChi','luuThu','luuDC','luuTU','luuTUHoan','luuVay','luuVayNhan','luuVayTra','luuPhieu','doiTTChi','luuPhanBo','duyetNhanh','xacNhanDC','luuThuHoi','luuXNHU','luuKiemKet','luuNo','luuST','luuTS','luuDCT','luuDM','luuND','luuNS','luuTL','luuTT','luuNganSach','luuLoaiNo','luuDcf','luuNap']
    .forEach(k=>{if(typeof window[k]==='function')window[k]=khoaLuu(window[k])})})();
</script>
