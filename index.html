<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Kế Toán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&subset=vietnamese&display=swap" rel="stylesheet">
<style>
/* App KẾ TOÁN — thu · chi · điều chuyển · công nợ · dòng tiền. Monsieur Claude */
:root{
  --bg:#f5f6f8;--surface:#fff;--bg2:#f1f3f6;--border:#e3e6eb;--text:#111827;--text2:#374151;--muted:#6b7280;
  --accent:#0078c8;--accent-fg:#fff;--sel-bg:#e6f2fa;--nav:#0b2a43;
  --ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#be123c;--bad-bg:#ffe4e6;
  --info:#0e7490;--info-bg:#cffafe;--grey:#4b5563;--grey-bg:#e5e7eb;--vio:#6d28d9;--vio-bg:#ede9fe;--teal:#0f766e;--teal-bg:#ccfbf1;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a21;--bg2:#1e222b;--border:#2b303b;--text:#e5e7eb;--text2:#cbd5e1;--muted:#8b93a3;
  --accent:#4cb3f0;--accent-fg:#06192a;--sel-bg:#12283b;--nav:#0a1a28;
  --ok:#4ade80;--ok-bg:#12301f;--warn:#fbbf24;--warn-bg:#352812;--bad:#fb7185;--bad-bg:#3a1520;
  --info:#67e8f9;--info-bg:#0e2e36;--grey:#cbd5e1;--grey-bg:#2b303b;--vio:#c4b5fd;--vio-bg:#2a1f47;--teal:#5eead4;--teal-bg:#0f2f2c;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a21;--bg2:#1e222b;--border:#2b303b;--text:#e5e7eb;--text2:#cbd5e1;--muted:#8b93a3;
  --accent:#4cb3f0;--accent-fg:#06192a;--sel-bg:#12283b;--nav:#0a1a28;
  --ok:#4ade80;--ok-bg:#12301f;--warn:#fbbf24;--warn-bg:#352812;--bad:#fb7185;--bad-bg:#3a1520;
  --info:#67e8f9;--info-bg:#0e2e36;--grey:#cbd5e1;--grey-bg:#2b303b;--vio:#c4b5fd;--vio-bg:#2a1f47;--teal:#5eead4;--teal-bg:#0f2f2c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:12.5px;color:var(--text)}
.wrap{padding:22px 28px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.title{font-size:20px;font-weight:800;margin-right:auto}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:var(--bg2);color:var(--text2);font-size:11px;font-weight:700;white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.ok{background:var(--ok-bg);color:var(--ok)}
.btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.bad{color:var(--bad)}.btn.ok{color:var(--ok)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .right,.top .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
select,input,textarea{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);font-weight:600;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.sel{height:30px;padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
.sel.on{border-color:var(--accent);color:var(--accent)}
input.sel{cursor:text;font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--text2)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.kpi-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1.5px solid var(--border);border-left:4px solid var(--c,var(--accent));border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--c)}
.kpi .ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.kpi .ic svg{width:20px;height:20px}
.kpi .l{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}
.sec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--bg2);padding:9px 10px;font-size:11px;font-weight:800;color:var(--muted);text-align:left;white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.c,td.c{text-align:center}
td.nw{white-space:nowrap}
td.wrap2{max-width:340px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg2)}
tr.tong td{font-weight:800;background:var(--bg2)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.vb{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}.neg{color:var(--bad)}.pos{color:var(--ok)}
a{color:var(--accent);font-weight:700;text-decoration:none}
.gate{max-width:360px;margin:14vh auto 0;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:22px}
.gate h1{font-size:18px;margin:0 0 12px}
.gate input[type=password]{width:100%;margin-bottom:10px;padding:9px 12px}
.err{color:var(--bad);font-weight:700;font-size:12px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--surface);border-radius:16px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
.modal h2{font-size:16px;margin:0 0 12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.form label.full{grid-column:1/-1}
.form label>input,.form label>select,.form label>textarea{text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);width:100%}
.form .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:12.5px;color:var(--text2)}
.form .chk input{width:auto}
.form .ct-them{text-transform:none;letter-spacing:0}
/* 21/10 anh: form tạo phiếu trong app trình bày y như form màn đăng nhập (thoáng) — dùng chung 1 kiểu cho #dn và form trong cửa sổ */
#dn,.modal .form,.pn-to .form{gap:14px 18px}
#dn label,.modal .form label,.pn-to .form label{gap:6px;font-size:11.5px}
#dn label>input,#dn label>select,#dn label>textarea,.modal .form label>input,.modal .form label>select,.modal .form label>textarea,.pn-to .form label>input,.pn-to .form label>select,.pn-to .form label>textarea{font-size:14px;min-height:40px;padding:8px 12px}
#dn .sec,.modal .form .sec,.pn-to .form .sec{font-size:15px;font-weight:800;color:var(--text);margin-top:18px}
.modal>div:has(>.form){max-width:780px;padding:24px 28px}.modal h2{font-size:18px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.acts .left{margin-right:auto}
.pb{display:grid;grid-template-columns:1fr 160px 30px;gap:6px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12.5px}
.kv .k{color:var(--muted);font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;font-weight:700;font-size:12.5px;z-index:60}
.empty{padding:22px;text-align:center;color:var(--muted)}
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1.5px solid var(--border);display:flex;flex-direction:column}
.sb-strip{height:4px;background:linear-gradient(90deg,var(--accent),#7c3aed,#0d9488,#16a34a);flex-shrink:0}
.sb-brand{padding:16px 18px 6px;font-size:15px;font-weight:800}
.sb-who{padding:0 18px 4px;font-size:11px;color:var(--muted);font-weight:600}
.sb-section{padding:14px 18px 6px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:2px 8px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);border:1.5px solid transparent}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--sel-bg);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 18%,transparent)}
.nav-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px}
.sb-bottom{margin-top:auto;border-top:1.5px solid var(--border);padding:8px 0 10px}
.sb-tools{display:flex;gap:6px;padding:6px 16px 0}
.sb-tools .btn{flex:1;padding:5px 8px;font-size:11.5px}
.sb-ver{padding:6px 18px 0;font-size:10px;color:var(--muted)}
.sb-menu{display:none;padding:3px 10px}
.sb-brand .muted{display:none}
@media (max-width:760px){.sb-brand .muted{display:inline}}
.main{flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.doc h3{font-size:14px;margin:20px 0 6px}
.doc p,.doc li{color:var(--text2);line-height:1.65}
.doc ol,.doc ul{margin:4px 0;padding-left:20px}
.doc .rule{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.doc .rule b{color:var(--text)}
.tt-input{width:130px;text-align:right;padding:3px 8px;font-variant-numeric:tabular-nums}
/* Giao diện kiểu phần mềm kế toán (anh Hải 05/10: "đừng làm giống gg sheet") — bảng thoáng, không kẻ ô,
   tổng quan dạng thẻ + biểu đồ, xem phiếu bằng ngăn kéo bên phải (kiểu MISA AMIS / Xero / QuickBooks). */
th{background:transparent;border-bottom:1.5px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:11px 14px}
td{padding:11px 14px;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
tr:last-child td{border-bottom:none}
td.num b{font-weight:800}
.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:16px 18px}
.panel h4{margin:0 0 12px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid-2-1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.acc{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;cursor:pointer}
.acc:hover{border-color:var(--accent)}
.acc .n{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .t{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.acc .b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.acc .d{font-size:11.5px;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.st-bad{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--bad)}
.todo{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;font-weight:600;color:var(--text2)}
.todo:last-child{border-bottom:none}.todo:hover{color:var(--text)}
.todo .cnt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;min-width:28px;text-align:right;color:var(--text)}
.todo .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.todo.xong{opacity:.55;cursor:default}
.hbar{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:4px 12px;align-items:center;margin-bottom:9px;font-size:12px}
.hbar .lb{font-weight:600;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{display:flex;align-items:center;gap:8px;min-width:0}
.hbar .bar-fill{height:14px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hbar .v{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
.hbar .v span{color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--text2);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:8px 11px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:5;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:3px}
.ax{font-size:10px;fill:var(--muted);font-family:var(--font)}
:root{--s1:#2a78d6;--s2:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#e66767}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#e66767}
.modal.drawer{justify-content:flex-end;padding:0}
.modal.drawer>div{max-width:560px;height:100vh;max-height:100vh;border-radius:16px 0 0 16px;padding:20px 22px}
.tabs .btn.on .muted{color:inherit;opacity:.8}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ct-item{position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg2)}
.ct-thumb{height:92px;display:flex;align-items:center;justify-content:center;cursor:zoom-in;overflow:hidden;background:var(--surface)}
.ct-thumb img{width:100%;height:100%;object-fit:cover}
.ct-pdf{font-weight:800;font-size:13px;color:var(--bad);border:2px solid var(--bad);border-radius:6px;padding:6px 10px}
.ct-ten{font-size:10.5px;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.ct-nut{position:absolute;top:4px;right:4px;display:flex;gap:3px;opacity:.9}
.ct-nut button{border:none;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;cursor:pointer}
.ct-them{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:118px;border:1.5px dashed var(--border);border-radius:8px;cursor:pointer;color:var(--accent);font-size:11.5px;font-weight:700}
.ct.ct-chon .ct-them{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ct-them small{font-size:10px;font-weight:600;color:var(--muted)}
.ct-thumb{position:relative}.ct-item.dang img{opacity:.6}
.ct-tt{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:700;padding:3px 6px;text-align:center}
.ct-item.loi .ct-tt{background:var(--bad)}.ct-item.loi .ct-thumb{cursor:pointer}.ct-item.xong .ct-tt{background:var(--ok)}
.modal.keo>div{outline:3px dashed var(--accent);outline-offset:-8px}
.ghim{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 7px;border-radius:10px;background:var(--sel-bg);color:var(--accent);font-size:11px;font-weight:700;cursor:pointer;vertical-align:middle}
.ghim svg{width:12px;height:12px}.ghim:hover{background:var(--accent);color:#fff}
.ct-them b{font-size:22px;line-height:1}.ct-them:hover{border-color:var(--accent);background:var(--sel-bg)}
.ct-lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:flex;flex-direction:column}
.ct-lb-top{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;font-size:12.5px;font-weight:700}
.ct-lb-top button{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:700}
.ct-lb-body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px 16px;min-height:0}
.ct-lb-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;background:#fff}
.ct-lb-body iframe{width:min(1000px,100%);height:100%;border:none;background:#fff;border-radius:4px}
table.pl td{padding:8px 14px}table.pl .pl-h{background:var(--bg2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.pl tr.tong td{background:transparent;border-top:1.5px solid var(--border)}table.pl tr.pl-net td{background:var(--sel-bg);font-size:13.5px}
.kpi[style*="--grey"] .ic{color:var(--grey)}
/* Tổng quan dạng biểu đồ (anh 05/10: "hiện đại, bảng biểu kiểu sơ đồ, thoáng mắt") */
.dvrow,.sdrow{display:grid;align-items:center;gap:10px;padding:6px 4px;border-radius:6px;font-size:12px}
.dvrow{grid-template-columns:minmax(110px,30%) 1fr 92px 84px}
.sdrow{grid-template-columns:minmax(150px,32%) 1fr 120px;cursor:pointer}
.dvrow:hover,.sdrow:hover{background:var(--bg2)}
.dvrow .lb,.sdrow .lb{font-weight:600;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvrow .bars{display:flex;flex-direction:column;gap:3px}
.dvrow .b1,.dvrow .b2{height:9px;border-radius:0 4px 4px 0;min-width:2px}
.dvrow .b1{background:var(--s1)}.dvrow .b2{background:var(--s2)}
.dvrow .vv{display:flex;flex-direction:column;text-align:right;font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;line-height:1.35}
.dvrow .cl{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.sdrow .trk{position:relative;height:14px}
.sdrow .z{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.sdrow .fill{position:absolute;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0}
.sdrow .fill.am{background:var(--s2);border-radius:4px 0 0 4px}
.sdrow .vv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:12.5px}
@media (max-width:760px){.dvrow{grid-template-columns:1fr 84px}.dvrow .bars,.dvrow .cl{display:none}.sdrow{grid-template-columns:1fr 110px}.sdrow .trk{display:none}}
.tb-dd{position:relative}
.tb-menu-dd{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:40}
.tb-dd.open .tb-menu-dd{display:block}
.dot-loi{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}

/* Chỉnh 05/10 (anh: "màu mè chuẩn tí, đừng để dính nhau"): dải tiêu đề trắng kéo hết bề ngang; tab + bộ lọc + danh sách
   gộp 1 khung trắng (kiểu danh sách Xero); ô chọn / nút cao đều 34px; ô lọc dài đều; nhãn tổng nằm bên phải */

.kpi,.panel,.acc,.card{box-shadow:0 1px 2px rgba(16,24,40,.05)}
/* Ô LỌC MỖI LOẠI 1 MÀU (anh 05/10: "màu sắc mấy ô lọc khác hẳn đi") — màu theo LOẠI lọc, cố định trên mọi trang:
   loại thu/chi = tím · cơ sở / đơn vị = xanh ngọc · bộ phận = cam · tài khoản = xanh dương · nguồn / phân loại / trạng thái = hồng.
   Nền nhạt + vạch trái màu; đang lọc (có chọn) thì đậm màu, chữ màu. */
:root{--f-loai:#7c3aed;--f-dv:#0f9488;--f-bp:#d97706;--f-tk:#0078c8;--f-khac:#db2777}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--f-loai:#a78bfa;--f-dv:#2dd4bf;--f-bp:#fbbf24;--f-tk:#4cb3f0;--f-khac:#f472b6}}

.fbar select.sel[data-fk],.fbar input.sel{border:1px solid color-mix(in srgb,var(--fc) 28%,var(--border));border-left:4px solid var(--fc);
  background-color:color-mix(in srgb,var(--fc) 7%,var(--surface));color:var(--text2);font-weight:700}
.fbar select.sel[data-fk]:hover{border-color:var(--fc)}
.fbar select.sel.on[data-fk]{background-color:color-mix(in srgb,var(--fc) 18%,var(--surface));color:var(--fc);border-color:var(--fc)}
.fbar input.sel{--fc:var(--grey);border-left-width:1px}
[data-fk=loai]{--fc:var(--f-loai)}[data-fk=dv]{--fc:var(--f-dv)}[data-fk=bp]{--fc:var(--f-bp)}[data-fk=tk]{--fc:var(--f-tk)}[data-fk=khac]{--fc:var(--f-khac)}
/* Tab trạng thái: mỗi tab màu theo trạng thái (vàng cam chờ duyệt · xanh ngọc chờ TT · đỏ quá hạn · xanh lá đã TT · xám từ chối · tím HĐ đỏ) */
.tabs .btn.tab2{--c:var(--accent)}
.tabs .btn.tab2 .cnt{display:inline-block;min-width:22px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:800;text-align:center;
  background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);margin-left:4px}
.tabs .btn.tab2 small{color:var(--c);opacity:.9}
.tabs .btn.tab2:hover{color:var(--c)}
.tabs .btn.tab2.on{color:var(--c);border-bottom-color:var(--c);background:color-mix(in srgb,var(--c) 6%,transparent)}
@media (max-width:760px){.wrap>.top:first-child{margin:-14px calc(50% - 50vw) 14px;padding:12px 16px}
  .fbar select.sel{flex:1 1 100%;max-width:none}.fbar>.badge:last-child{margin-left:0}}

.kt-bn.warn{background:var(--warn-bg);color:var(--warn)}.kt-bn.bad{background:var(--bad-bg);color:var(--bad)}
.kt-bn a{margin-left:auto;cursor:pointer;text-decoration:underline;font-weight:800}
.kl-lich{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.kl-th{background:var(--surface);border:1.5px solid var(--border);border-left:4px solid var(--c);border-radius:11px;padding:11px 14px;display:flex;flex-direction:column;gap:6px}
.kl-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.kl-v{font-size:11.5px;line-height:1.5}.kl-c{font-size:11.5px}
@media (max-width:560px){.kl-lich{grid-template-columns:1fr}.kt-bn a{margin-left:0}}
.m-link{color:var(--accent);font-weight:500}
.m-pg{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:12.5px;color:var(--text2);flex-wrap:wrap}
.m-pg select{height:32px;border:1px solid var(--border);border-radius:6px;padding:0 6px;background:var(--surface)}
.m-pg .pgs{margin-left:auto;margin-right:auto;display:flex;gap:6px}
.m-pg .pgs button{min-width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:12.5px}
.m-pg .pgs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.neg-t{color:var(--bad);font-weight:600}.pos-t{color:var(--ok);font-weight:600}
/* khung chi tiết bên phải */
.m-split{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:14px;align-items:start}
.m-pn{position:sticky;top:78px;max-height:calc(100vh - 92px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.m-pn-h{display:flex;align-items:center;gap:8px;padding:14px 14px 6px}.m-pn-h h2{margin:0;font-size:17px;font-weight:800}
.m-pn-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}.m-pn-h .x{border:none;background:none;font-size:16px;cursor:pointer;color:var(--text2)}
.m-pn .m-tabs{padding:0 10px;margin-bottom:8px}.m-pn .m-tab{padding:8px 9px;font-size:12px}
.m-pn-b{padding:0 14px 14px}
.m-st{font-weight:700;font-size:13.5px;margin:12px 0 8px;display:flex;align-items:center;gap:8px}.m-st .r{margin-left:auto}
.m-kv{display:grid;grid-template-columns:130px 1fr;font-size:12.5px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.m-kv>div{padding:6px 10px;border-bottom:1px solid var(--border)}.m-kv>div:nth-child(odd){color:var(--text2);background:var(--bg2)}
.m-kv>div:nth-last-child(-n+2){border-bottom:none}
.m-kv4{grid-template-columns:96px 1fr 84px 1fr}.m-kv4>div:nth-child(odd){color:var(--text2);background:var(--bg2)}.m-kv4>div:nth-last-child(-n+4){border-bottom:none}
.m-box3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.m-box3>div{padding:8px 10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}.m-box3>div:nth-child(3n){border-right:none}.m-box3>div:nth-last-child(-n+3){border-bottom:none}
.m-box3 .l{font-size:11.5px;color:var(--text2)}.m-box3 .v{font-size:16px;font-weight:800;margin-top:2px}
.m-pn-f{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.m-empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
@media (max-width:1250px){.m-split{grid-template-columns:minmax(0,1fr)}.m-split>.m-pn{display:none}}
/* thẻ số có icon vuông màu (Thu chi, Hoá đơn & Thuế) */
.m-kpis{display:grid;gap:10px;margin-bottom:14px}
.m-k{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;gap:10px;min-width:0;cursor:default}
.m-k.click{cursor:pointer}.m-k.on{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
.m-ic{width:40px;height:40px;border-radius:9px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.m-ic svg{width:22px;height:22px}
.m-k .l{font-size:12.5px;color:var(--text2)}.m-k .v{font-size:19px;font-weight:800;margin:2px 0;white-space:nowrap}.m-k .s{font-size:11.5px;color:var(--muted)}

/* tinh chỉnh cho sát mẫu (13/10) */
table.m-t th{text-transform:none;letter-spacing:0;font-size:11px;padding:8px 6px;line-height:1.25}
table.m-t td{padding:8px 6px;font-size:11.5px}
table.m-t td.ten{min-width:120px;max-width:170px}
.m-split{grid-template-columns:minmax(0,1fr) 400px}
.m-pn .m-tab{padding:8px 7px;font-size:11.5px}.m-pn .m-tabs{gap:2px;flex-wrap:nowrap}
.m-pn table.m-t th,.m-pn table.m-t td{padding:6px 5px;font-size:11px}
.sb{width:232px}.sb-nv{font-size:13px;gap:10px;padding:9px 10px}.sb-nv svg{width:19px;height:19px}
.m-kv>div{padding:5px 10px}
.m-split{grid-template-columns:minmax(0,1fr) 380px}
table.m-t th,table.m-t td{padding-left:5px;padding-right:5px}table.m-t td.ten{min-width:110px;max-width:150px}
.m-pn table.m-t th,.m-pn table.m-t td{padding:5px 4px;font-size:10.5px}
.lc-h::after{content:'▾';margin-left:auto;font-size:11px;color:#5b6478}
.m-pn-h h2{font-size:15.5px;line-height:1.3}
@media (max-width:1700px){.m-split .m-nguon{display:none}}
.m-loai{display:inline-flex;width:22px;height:22px;border-radius:5px;background:var(--bad-bg);color:var(--bad);align-items:center;justify-content:center}.m-loai svg{width:14px;height:14px}
.m-pn .form{grid-template-columns:1fr 1fr}
.m-split.rong{grid-template-columns:minmax(0,1fr) 440px}
.m-k{padding:10px}.m-k .m-ic{width:36px;height:36px}.m-k .v{font-size:17px;overflow:hidden;text-overflow:ellipsis}
.m-2d{display:grid;grid-template-columns:auto 1fr;column-gap:8px;font-size:11.5px;color:var(--text2)}.m-2d b{text-align:right;color:var(--text)}
.ctt-tk{margin-top:6px;row-gap:2px}.ctt-tk span.click{cursor:pointer}.ctt-tk span.click:hover,.ctt-tk span.on{text-decoration:underline;color:var(--text)}.ctt-tk i{font-style:normal;color:var(--text3,#889)}
.m-seg button{padding:0 11px}
.m-2d{white-space:nowrap}
/* TỔNG QUAN sát ảnh mẫu (13/10) */
.tq2{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 12px 12px;margin-bottom:12px;min-width:0}
.tq2-h{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:14px}.tq2-h b{text-transform:uppercase;font-weight:800;letter-spacing:.01em}.tq2-h .muted{font-size:13px}
.tq2-n{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.tq2-1{padding-top:0}.tq2-1>.tq2-h{margin:0 -12px 10px;padding:10px 14px;background:linear-gradient(90deg,#fde8ec,#fdf2f4 70%,#fff);border-radius:10px 10px 0 0}
.tq2-kq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tq2-k{border:1px solid var(--border);border-radius:9px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.tq2-kt{display:flex;gap:10px;padding:10px 10px 8px}.tq2-k .l,.tq2-no .l,.tq2-o .l{font-size:12.5px;color:var(--text2)}.tq2-k .v{font-size:20px;font-weight:800;line-height:1.25;white-space:nowrap}
.tq2-k .s{font-size:11.5px;margin-top:2px}
.tq2-kb{margin:0 8px 8px;padding:7px 10px;border-radius:7px;background:color-mix(in srgb,var(--c) 9%,var(--surface));font-size:12.5px;color:var(--text2)}.tq2-kb b{color:var(--text);margin-left:4px}
.tq2-r2{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:12px}
.tq2-r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tq2-r4{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1.05fr) minmax(0,.9fr);gap:12px}
.tq2-t td,.tq2-t th{font-size:12px}
.tq2-os{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.tq2-o{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:9px;padding:8px;min-width:0}.tq2-o .v{font-size:15px;font-weight:800;white-space:nowrap}
.tq2-o.hl{background:var(--info-bg);justify-content:center}.tq2-o .m-ic{width:34px;height:34px}
.tq2-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.tq2-mini{border:1px solid var(--border);border-radius:9px;overflow:hidden}.tq2-mini .h{background:var(--bg2);padding:6px 10px;font-weight:700;font-size:12.5px}
.tq2-mini .r3{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px}.tq2-mini .r3>div{display:flex;flex-direction:column;font-size:11.5px}.tq2-mini .r3 b{font-size:13.5px;white-space:nowrap}
.tq2-mini .ft{display:flex;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--border);font-size:12.5px;background:var(--bg2)}
.tq2-no{border:1px solid var(--border);border-radius:9px;overflow:hidden;min-width:0}.tq2-no .v{font-size:17px;font-weight:800}
.tq2-cbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tq2-cb{display:flex;align-items:center;gap:9px;padding:10px;border-radius:9px;background:color-mix(in srgb,var(--c) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,var(--border));cursor:pointer;font-size:12px;min-width:0}
.tq2-cb .m-ic{width:34px;height:34px;flex:none}.tq2-cb b{color:var(--c);font-size:15px}.tq2-cb .cv{margin-left:auto;font-size:20px;color:var(--muted)}
@media (max-width:1400px){.tq2-kq{grid-template-columns:repeat(3,minmax(0,1fr))}.tq2-cbs{grid-template-columns:repeat(3,minmax(0,1fr))}.tq2-r4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:1100px){.tq2-r2,.tq2-r3,.tq2-r4{grid-template-columns:minmax(0,1fr)}.tq2-os{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.tq2-kq,.tq2-cbs{grid-template-columns:repeat(2,minmax(0,1fr))}.tq2-2{grid-template-columns:1fr}}
.tq2-r4{grid-template-columns:minmax(0,1.5fr) minmax(0,1.05fr) minmax(0,.85fr)}
.tq2-o{padding:7px;gap:6px}.tq2-o .m-ic{width:28px;height:28px}.tq2-o .m-ic svg{width:16px;height:16px}.tq2-o .l{font-size:11.5px;line-height:1.25}.tq2-o .v{font-size:13.5px}
.tq2-h b{font-size:13.5px}.tq2-r3 .tq2-h{flex-wrap:wrap;row-gap:0}
/* HOÁ ĐƠN & THUẾ sát ảnh mẫu (13/10) */
.th-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}.th-g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.th-o{border-radius:12px;padding:16px;background:color-mix(in srgb,var(--c) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 18%,var(--border));display:flex;flex-direction:column;gap:10px;min-width:0}
.th-oh{display:flex;align-items:center;gap:10px}.th-oh .m-ic{background:var(--c);color:#fff;width:42px;height:42px}.th-oh b{font-size:17px;color:color-mix(in srgb,var(--c) 70%,var(--text))}
.th-mo{font-size:12.5px;color:var(--text2)}.th-ob{display:flex;gap:12px;flex:1;flex-wrap:wrap}
.th-ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px;flex:1;min-width:200px}
.th-ul li{display:flex;gap:8px;align-items:flex-start}.th-ul li::before{content:'✓';flex:none;width:17px;height:17px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.th-o>.m-btn{align-self:flex-start}
.th-tag{align-self:flex-end;font-size:11.5px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text2);max-width:220px}
.th-dv{display:flex;flex-direction:column;gap:6px;min-width:200px}.th-dv>div{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px}
.th-dv>div span{color:var(--muted);font-size:11.5px}.th-so{align-self:flex-end;margin-top:-18px;font-weight:800;color:var(--c)!important;font-size:14px!important}
.th-lk{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}.th-lk>div:nth-child(2){flex:1;min-width:240px}.th-lk .m-ic{width:44px;height:44px}
.th-lk-o{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px}
.th-bn{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--text);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12.5px}.th-bn svg{width:18px;height:18px;flex:none;color:var(--warn)}
.kt-luong{display:flex;gap:6px;align-items:stretch;margin-bottom:12px}.kt-b{flex:1;border-radius:10px;padding:12px;background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 20%,var(--border));font-size:12px;min-width:0}
.kt-bh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.kt-bh b{font-size:13.5px;color:color-mix(in srgb,var(--c) 70%,var(--text))}.kt-mt{align-self:center;color:var(--accent);font-size:20px}
.kt-step{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.kt-step>div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:6px 8px;border-radius:8px}
.kt-step span{width:20px;height:20px;border-radius:50%;background:var(--grey-bg);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.kt-step>div.on{color:var(--accent);background:var(--sel-bg);font-weight:600}.kt-step>div.on span{background:var(--accent);color:#fff}
.kt-up{display:flex;gap:10px;align-items:center;border:2px dashed var(--border);border-radius:10px;padding:14px;font-size:12.5px}.kt-up svg{width:34px;height:34px;color:var(--ok);flex:none}
@media (max-width:1300px){.th-g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kt-luong{flex-wrap:wrap}.kt-mt{display:none}.kt-b{flex:1 1 45%}}
@media (max-width:900px){.th-g3,.th-g2{grid-template-columns:minmax(0,1fr)}}
.kt-col{display:flex;flex-direction:column;gap:10px}
.m-kpis .m-k .v{font-size:16px}
.m-kpis .m-k .v{font-size:15px;letter-spacing:-.01em}
/* căn đều (anh 13/10): khối cùng hàng cao bằng nhau, đáy thẳng hàng; ô con bên trong đều nhau */
.tq2-r2,.tq2-r3,.tq2-r4{margin-bottom:12px;align-items:stretch}
.tq2-r2>.tq2,.tq2-r3>.tq2,.tq2-r4>.tq2{margin-bottom:0;display:flex;flex-direction:column}
.tq2-r2>.tq2>.scroll,.tq2-r2>.tq2>table,.tq2-r3>.tq2>table{flex:1}
.tq2-kq>.tq2-k{height:100%}.tq2-kt{min-height:84px}
.tq2-os{align-items:stretch}.tq2-o{height:100%;box-sizing:border-box}
.tq2-2{align-items:stretch}.tq2-2>*{height:100%;box-sizing:border-box}
.tq2-mini,.tq2-no{display:flex;flex-direction:column}.tq2-mini .r3{flex:1}.tq2-no>table{margin-top:auto}
.tq2-no .tq2-kt{min-height:96px}
.tq2-t td,.tq2-t th{height:34px;box-sizing:border-box}
.tq2-cbs>.tq2-cb{height:100%;box-sizing:border-box}
.m-kpis>.m-k{height:100%;box-sizing:border-box}
.kt-drop{cursor:pointer;min-height:150px;justify-content:center;text-align:center;flex-direction:column;background:var(--bg2)}.kt-drop.on{border-color:var(--accent);background:var(--sel-bg)}.kt-drop b{font-size:14px}
/* lưới chung 3 cột bằng nhau cho mọi hàng (anh 13/10): bảng to = đúng 2 cột, bảng nhỏ = 1 cột, mép thẳng nhau */
.tq2-r2,.tq2-r3,.tq2-r4{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tq2-r2>.tq2:first-child{grid-column:span 2}
.tq2-cbs{gap:12px}
@media (max-width:1100px){.tq2-r2,.tq2-r3,.tq2-r4{grid-template-columns:minmax(0,1fr)}.tq2-r2>.tq2:first-child{grid-column:auto}}
.tq2-os{grid-template-columns:repeat(2,minmax(0,1fr))}
.tq2-mini .r3{grid-template-columns:1fr;gap:4px}.tq2-mini .r3>div{flex-direction:row;justify-content:space-between;align-items:baseline}
/* thanh tab dạng nút bo tròn (anh 13/10: bỏ kẻ ô) */
.m-seg{border:none;background:var(--bg2);border-radius:10px;padding:4px;gap:4px;overflow:visible;width:fit-content;max-width:100%}
.m-seg button{border:none!important;border-radius:7px;height:32px;padding:0 12px;background:transparent;color:var(--text2);font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:background .12s}
.m-seg button:hover{background:var(--surface);color:var(--text)}
.m-seg button .c{min-width:20px;height:19px;padding:0 6px;border-radius:10px;background:var(--surface);color:var(--text2);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--border)}
.m-seg button:hover .c{background:var(--bg2)}
.m-seg button.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(37,99,235,.35)}
.m-seg button.on .c{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.m-seg button:not(.on) .c{color:var(--c,var(--text2))}
/* tab trong 1 khung nền trải hết chiều ngang, nút giãn đều (anh 13/10) */
.m-seg{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.m-seg button{flex:1 1 auto;justify-content:center;padding:0 10px}
.m-seg button:hover{background:var(--bg2)}
/* xem nhanh: dòng / ô bấm được */
.click{cursor:pointer}tr.xn,tr.click{cursor:pointer}table.m-t tr.xn:hover td,table.m-t tr.click:hover td{background:var(--sel-bg)}
span.xn{cursor:pointer;border-bottom:1px dashed currentColor}span.xn:hover{color:var(--accent)}
.tq2-k.click:hover,.tq2-o.click:hover,.tq2-kt.click:hover,.tq2-2.click:hover>*{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent);border-radius:9px}
.tq2-mini .r3>div.click:hover{color:var(--accent)}
table.m-t tr.on td{background:var(--sel-bg)}
.xn-pn .m-pn-h h2{font-size:16px}.xn-pn .m-pn-b{padding-top:4px}
/* 14/10 góp ý kế toán */
.m-split:not(.co){grid-template-columns:minmax(0,1fr)!important}.m-split:not(.co)>.m-pn{display:none}
.m-k3{grid-template-columns:repeat(3,minmax(0,1fr))!important}.m-k3 .m-k .v{font-size:19px!important;overflow:visible;text-overflow:clip}

async function rpc(fn,args={},khongPhien){
  const sach=v=>v===''?null:(v&&typeof v==='object'&&!Array.isArray(v))?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,sach(x)])):v;
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON,'Content-Type':'application/json'},
    body:JSON.stringify(sach(khongPhien?args:{p_phien:S.phien,...args}))});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){
    let msg=(j&&(j.message||j.hint))||t||('Lỗi '+r.status);
    /* 20/10: lỗi ràng buộc CSDL → câu dễ hiểu (trước hiện "violates foreign key constraint...") — Monsieur Claude */
    msg=/kt_tam_ung_chi_id_fkey/.test(msg)?'Số phiếu chi không tồn tại — kiểm lại số PC':/violates foreign key/.test(msg)?'Mục liên kết không tồn tại hoặc đã bị xoá — kiểm lại các ô đã chọn'
      :/violates check constraint "[a-z_]*so_tien[a-z_]*"/.test(msg)?'Số tiền không hợp lệ (phải lớn hơn 0)':/violates check constraint/.test(msg)?'Giá trị nhập chưa hợp lệ — kiểm lại các ô'
      :/duplicate key/.test(msg)?'Dữ liệu này đã có (trùng)':msg;
    if(r.status===403&&/Phiên đăng nhập/.test(msg)){lock(true);throw new Error(msg)}
    throw new Error(msg);
  }
  return j;
}

function dnHT(){const ck=$('#dn [name=hinh_thuc]').value==='ck';$$('#dn .dn-ck').forEach(x=>x.style.display=ck?'':'none')}
// tiền bằng chữ (để người gửi soát số 0)
function soChu(n){n=Math.round(Number(n)||0);if(!n)return '';const c=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const ba=(x,du)=>{const t=Math.floor(x/100),ch=Math.floor(x%100/10),dv=x%10;let s=[];if(du||t)s.push(c[t]+' trăm');
    if(ch>1)s.push(c[ch]+' mươi');else if(ch===1)s.push('mười');else if(dv&&(du||t))s.push('lẻ');
    if(dv)s.push(dv===1&&ch>1?'mốt':dv===5&&ch>0?'lăm':c[dv]);return s.join(' ')};
  const dvi=['',' nghìn',' triệu',' tỷ'];let s=[],i=0;
  while(n>0){const x=n%1000;n=Math.floor(n/1000);if(x)s.unshift(ba(x,n>0)+dvi[i%4]+(i>=4&&i%4===0?' tỷ':''));i++}
  const r=s.join(' ').replace(/\s+/g,' ').trim();return r.charAt(0).toUpperCase()+r.slice(1)+' đồng'}
// 16/10/2026 (anh): trang chủ chọn 3 loại phiếu. Tạm ứng: không bắt đơn vị chịu chi phí / hoá đơn (quyết toán khi hoàn ứng).

function dnChenh(){}
function dnPb(){
  const f=$('#dn');if(!f)return;const t=so(f.querySelector('[name=so_tien]').value)||0;$('#dn-chu').textContent=t?soChu(t):'';
  const ds=$$('#dn [name=dv]').filter(x=>x.checked),el=$('#dn-chia');

function dnCon(){const t=so($('#dn [name=so_tien]').value)||0,s=sumBy($$('#dn-chia input'),x=>so(x.value)||0),e=$('#dn-con');
  if(e)e.innerHTML=t-s?`<span class="neg-t">Tổng chia ${fmt(s)} — còn lệch ${fmt(t-s)} so với số tiền đề nghị</span>`:'<span class="pos-t">Tổng chia khớp số tiền đề nghị</span>'}
const dnMime=f=>f.type||({xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',xls:'application/vnd.ms-excel',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',doc:'application/msword',csv:'text/csv',heic:'image/heic',heif:'image/heif',pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'}[(f.name.split('.').pop()||'').toLowerCase()]||'');
function dnThemFile(list){
  const loi=[];for(const f of list){const m=dnMime(f);
    if(!/^(image\/(jpeg|png|webp|heic|heif)|application\/pdf|application\/vnd\.openxmlformats-officedocument\.(spreadsheetml\.sheet|wordprocessingml\.document)|application\/vnd\.ms-excel|application\/msword|text\/csv)$/.test(m)){loi.push(f.name+': chỉ nhận ảnh, PDF, Excel, Word');continue}
    if(f.size>15*1024*1024){loi.push(f.name+': quá 15 MB');continue}
    if(DN.files.length>=60){loi.push('Tối đa 60 file mỗi phiếu');break}DN.files.push(f)}
  if(loi.length)alert(loi.join('\n'));dnVeFile()}
function dnVeFile(){const el=$('#dn-files');if(!el)return;el.innerHTML=DN.files.map((f,i)=>`<div class="dn-f"><span>${esc(f.name)}</span><span class="muted">${fmt(Math.ceil(f.size/1024))} KB</span>${DN.gui?'':`<button class="btn sm" onclick="DN.files.splice(${i},1);dnVeFile()">✕</button>`}<span class="dn-tt" id="dn-tt-${i}"></span></div>`).join('')}

    !DN.files.length&&(hu?'ảnh chuyển khoản / biên nhận nộp tiền':'hồ sơ đính kèm (ảnh / PDF)'),!hu&&!v('thu_huong_ten')&&'người thụ hưởng',ck&&!v('thu_huong_nh')&&'ngân hàng',ck&&!v('thu_huong_stk')&&'số tài khoản',!ds.length&&!tu&&!hu&&'đơn vị chịu chi phí',!v('co_hd_do')&&!tu&&!hu&&'hoá đơn đỏ',!tu&&!hu&&!v('hd_ve')&&'hoá đơn xuất về đâu'].filter(Boolean);
  if(thieu.length){e.textContent='Còn thiếu: '+thieu.join(', ');return}
  if(t<1000){e.textContent='Số tiền tối thiểu 1.000 đ';return}

const fmtN=n=>{n=Number(n)||0;const a=Math.abs(n),s=n<0?'−':'';
  if(a>=1e9)return s+(a/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ';

// giá vốn theo cơ sở chỉ Kiot có); chi phí hoạt động theo THỰC CHI (ngày trả, nhóm "Chi vận hành & quản lí"). Trang Lãi / lỗ vẫn thực thu / thực chi.
// So với kỳ trước: cùng số ngày của tháng trước (kỳ bắt đầu ngày 1), năm trước (kỳ bắt đầu 01/01), hoặc lùi đúng số ngày.
function kyTruoc(tu,den){
  const a=new Date(tu+'T00:00:00'),b=new Date(den+'T00:00:00'),lui=(d,m)=>{const x=new Date(d);const ng=x.getDate();x.setDate(1);x.setMonth(x.getMonth()-m);
    x.setDate(Math.min(ng,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return ymd(x)};
  if(tu.slice(5)==='01-01'&&den.slice(0,4)===tu.slice(0,4)&&den.slice(5,7)!=='01')return [lui(a,12),lui(b,12)];
  if(tu.slice(8)==='01')return [lui(a,1),lui(b,1)];
  const n=Math.round((b-a)/864e5)+1;return [ymd(new Date(a-n*864e5)),ymd(new Date(b-n*864e5))];
}

function veThuChiNgay(){

  const W=Math.max(300,box.clientWidth),H=box.clientWidth<500?220:270,L=52,R=8,T=12,B=26;
  const mx=Math.max(1,...data.map(x=>Math.max(x.thu,x.chi)));
  const h=(H-T-B)/2,y0=T+h,sc=v=>v/mx*h,slot=(W-L-R)/Math.max(1,data.length),bw=Math.min(24,Math.max(3,slot*.62));
  const rnd=(x,y,w,hh,up)=>{if(hh<1)return'';const r=Math.min(4,hh,w/2);
    return up?`M${x},${y0} V${y0-hh+r} Q${x},${y0-hh} ${x+r},${y0-hh} H${x+w-r} Q${x+w},${y0-hh} ${x+w},${y0-hh+r} V${y0} Z`
             :`M${x},${y0} V${y0+hh-r} Q${x},${y0+hh} ${x+r},${y0+hh} H${x+w-r} Q${x+w},${y0+hh} ${x+w},${y0+hh-r} V${y0} Z`};
  const step=Math.ceil(data.length/Math.max(1,Math.floor((W-L)/58)));
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Thu và chi theo ngày">
    <line x1="${L}" x2="${W-R}" y1="${T}" y2="${T}" stroke="var(--border)" stroke-dasharray="3 4"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <text class="ax" x="${L-6}" y="${T+4}" text-anchor="end">${fmtN(mx)}</text><text class="ax" x="${L-6}" y="${y0+4}" text-anchor="end">0</text><text class="ax" x="${L-6}" y="${H-B+4}" text-anchor="end">${fmtN(mx)}</text>`;
  data.forEach((x,i)=>{const cx=L+slot*i+(slot-bw)/2;
    s+=`<path d="${rnd(cx,0,bw,sc(x.thu),true)}" fill="var(--s1)"/><path d="${rnd(cx,0,bw,sc(x.chi),false)}" fill="var(--s2)"/>`;
    if(i%step===0)s+=`<text class="ax" x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${x.ng.slice(8,10)}/${x.ng.slice(5,7)}</text>`;
    s+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent" data-tip="${fmtD(x.ng)}|Thu ${fmt(x.thu)}|Chi ${fmt(x.chi)}|Chênh lệch ${fmt(x.thu-x.chi)}"/>`});
  s+=`<line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  box.innerHTML=s;
}
// Tooltip dùng chung: phần tử có data-tip="dòng 1|dòng 2|..." (dòng 1 in đậm)
function bindTip(){
  $$('.chart-wrap').forEach(w=>{if(w.dataset.tipOn)return;w.dataset.tipOn=1;let tip=null;
    w.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){if(tip)tip.remove(),tip=null;return}
      if(!tip){tip=document.createElement('div');tip.className='tip';w.appendChild(tip)}
      const p=t.dataset.tip.split('|');tip.innerHTML='<b>'+esc(p[0])+'</b>'+p.slice(1).map(esc).join('<br>');
      const r=w.getBoundingClientRect();let x=e.clientX-r.left+14;if(x+tip.offsetWidth>r.width)x=e.clientX-r.left-tip.offsetWidth-14;
      tip.style.left=Math.max(0,x)+'px';tip.style.top=(e.clientY-r.top+12)+'px'});
    w.addEventListener('mouseleave',()=>{if(tip)tip.remove(),tip=null})});
}

// 16/10 anh: QR TĨNH (11) — app ngân hàng quét xong vẫn sửa được nội dung (QR động 12 bị khoá số tiền + nội dung)
// 19/10 anh: "mã QR bị cố định nội dung, quét không đổi được" — nhiều app ngân hàng cứ có trường 62 (nội dung) là khoá ô nội dung, kể cả QR tĩnh

function vietQR(bin,stk,tien,nd){const tlv=(i,v)=>i+String(v.length).padStart(2,'0')+v;
  const p=tlv('00','01')+tlv('01','11')+tlv('38',tlv('00','A000000727')+tlv('01',tlv('00',bin)+tlv('01',stk))+tlv('02','QRIBFTTA'))+tlv('53','704')
    +(tien?tlv('54',String(Math.round(tien))):'')+tlv('58','VN')+(nd?tlv('62',tlv('08',nd)):'')+'6304';
  let c=0xFFFF;for(const ch of p){c^=ch.charCodeAt(0)<<8;for(let k=0;k<8;k++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}
  return p+c.toString(16).toUpperCase().padStart(4,'0')}

  const bin=binNH(x.thu_huong_nh),so='PC'+String(x.id).padStart(6,'0');
  if(!bin)return `<div class="m-st">Mã QR chuyển khoản</div><div class="muted" style="font-size:12px">Không nhận ra ngân hàng "${esc(x.thu_huong_nh||'')}" để tạo QR — sửa tên ngân hàng trên phiếu (vd Vietcombank, MB Bank, Techcombank).</div>`;

  return `<div class="m-st">Mã QR chuyển khoản</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div id="qr-${x.id}" style="width:170px;height:170px;flex:none;padding:0" class="m-empty">Đang tạo…</div>

      <div>Số tiền</div><div><b>${fmt(x.so_tien)}</b></div><div>Nội dung CK</div><div>${esc(nd)} <button class="m-btn out" style="height:24px;padding:0 8px" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(nd))}).then(()=>toast('Đã chép nội dung — dán vào ô nội dung khi chuyển'),()=>toast('Không chép được — gõ tay'))">Chép</button></div></div></div>`}

// Xuất Excel thật (.xlsx, 15/10 kế toán): cột số là số (định dạng #,##0), cột ngày là ngày; cột mã / số TK / số phiếu giữ dạng chữ
async function xuatCSV(ten,cols,rows){
  try{const X=await napXLSX(),maCot=/mã|số phiếu|stk|sđt|số tài khoản|tài khoản nhận|số hđ|số hoá đơn|số hóa đơn|số chứng từ|mst|ký hiệu|sdt/i,dd=new Set();
    const aoa=[cols.map(c=>c[0])];
    rows.forEach((r,i)=>aoa.push(cols.map((c,j)=>{const v=c[1](r);if(v==null)return '';if(typeof v==='number')return v;const t=String(v);
      if(/^\d{4}-\d{2}-\d{2}$/.test(t)){dd.add((i+1)+':'+j);const [y,m,d]=t.split('-').map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5}
      if(!maCot.test(cols[j][0])&&/^-?\d+(\.\d+)?$/.test(t)&&t.replace('-','').split('.')[0].length<=15)return Number(t);
      return t})));
    const ws=X.utils.aoa_to_sheet(aoa),rg=X.utils.decode_range(ws['!ref']);
    for(let R=1;R<=rg.e.r;R++)for(let C=0;C<=rg.e.c;C++){const c=ws[X.utils.encode_cell({r:R,c:C})];if(!c||c.t!=='n')continue;c.z=dd.has(R+':'+C)?'dd/mm/yyyy':Number.isInteger(c.v)?'#,##0':'#,##0.00'}
    ws['!cols']=cols.map((c,j)=>({wch:Math.min(60,Math.max(String(c[0]).length,...aoa.slice(1,300).map(r=>dd.has('1:'+j)?10:String(r[j]).length))+2)}));
    ws['!autofilter']={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:0,c:rg.e.c}})};
    const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Dữ liệu');X.writeFile(wb,ten+'.xlsx')}
  catch(e){toast('Không tạo được file Excel ('+e.message+') — xuất CSV thay thế',true);
    const q=v=>{const t=String(v==null?'':v);return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
    const csv='﻿'+[cols.map(c=>q(c[0])).join(','),...rows.map(r=>cols.map(c=>q(c[1](r))).join(','))].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=ten+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}}

// ── LUỒNG MỚI 08/10: BÁO CÁO TỪ KIOT + NHẬP LIỆU BỔ SUNG ───────────────────
// Cột đơn giản 1 dãy (doanh thu theo ngày...) — dùng chung tooltip data-tip
function veCot(id,data,mau){const box=$('#'+id);if(!box)return;const W=Math.max(300,box.clientWidth),H=210,L=52,R=8,T=12,B=26;
  const mx=Math.max(1,...data.map(x=>x.v)),slot=(W-L-R)/Math.max(1,data.length),bw=Math.min(24,Math.max(3,slot*.62)),sc=v=>v/mx*(H-T-B);
  const step=Math.ceil(data.length/Math.max(1,Math.floor((W-L)/58)));
  let s=`<svg width="${W}" height="${H}" role="img"><line x1="${L}" x2="${W-R}" y1="${T}" y2="${T}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <text class="ax" x="${L-6}" y="${T+4}" text-anchor="end">${fmtN(mx)}</text><text class="ax" x="${L-6}" y="${H-B+4}" text-anchor="end">0</text>`;
  data.forEach((x,i)=>{const cx=L+slot*i+(slot-bw)/2,h=sc(x.v),y=H-B-h,r=Math.min(4,h,bw/2);
    if(h>=1)s+=`<path d="M${cx},${H-B} V${y+r} Q${cx},${y} ${cx+r},${y} H${cx+bw-r} Q${cx+bw},${y} ${cx+bw},${y+r} V${H-B} Z" fill="var(${mau||'--s1'})"/>`;
    if(i%step===0)s+=`<text class="ax" x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${x.nhan}</text>`;
    s+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent" data-tip="${esc(x.tip)}"/>`});
  box.innerHTML=s+`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--muted)"/></svg>`}
const kpiBox=(c,ic,l,v,s)=>`<div class="kpi" style="--c:var(--${c})"><div class="ic">${IC[ic]}</div><div><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div></div>`;
const hb=(rows,nhan,giaTri,ghi)=>{const mx=Math.max(1,...rows.map(giaTri));return rows.length?rows.map(r=>`<div class="hbar" data-tip="${esc(nhan(r))}|${fmt(giaTri(r))}${ghi?'|'+ghi(r):''}"><div class="lb" title="${esc(nhan(r))}">${esc(nhan(r))}</div>
  <div class="tr"><div class="bar-fill" style="width:${Math.max(1,giaTri(r)/mx*78)}%"></div><div class="v">${fmtN(giaTri(r))}${ghi?' <span>'+esc(ghi(r))+'</span>':''}</div></div></div>`).join(''):'<div class="empty">Chưa có</div>'};
const nguonKiot=b=>`<span class="badge">Nguồn: Kiot · tự kéo 15 phút/lần</span>`;

// Ảnh mẫu do AI vẽ — CHỈ lấy bố cục; dòng / cột theo DANH MỤC THẬT của app (loại thu / chi, cơ sở, đơn vị) (anh 14/10). Không có ngân sách → không làm cột Kế hoạch.
// Số liệu: kt_bc_pl2 / kt_bc_lctt (supabase-schema-kt-bao-cao-qt.sql).
// Chi phí: mỗi LOẠI CHI OPEX của công ty là 1 dòng (anh 14/10: không ép theo nhóm chữ của ảnh mẫu) — tên bỏ tiền tố "OPEX - "
const tenOpex=t=>String(t||'').replace(/^OPEX\s*-\s*/i,'');
const BC_DV=[[1,'đồng'],[1e3,'nghìn đồng'],[1e6,'triệu đồng']];
const thangSau=m=>{const d=new Date(m+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+1);return d.toISOString().slice(0,7)};
const cuoiThang=m=>{const d=new Date(thangSau(m)+'-01T00:00:00Z');d.setUTCDate(0);return d.toISOString().slice(0,10)};
const dsThang=(a,b)=>{const r=[];for(let m=a;m<=b;m=thangSau(m))r.push(m);return r};
function bcKy(){const f=S.f,nay=homNay().slice(0,7),v=kyHienTai(),k=v==='nam'?'nam':v.startsWith('m:')?'thang':'khoang',nam=(S.den||nay).slice(0,4);
  // 14/10/2026: kỳ lấy từ ô kỳ đầu trang — tháng → 1 tháng · năm → cả năm · 7 ngày / tuỳ chọn → các tháng phủ khoảng đó
  f.bc_thang=v.startsWith('m:')?v.slice(2):f.bc_thang;f.bc_tu=(S.tu||nay).slice(0,7);f.bc_den=(S.den||nay).slice(0,7);
  if(k==='thang'){const m=f.bc_thang||nay;return {k,tu:m+'-01',den:cuoiThang(m),ms:[m],ten:'Tháng '+(+m.slice(5))+'/'+m.slice(0,4)}}
  if(k==='khoang'){let a=f.bc_tu||nay.slice(0,4)+'-01',b=f.bc_den||nay;if(a>b)[a,b]=[b,a];return {k,tu:a+'-01',den:cuoiThang(b),ms:dsThang(a,b),ten:`T${+a.slice(5)}/${a.slice(0,4)} – T${+b.slice(5)}/${b.slice(0,4)}`}}
  return {k:'nam',tu:nam+'-01-01',den:nam+'-12-31',ms:dsThang(nam+'-01',nam+'-12'),ten:'Năm '+nam}}
const bcDv=()=>S.f.bc_dv||1;   // 19/10 anh: mặc định đơn vị đồng
const bcSo=v=>{if(v==null||isNaN(v))return '';const x=Math.round(v/bcDv());return x<0?`(${Math.abs(x).toLocaleString('vi-VN')})`:x?x.toLocaleString('vi-VN'):'–'};
const bcPct=(a,b)=>b?(Math.round(a*1000/b)/10).toLocaleString('vi-VN')+'%':'';
function bcBar(tabs,tab){const f=S.f,k=f.bc_kieu||'nam',nay=homNay().slice(0,7),ky=bcKy();
  const nams=[];for(let y=+nay.slice(0,4);y>=2026;y--)nams.push(String(y));
  const chon=k==='nam'?`<select class="m-in" onchange="S.f.bc_nam=this.value;render()">${nams.map(y=>`<option ${y===(f.bc_nam||nay.slice(0,4))?'selected':''}>${y}</option>`).join('')}</select>`
    :k==='thang'?`<input type="month" class="m-in" value="${f.bc_thang||nay}" min="2026-01" max="${nay}" onchange="S.f.bc_thang=this.value;render()">`
    :`<input type="month" class="m-in" value="${ky.ms[0]}" min="2026-01" max="${nay}" onchange="S.f.bc_tu=this.value;render()"><span class="muted">đến</span><input type="month" class="m-in" value="${ky.ms[ky.ms.length-1]}" min="2026-01" max="${nay}" onchange="S.f.bc_den=this.value;render()">`;
  return `<div class="bc-bar"><span class="badge">Kỳ: ${ky.ten} — đổi ở ô kỳ trên cùng</span>
    <select class="m-in" onchange="S.f.bc_dv=+this.value;render()">${BC_DV.map(([v,t])=>`<option value="${v}" ${v===bcDv()?'selected':''}>Đơn vị: ${t}</option>`).join('')}</select>
    <span style="margin-left:auto"></span><button class="m-btn out" onclick="S.cache.bc_xuat&&S.cache.bc_xuat()">${IC_XLS} Xuất Excel</button></div>
    <div class="m-seg bc-tabs">${tabs.map(([v,t])=>`<button class="${tab===v?'on':''}" onclick="S.f.${S.page}_tab='${v}';render()">${t}</button>`).join('')}</div>`}
// bảng chung: rows = [{so, ten, v:{thang:giá trị}, kieu:'nhom'|'con'|'tong'|'net', mo, key, click, am}] · cot = 'thang' | 'mot' (1 tháng) | 'luy_ke' | danh sách cột tự do
function bcBang(rows,ky,o={}){
  const nay=homNay().slice(0,7),tl=ky.ms,mot=ky.k==='thang'&&!o.cot;
  const tong=r=>r.tong!=null?r.tong:sumBy(tl,m=>r.v[m]||0);
  let head,cell;
  if(o.cot){head=o.cot.map(c=>`<th class="num">${c[1]}</th>`).join('');cell=r=>o.cot.map(c=>`<td class="num ${(r.v[c[0]]||0)<0?'neg-t':''}">${bcSo(r.v[c[0]])}</td>`).join('')}
  else if(mot){head=`<th class="num">Thực hiện</th>${o.dt?'<th class="num">% doanh thu</th>':''}`;
    cell=r=>{const v=r.v[tl[0]];return `<td class="num ${(v||0)<0?'neg-t':''}"><b>${v==null&&r.kieu==='so_du'?'<span class="muted">—</span>':bcSo(v)}</b></td>${o.dt?`<td class="num">${r.kieu!=='so_du'?bcPct(['tong','net'].includes(r.kieu)?(v||0):Math.abs(v||0),o.dt[tl[0]]):''}</td>`:''}`}}
  else{head=tl.map(m=>`<th class="num">T${+m.slice(5)}/${m.slice(0,4)}<div class="bc-th2">${m>nay?'':'Thực hiện'}</div></th>`).join('')+(o.khongTong?'':`<th class="num bc-tong">${ky.k==='nam'?'Tổng năm':'Tổng kỳ'}</th>`);
    cell=r=>{let lk=0;return tl.map(m=>{if(m>nay)return '<td></td>';let v=r.v[m];if(o.luyKe&&r.kieu!=='so_du'){lk+=v||0;v=lk}return `<td class="num ${(v||0)<0?'neg-t':''}">${v==null&&r.kieu==='so_du'?'<span class="muted">—</span>':bcSo(v)}</td>`}).join('')
      +(o.khongTong?'':`<td class="num bc-tong ${tong(r)<0?'neg-t':''}"><b>${r.kieu==='so_du'?bcSo(r.tongSD):bcSo(tong(r))}</b></td>`)}}
  return `<div class="m-card"><div class="scroll"><table class="m-t bc-t"><tr><th>Chỉ tiêu</th>${head}</tr>
    ${rows.filter(r=>!r.an).map(r=>`<tr class="bc-${r.kieu||'con'} ${r.click?'click':''}" ${r.click?`onclick="${r.click}" title="Bấm để xem chi tiết"`:''}>
      <td class="nw">${r.mo!=null?`<span class="bc-mo" onclick="event.stopPropagation();bcMo('${r.key}')">${r.mo?'▾':'▸'}</span>`:'<span class="bc-mo"></span>'}${r.so?`<span class="bc-so">${r.so}</span>`:''}${esc(r.ten)}</td>${cell(r)}</tr>`).join('')}</table></div></div>`}
function bcMo(k){const s=S.f.bc_dong=S.f.bc_dong||{};s[k]=!bcMoOn(k);render()}
const bcMoOn=k=>{const s=S.f.bc_dong||{};return k in s?s[k]:['dt','cp','hdkd'].includes(k)};
const bcCS=()=>locCSAll()?null:locCS();
const csTen3=k=>(CS3.find(x=>x[0]===k)||[])[1]||(k==='chung'?'Chung (văn phòng, kho tổng…)':k);
const cong=(o,k,m,v)=>{o[k]=o[k]||{};o[k][m]=(o[k][m]||0)+(+v||0)};
// ── 1. KẾT QUẢ KINH DOANH (P&L)
async function pageBCPL(){
  const el=$('#page'),ky=bcKy(),tab=S.f.pl_tab||'tong';el.innerHTML='<div class="m-empty">Đang tính...</div>';
  const b=await rpc('kt_bc_pl2',{p_tu:ky.tu,p_den:ky.den});S.cache.pl2=b;
  const sel=bcCS(),ok=cs=>!sel||sel.includes(cs),loai=Object.fromEntries(b.loai.map(l=>[l.id,l]));
  const dtCS={},gvCS={},cpN={},cpL={},cpCS={};
  for(const x of b.dt){const cs=csCuaCN(x.cn)||'khac';cong(dtCS,cs,x.thang,x.dt);cong(gvCS,cs,x.thang,x.gv)}
  const DTG={},TRA={};   // 16/10: tách doanh thu / trả hàng như Kiot
  for(const x of b.dt)if(!bcCS()||bcCS().includes(csCuaCN(x.cn)))DTG[x.thang]=(DTG[x.thang]||0)+(+x.dt);
  for(const x of b.tra){const cs=csCuaCN(x.cn)||'khac';cong(dtCS,cs,x.thang,-x.tra);cong(gvCS,cs,x.thang,-x.gv);if(!bcCS()||bcCS().includes(cs))TRA[x.thang]=(TRA[x.thang]||0)-(+x.tra)}
  for(const x of b.cp){const cs=x.dv?(csCuaDV(x.dv)||'chung'):'chung',n=String(x.loai);cong(cpCS,cs+'|'+n,x.thang,x.tien);if(ok(cs))cong(cpN,n,x.thang,x.tien)}
  if(!sel)for(const x of b.lai_vay)cong(cpN,'lai_vay',x.thang,x.lai);
  for(const x of b.lai_vay)cong(cpCS,'chung|lai_vay',x.thang,x.lai);
  // các dòng chi phí: loại chi nhóm "Chi vận hành & quản lí" (đang dùng hoặc có số) theo thứ tự danh mục + lãi vay (trang Vay) nếu có
  const CPD=[...b.loai.filter(l=>l.nhom_bc==='Chi vận hành & quản lí'&&(l.hoat_dong||cpN[l.id])).map(l=>[String(l.id),tenOpex(l.ten)]),...(b.lai_vay.length?[['lai_vay','Lãi vay & phí tài chính']]:[])];
  S.cache.pl_cpd=CPD;
  const csDS=CS3.map(c=>c[0]).filter(ok),sumO=(o,ks)=>{const r={};ks.forEach(k=>Object.entries(o[k]||{}).forEach(([m,v])=>r[m]=(r[m]||0)+v));return r};
  const am=o=>Object.fromEntries(Object.entries(o).map(([m,v])=>[m,-v])),cg=(...os)=>{const r={};os.forEach(o=>Object.entries(o).forEach(([m,v])=>r[m]=(r[m]||0)+v));return r};
  // 21/10 kế toán: chi phí theo cây danh mục như sheet P&L — 9 nhóm cha (bấm ▸ mở mục con), mục con 5.1 có cấp con
  const LO=b.loai.filter(l=>l.nhom_bc==='Chi vận hành & quản lí'),conCua=id=>LO.filter(l=>l.cha_id===id).sort((x,y)=>(x.thu_tu-y.thu_tu)||(x.id-y.id));
  const cay=id=>[id,...conCua(id).flatMap(c=>cay(c.id))];
  const tongCay=id=>sumO(cpN,cay(id).map(String)),coSo=id=>Object.values(tongCay(id)).some(v=>v);
  const GOC=LO.filter(l=>!l.cha_id&&(l.ma||coSo(l.id))).sort((x,y)=>(x.thu_tu-y.thu_tu)||(x.id-y.id));
  const dongCP=(l,cap,mo)=>{const kids=conCua(l.id).filter(c=>c.hoat_dong||coSo(c.id)),key='cpg'+l.id,m=ct||bcMoOn(key),ids=cay(l.id).join(',');
    return [{so:l.ma||'',ten:l.ten+(l.hoat_dong?'':' (loại cũ)'),v:am(tongCay(l.id)),kieu:cap?'con2':'nhom2',an:!mo,mo:kids.length?m:null,key,click:`plCT('${ids}',${JSON.stringify(l.ten).replace(/"/g,'&quot;')})`},
      ...kids.flatMap(c=>dongCP(c,cap+1,mo&&m)),
      // 22/10: phiếu còn nằm thẳng ở nhóm (mục con KXĐ / chưa phân loại) — dòng riêng để mục con cộng lại bằng nhóm
      ...(kids.length&&Object.values(sumO(cpN,[String(l.id)])).some(v=>v)?[{so:'',ten:'Loại chi KXĐ (chờ phân mục con)',v:am(sumO(cpN,[String(l.id)])),kieu:'con2',an:!(mo&&m),click:`plCT('${l.id}','Loại chi KXĐ')`}]:[])]};
  const DT=sumO(dtCS,csDS),GV=am(sumO(gvCS,csDS)),LG=cg(DT,GV),CP=am(sumO(cpN,CPD.map(n=>n[0]))),LR=cg(LG,CP);
  S.cache.pl_dt=DT;
  const ct=tab==='ct';
  const rows=[{ten:'Doanh thu (hoá đơn hoàn thành + đang giao, như Kiot)',v:DTG,kieu:'con'},{ten:'Trả hàng',v:TRA,kieu:'con'},
    {so:'1.',ten:'Doanh thu thuần',v:DT,kieu:'nhom',mo:ct||bcMoOn('dt'),key:'dt'},
    ...csDS.map((cs,i)=>({so:'1.'+(i+1),ten:csTen3(cs),v:dtCS[cs]||{},an:!(ct||bcMoOn('dt'))})),
    {so:'2.',ten:'Giá vốn hàng bán',v:GV,kieu:'nhom',mo:ct||bcMoOn('gv'),key:'gv'},
    ...csDS.map((cs,i)=>({so:'2.'+(i+1),ten:csTen3(cs),v:am(gvCS[cs]||{}),an:!(ct||bcMoOn('gv'))})),
    {so:'3.',ten:'Lợi nhuận gộp',v:LG,kieu:'tong'},
    {so:'4.',ten:'Chi phí',v:CP,kieu:'nhom',mo:ct||bcMoOn('cp'),key:'cp'},
    ...GOC.flatMap(l=>dongCP(l,0,ct||bcMoOn('cp'))),
    ...(b.lai_vay.length?[{so:'',ten:'Lãi vay & phí tài chính (trang Vay)',v:am(cpN.lai_vay||{}),kieu:'nhom2',an:!(ct||bcMoOn('cp'))}]:[]),
    {so:'5.',ten:'Lợi nhuận ròng',v:LR,kieu:'net'}];
  let bang;
  if(tab==='cs'){const cols=[...csDS,...(sel?[]:['chung'])],tg=v=>sumBy(ky.ms,m=>v[m]||0);
    const r2=[{so:'1.',ten:'Doanh thu thuần',kieu:'nhom',v:Object.fromEntries(cols.map(c=>[c,tg(dtCS[c]||{})]))},
      {so:'2.',ten:'Giá vốn hàng bán',kieu:'nhom',v:Object.fromEntries(cols.map(c=>[c,-tg(gvCS[c]||{})]))}];
    r2.push({so:'3.',ten:'Lợi nhuận gộp',kieu:'tong',v:Object.fromEntries(cols.map(c=>[c,r2[0].v[c]+r2[1].v[c]]))});
    const cpc=[...GOC.map(l=>({so:l.ma||'',ten:l.ten,v:Object.fromEntries(cols.map(c=>[c,-sumBy(cay(l.id),id=>tg(cpCS[c+'|'+id]||{}))]))})),
      ...(b.lai_vay.length?[{so:'',ten:'Lãi vay & phí tài chính',v:Object.fromEntries(cols.map(c=>[c,-tg(cpCS[c+'|lai_vay']||{})]))}]:[])];
    const cpT={so:'4.',ten:'Chi phí',kieu:'nhom',v:Object.fromEntries(cols.map(c=>[c,sumBy(cpc,r=>r.v[c])]))};
    r2.push(cpT,...cpc,{so:'5.',ten:'Lợi nhuận ròng',kieu:'net',v:Object.fromEntries(cols.map(c=>[c,r2[2].v[c]+cpT.v[c]]))});
    r2.forEach(r=>r.v.tong=sumBy(cols,c=>r.v[c]||0));
    r2.push({ten:'Biên lợi nhuận ròng',kieu:'con',v:{},bien:1});
    const colsH=[...cols.map(c=>[c,csTen3(c)]),['tong','Tổng']];
    bang=bcBang(r2.filter(r=>!r.bien),ky,{cot:colsH})+`<div class="muted bc-ghi">Chi phí chung (văn phòng, kho tổng, marketing chung…) chưa chia về cơ sở — chia theo % doanh số / tự nhập ở tab Phân bổ của từng phiếu chi.</div>`;
    S.cache.bc_xuat=()=>xuatCSV('pl-so-sanh-co-so-'+ky.tu+'_'+ky.den,[['Chỉ tiêu',r=>(r.so||'')+' '+r.ten],...colsH.map(c=>[c[1],r=>Math.round(r.v[c[0]]||0)])],r2.filter(r=>!r.bien));
  }else if(false){bang=`<div class="m-card m-empty">Chưa có kế hoạch (ngân sách) cho ${esc(ky.ten)}. Khi kế toán nhập kế hoạch theo tháng, cột Kế hoạch / % hoàn thành sẽ tự có số. Phần nhập kế hoạch nằm ở báo cáo 5. Chi phí & Ngân sách (làm sau).</div>`;S.cache.bc_xuat=null}
  else{bang=bcBang(rows,ky,{dt:DT,luyKe:tab==='lk'});
    S.cache.bc_xuat=()=>xuatCSV('pl-'+ky.tu+'_'+ky.den,[['Chỉ tiêu',r=>(r.so||'')+' '+r.ten],...ky.ms.map(m=>['T'+m.slice(5)+'/'+m.slice(0,4),r=>Math.round(r.v[m]||0)]),['Tổng',r=>Math.round(sumBy(ky.ms,m=>r.v[m]||0))]],rows)}
  el.innerHTML=head('Báo cáo kết quả kinh doanh (P&L) <span class="badge" style="vertical-align:middle">'+esc(ky.ten)+'</span>','<span class="badge">Tổng hợp doanh thu, chi phí, lợi nhuận theo thời gian và theo cơ sở</span>')
    +bcBar([['tong','P&L tổng hợp'],['ct','P&L chi tiết'],['cs','So sánh cơ sở'],['lk','Luỹ kế năm']],tab)+bang
    +`<div class="muted bc-ghi">Doanh thu thuần = hoá đơn Kiot hoàn thành − trả hàng (theo cơ sở bán) · Giá vốn = giá vốn bình quân Kiot lúc kéo (gần đúng) · Chi phí = chi phí HẠCH TOÁN theo từng loại chi OPEX: phiếu đã xác nhận (chờ chi + đã chi, trừ tạm ứng), ghi vào tháng phân bổ / tháng hạch toán / tháng sử dụng dịch vụ — không theo ngày chi tiền (dòng tiền xem Sổ quỹ) · không gồm nhập hàng (đã nằm trong giá vốn), trả gốc vay, đầu tư · Lãi vay lấy từ trang Vay & lãi vay${sel?' (ẩn khi lọc cơ sở)':''}. <a class="m-link" onclick="go('pl_thuc_thu')">Xem P&L theo thực thu / thực chi (cũ)</a></div>`;
}
// bấm nhóm chi phí → khung phải: thực hiện, % doanh thu, khoản mục con (loại chi, đơn vị), danh sách phiếu chi
async function plCT(n,tenG){
  const ky=bcKy(),b=S.cache.pl2,ids=String(n).split(',').map(Number);   // 21/10: bấm nhóm cha → mọi mục con
  const ten=tenG||(S.cache.pl_cpd.find(x=>x[0]===String(n))||[])[1]||'Chi phí';
  modal(`<h2>${esc(ten)} · ${esc(ky.ten)}</h2><div class="m-empty">Đang tải...</div>`,true);
  const sel=bcCS(),ok=cs=>!sel||sel.includes(cs);
  let ds=ids.length?await rpc('kt_pl_ct',{p_loai:ids,p_tu:ky.tu,p_den:ky.den}):[];ds=ds.filter(x=>ok(x.dv?(csCuaDV(x.dv)||'chung'):'chung'));
  const tong=sumBy(ds,x=>x.tien),dt=sumBy(ky.ms,m=>(S.cache.pl_dt||{})[m]||0),loai=Object.fromEntries(b.loai.map(l=>[l.id,l.ten]));
  const nhom=(f)=>Object.entries(ds.reduce((o,x)=>(o[f(x)]=(o[f(x)]||0)+x.tien,o),{})).sort((a,c)=>c[1]-a[1]);
  const bangCon=(t,arr)=>`<div class="m-st">${t}</div><table class="m-t"><tr><th>Khoản mục</th><th class="num">Thực hiện</th><th class="num">Tỷ trọng</th></tr>${arr.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${fmt(v)}</td><td class="num">${pct(v,tong)}</td></tr>`).join('')||'<tr><td colspan="3" class="m-empty">Không có</td></tr>'}</table>`;
  $('#modal>div').innerHTML=`<h2>${esc(ten)} · ${esc(ky.ten)}</h2>
    <div class="bc-k" style="grid-template-columns:repeat(3,1fr)"><div><span>Thực hiện</span><b>${fmt(tong)}</b></div><div><span>% doanh thu</span><b>${pct(tong,dt)||'–'}</b></div><div><span>Số phiếu chi</span><b>${fmt(new Set(ds.map(x=>x.id)).size)}</b></div></div>

    <div class="m-st">Danh sách phiếu chi (${ds.length}) <span class="r">${ds.length?`<button class="m-btn sm" onclick="xuatCSV('chi-tiet-${n}',[['Ngày',x=>x.ngay],['Số phiếu',x=>x.so],['Nội dung',x=>x.nd],['Thụ hưởng',x=>x.th||''],['Loại',x=>S.cache.pl_loai[x.loai]||''],['Số tiền',x=>x.tien]],S.cache.pl_ct)">Xuất Excel</button>`:''}</span></div>

  for(const x of b.chi){const cs=x.dv?(csCuaDV(x.dv)||'chung'):'chung';if(ok(cs))cong(chi,x.loai,x.thang,x.tien)}
  const am=o=>Object.fromEntries(Object.entries(o).map(([m,v])=>[m,-v])),cg=(...os)=>{const r={};os.forEach(o=>Object.entries(o||{}).forEach(([m,v])=>r[m]=(r[m]||0)+v));return r};

  const lThu=Object.keys(thu).filter(k=>k!=='-1').sort((a,c)=>ord(a)-ord(c)),lChi=g=>Object.keys(chi).filter(k=>k!=='-1'&&nhomChi(k)===g).sort((a,c)=>ord(a)-ord(c));

  const rongTK=Object.fromEntries(b.rong.map(x=>[x.thang,+x.rong])),dau={},cuoi={};let sd=b.dau!=null&&!sel?+b.dau:null;

  const msSD=ms.filter(m=>dau[m]!=null);

    {so:'I.',ten:'Lưu chuyển tiền từ hoạt động kinh doanh',v:KD,kieu:'nhom',mo:ct||kd,key:'hdkd'},
    {so:'1.',ten:'Tiền thu vào',v:TT,kieu:'nhom2',an:!(ct||kd)},...lThu.map(k=>({ten:'· '+tenL(k),v:thu[k],kieu:'con2',an:!(ct||kd)})),
    {so:'2.',ten:'Tiền chi ra',v:CKD,kieu:'nhom2',an:!(ct||kd)},...lChi('kd').map(k=>({ten:'· '+chiTenNgan(k),v:am(chi[k]),kieu:'con2',an:!(ct||kd)})),
    {so:'II.',ten:'Lưu chuyển tiền từ hoạt động đầu tư',v:DTU,kieu:'nhom',mo:ct||dt,key:'lcdt'},...lChi('dt').map(k=>({ten:'· '+chiTenNgan(k),v:am(chi[k]),kieu:'con2',an:!(ct||dt)})),
    {so:'III.',ten:'Lưu chuyển tiền từ hoạt động tài chính',v:TC,kieu:'nhom',mo:ct||tc,key:'lctc'},{ten:'· Nhận tiền vay (giải ngân)',v:VN,kieu:'con2',an:!(ct||tc)},{ten:'· Trả nợ vay (trang Vay & lãi vay)',v:VT,kieu:'con2',an:!(ct||tc)},...lChi('tc').map(k=>({ten:'· '+chiTenNgan(k)+' (gồm cả gốc + lãi)',v:am(chi[k]),kieu:'con2',an:!(ct||tc)})),
    ...(Object.keys(CNT).length||Object.keys(CNC).length?[{so:'IV.',ten:'Giao dịch cá nhân (không hạch toán)',v:CN,kieu:'nhom',mo:ct||bcMoOn('lccn'),key:'lccn'},{ten:'· Tiền vào',v:CNT,kieu:'con2',an:!(ct||bcMoOn('lccn'))},{ten:'· Tiền ra',v:CNC,kieu:'con2',an:!(ct||bcMoOn('lccn'))}]:[]),
    {so:'V.',ten:'Lưu chuyển tiền thuần trong kỳ',v:RONG,kieu:'tong'},
    {so:'VI.',ten:'Tiền cuối kỳ',v:cuoi,kieu:'so_du',tongSD:cuoi[msSD[msSD.length-1]],an:!!sel}];

    +bcBar([['tong','Dòng tiền tổng hợp'],['ct','Dòng tiền chi tiết'],['lk','Luỹ kế']],tab)+bang
    +`<div class="muted bc-ghi">Tiền thực: phiếu thu đã duyệt (theo ngày thu) · phiếu chi đã thanh toán (theo ngày trả, không phân bổ tháng) · điều chuyển giữa các tài khoản công ty không tính (tự triệt tiêu).

const QT_IC='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 20V11h3v9zm6.5 0V5h3v15zM17 20v-6h3v6z"/></svg>';
const qtK=(c,l,v,s)=>`<div class="m-k" style="--c:var(--${c})"><div class="m-ic">${QT_IC}</div><div style="min-width:0;flex:1"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div></div>`;

async function pagePL(){
  const el=$('#page');el.innerHTML=head('P&L',kyBar())+'<div class="empty">Đang tính...</div>';
  const b=await rpc('kt_bc_pl',{p_tu:S.tu,p_den:S.den});
  const th=[...new Set([...b.thu,...b.chi,...b.kiot].map(x=>x.thang))].sort();
  const get=(arr,f)=>th.map(t=>sumBy(arr.filter(x=>x.thang===t&&f(x)),x=>x.tien));
  const DT=['Thu bán hàng','Thu đặt cọc','Thu công nợ'];
  const dtRows=DT.map(l=>[l,get(b.thu,x=>x.loai===l)]),dt=th.map((_,i)=>sumBy(dtRows,r=>r[1][i]));
  const gvRows=[...new Set(b.chi.filter(x=>x.nhom_bc==='Chi nhập hàng').map(x=>x.loai))].map(l=>[l,get(b.chi,x=>x.loai===l)]),gv=th.map((_,i)=>sumBy(gvRows,r=>r[1][i]));
  const opRows=[...new Set(b.chi.filter(x=>x.nhom_bc==='Chi vận hành & quản lí').map(x=>x.loai))].map(l=>[l,get(b.chi,x=>x.loai===l)]),op=th.map((_,i)=>sumBy(opRows,r=>r[1][i]));
  const khacThu=get(b.thu,x=>!DT.includes(x.loai)),tc=get(b.chi,x=>x.nhom_bc==='Chi tài chính'),dtu=get(b.chi,x=>x.nhom_bc==='Chi đầu tư');
  const conLai=get(b.chi,x=>!['Chi nhập hàng','Chi vận hành & quản lí','Chi tài chính','Chi đầu tư'].includes(x.nhom_bc));
  const lai=th.map(t=>sumBy(b.lai_vay.filter(x=>x.thang===t),x=>x.lai));
  const gop=th.map((_,i)=>dt[i]-gv[i]),hd=th.map((_,i)=>gop[i]-op[i]),rong=th.map((_,i)=>hd[i]+khacThu[i]-tc[i]-dtu[i]-conLai[i]);
  const kdt=th.map(t=>sumBy(b.kiot.filter(x=>x.thang===t),x=>x.dt)),kgv=th.map(t=>sumBy(b.kiot.filter(x=>x.thang===t),x=>x.gv)),ktr=th.map(t=>sumBy(b.kiot_tra.filter(x=>x.thang===t),x=>x.tra));
  const cot=a=>a.map(v=>`<td class="num ${v<0?'neg':''}">${v?fmt(v):'–'}</td>`).join('')+`<td class="num ${sumBy(a,v=>v)<0?'neg':''}"><b>${fmt(sumBy(a,v=>v))}</b></td>`;
  const dong=(t,a,cls,thut)=>`<tr class="${cls||''}"><td style="${thut?'padding-left:28px':''}">${t}</td>${cot(a)}</tr>`;
  const nhom=(t)=>`<tr><td colspan="${th.length+2}" class="pl-h">${t}</td></tr>`;
  el.innerHTML=head('P&L — Lãi / lỗ',kyBar()+'<span class="badge">Theo thực thu / thực chi</span>')+
    `<div class="card scroll"><table class="pl"><tr><th>Khoản mục</th>${th.map(t=>`<th class="num">Tháng ${t.slice(5)}/${t.slice(0,4)}</th>`).join('')}<th class="num">Cộng kỳ</th></tr>
      ${nhom('Doanh thu (thực thu)')}${dtRows.map(r=>dong(r[0],r[1],'',1)).join('')}${dong('Tổng doanh thu',dt,'tong')}
      ${nhom('Giá vốn (thực chi nhập hàng)')}${gvRows.map(r=>dong(r[0],r[1],'',1)).join('')}${dong('Lợi nhuận gộp',gop,'tong')}
      ${nhom('Chi phí hoạt động')}${opRows.map(r=>dong(r[0],r[1],'',1)).join('')}${dong('Tổng chi phí hoạt động',op,'',0)}${dong('Lợi nhuận hoạt động',hd,'tong')}
      ${nhom('Ngoài hoạt động')}${dong('+ Thu khác (vốn góp, lãi NH, hoàn tiền…)',khacThu,'',1)}${dong('− Chi tài chính (vay, lãi — CHƯA tách gốc / lãi)',tc,'',1)}${dong('− Chi đầu tư (CAPEX)',dtu,'',1)}${conLai.some(v=>v)?dong('− Chi khác chưa xếp nhóm',conLai,'',1):''}
      ${dong('LỢI NHUẬN RÒNG (thực thu − thực chi)',rong,'tong pl-net')}
      ${nhom('Tham chiếu từ Kiot (theo hoá đơn, không phải tiền thực)')}${dong('Doanh thu hoá đơn hoàn thành',kdt,'',1)}${dong('Trả hàng',ktr,'',1)}${dong('Giá vốn hàng bán (bình quân)',kgv,'',1)}${dong('Lãi gộp theo hoá đơn',th.map((_,i)=>kdt[i]-ktr[i]-kgv[i]),'',1)}
      ${lai.some(v=>v)?nhom('Lãi vay đã trả (từ Vay & lãi vay)')+dong('Lãi vay',lai,'',1):''}</table></div>
    <div class="panel" style="margin-top:14px;font-size:12px;color:var(--text2)"><b>Cách tính:</b> doanh thu = thu bán hàng + đặt cọc + thu công nợ đã duyệt (theo ngày thu); giá vốn = chi loại "Chi nhập hàng" đã thanh toán (theo ngày trả); chi phí = chi nhóm "Chi vận hành & quản lí". Chi tài chính hiện gồm CẢ trả gốc vay (chưa tách) — nên lợi nhuận ròng đang thấp hơn thực tế. Phần "Tham chiếu Kiot" để so: bán theo hoá đơn và giá vốn hàng bán thật.</div>`;
