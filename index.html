<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Kế Toán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&subset=vietnamese&display=swap" rel="stylesheet">
<style>
/* App KẾ TOÁN — thu · chi · điều chuyển · công nợ · dòng tiền. Monsieur Claude */
:root{
  --bg:#f5f6f8;--surface:#fff;--bg2:#f1f3f6;--border:#e3e6eb;--text:#111827;--text2:#374151;--muted:#6b7280;
  --accent:#2563eb;--accent-fg:#fff;--sel-bg:#eff6ff;
  --ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#be123c;--bad-bg:#ffe4e6;
  --info:#0e7490;--info-bg:#cffafe;--grey:#4b5563;--grey-bg:#e5e7eb;--vio:#6d28d9;--vio-bg:#ede9fe;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a21;--bg2:#1e222b;--border:#2b303b;--text:#e5e7eb;--text2:#cbd5e1;--muted:#8b93a3;
  --accent:#60a5fa;--accent-fg:#0b1220;--sel-bg:#15233d;
  --ok:#4ade80;--ok-bg:#12301f;--warn:#fbbf24;--warn-bg:#352812;--bad:#fb7185;--bad-bg:#3a1520;
  --info:#67e8f9;--info-bg:#0e2e36;--grey:#cbd5e1;--grey-bg:#2b303b;--vio:#c4b5fd;--vio-bg:#2a1f47;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a21;--bg2:#1e222b;--border:#2b303b;--text:#e5e7eb;--text2:#cbd5e1;--muted:#8b93a3;
  --accent:#60a5fa;--accent-fg:#0b1220;--sel-bg:#15233d;
  --ok:#4ade80;--ok-bg:#12301f;--warn:#fbbf24;--warn-bg:#352812;--bad:#fb7185;--bad-bg:#3a1520;
  --info:#67e8f9;--info-bg:#0e2e36;--grey:#cbd5e1;--grey-bg:#2b303b;--vio:#c4b5fd;--vio-bg:#2a1f47;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:12.5px;color:var(--text)}
.wrap{padding:22px 28px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.title{font-size:20px;font-weight:800;margin-right:auto}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:var(--bg2);color:var(--text2);font-size:11px;font-weight:700;white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.ok{background:var(--ok-bg);color:var(--ok)}
.btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.bad{color:var(--bad)}.btn.ok{color:var(--ok)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .right,.top .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
select,input,textarea{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);font-weight:600;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.sel{height:30px;padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
.sel.on{border-color:var(--accent);color:var(--accent)}
input.sel{cursor:text;font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--text2)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.kpi-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1.5px solid var(--border);border-left:4px solid var(--c,var(--accent));border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--c)}
.kpi .ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.kpi .ic svg{width:20px;height:20px}
.kpi .l{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}
.sec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--bg2);padding:9px 10px;font-size:11px;font-weight:800;color:var(--muted);text-align:left;white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.c,td.c{text-align:center}
td.nw{white-space:nowrap}
td.wrap2{max-width:340px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg2)}
tr.tong td{font-weight:800;background:var(--bg2)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.vb{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}.neg{color:var(--bad)}.pos{color:var(--ok)}
a{color:var(--accent);font-weight:700;text-decoration:none}
.gate{max-width:360px;margin:14vh auto 0;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:22px}
.gate h1{font-size:18px;margin:0 0 12px}
.gate input[type=password]{width:100%;margin-bottom:10px;padding:9px 12px}
.err{color:var(--bad);font-weight:700;font-size:12px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--surface);border-radius:16px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
.modal h2{font-size:16px;margin:0 0 12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.form label.full{grid-column:1/-1}
.form label>input,.form label>select,.form label>textarea{text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);width:100%}
.form .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:12.5px;color:var(--text2)}
.form .chk input{width:auto}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.acts .left{margin-right:auto}
.pb{display:grid;grid-template-columns:1fr 160px 30px;gap:6px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12.5px}
.kv .k{color:var(--muted);font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;font-weight:700;font-size:12.5px;z-index:60}
.empty{padding:22px;text-align:center;color:var(--muted)}
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1.5px solid var(--border);display:flex;flex-direction:column}
.sb-strip{height:4px;background:linear-gradient(90deg,var(--accent),#7c3aed,#0d9488,#16a34a);flex-shrink:0}
.sb-brand{padding:16px 18px 6px;font-size:15px;font-weight:800}
.sb-who{padding:0 18px 4px;font-size:11px;color:var(--muted);font-weight:600}
.sb-section{padding:14px 18px 6px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:2px 8px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);border:1.5px solid transparent}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--sel-bg);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 18%,transparent)}
.nav-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px}
.sb-bottom{margin-top:auto;border-top:1.5px solid var(--border);padding:8px 0 10px}
.sb-tools{display:flex;gap:6px;padding:6px 16px 0}
.sb-tools .btn{flex:1;padding:5px 8px;font-size:11.5px}
.sb-ver{padding:6px 18px 0;font-size:10px;color:var(--muted)}
.sb-menu{display:none;padding:3px 10px}
.sb-brand .muted{display:none}
@media (max-width:760px){.sb-brand .muted{display:inline}}
.main{flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.doc h3{font-size:14px;margin:20px 0 6px}
.doc p,.doc li{color:var(--text2);line-height:1.65}
.doc ol,.doc ul{margin:4px 0;padding-left:20px}
.doc .rule{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.doc .rule b{color:var(--text)}
.tt-input{width:130px;text-align:right;padding:3px 8px;font-variant-numeric:tabular-nums}
/* Giao diện kiểu phần mềm kế toán (anh Hải 05/10: "đừng làm giống gg sheet") — bảng thoáng, không kẻ ô,
   tổng quan dạng thẻ + biểu đồ, xem phiếu bằng ngăn kéo bên phải (kiểu MISA AMIS / Xero / QuickBooks). */
th{background:transparent;border-bottom:1.5px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:11px 14px}
td{padding:11px 14px;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
tr:last-child td{border-bottom:none}
td.num b{font-weight:800}
.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:16px 18px}
.panel h4{margin:0 0 12px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid-2-1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.acc{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;cursor:pointer}
.acc:hover{border-color:var(--accent)}
.acc .n{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .t{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.acc .b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.acc .d{font-size:11.5px;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.st-bad{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--bad)}
.todo{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;font-weight:600;color:var(--text2)}
.todo:last-child{border-bottom:none}.todo:hover{color:var(--text)}
.todo .cnt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;min-width:28px;text-align:right;color:var(--text)}
.todo .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.todo.xong{opacity:.55;cursor:default}
.hbar{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:4px 12px;align-items:center;margin-bottom:9px;font-size:12px}
.hbar .lb{font-weight:600;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{display:flex;align-items:center;gap:8px;min-width:0}
.hbar .bar-fill{height:14px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hbar .v{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
.hbar .v span{color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--text2);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:8px 11px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:5;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:3px}
.ax{font-size:10px;fill:var(--muted);font-family:var(--font)}
:root{--s1:#2a78d6;--s2:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#e66767}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#e66767}
.modal.drawer{justify-content:flex-end;padding:0}
.modal.drawer>div{max-width:560px;height:100vh;max-height:100vh;border-radius:16px 0 0 16px;padding:20px 22px}
.tabs .btn.on .muted{color:inherit;opacity:.8}
.li.li3{grid-template-columns:minmax(0,1fr) 200px 150px}
.day-h{display:flex;justify-content:space-between;gap:10px;padding:10px 4px 6px;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:760px){.li.li3{grid-template-columns:minmax(0,1fr) auto}}
.li{display:grid;grid-template-columns:36px minmax(0,1fr) 220px 140px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.li:last-child{border-bottom:none}.li:hover{background:var(--bg2)}
.li .av{width:36px;height:36px;border-radius:50%;background:var(--sel-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800}
.li .t1{font-weight:700;color:var(--text)}
.li .t2{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.li .a{text-align:right;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
@media (max-width:760px){.li{grid-template-columns:minmax(0,1fr) auto}.li .av{display:none}.li .s{grid-column:1}.li .a{grid-row:1;grid-column:2}}
@media (max-width:760px){.grid-2-1{grid-template-columns:1fr}.modal.drawer>div{border-radius:0;max-width:none}}
@media (max-width:760px){
  .wrap{padding:14px 16px 50px}
  .shell{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1.5px solid var(--border)}
  .sb-strip{width:100%}.sb-section,.sb-who,.sb-ver{display:none}
  .sb-bottom{margin:0;border:none;padding:0;display:flex;flex-wrap:wrap}
  .sb-brand{padding:10px 16px;width:100%;display:flex;align-items:center;gap:6px}
  .sb-menu{display:inline-block!important;margin-left:auto}
  .sidebar:not(.open) .nav-item,.sidebar:not(.open) .sb-bottom{display:none}
  .sidebar.open .nav-item{width:calc(50% - 16px)}
  .kpi-row,.two,.form{grid-template-columns:1fr}
  .kpi .v{font-size:19px}
  .bar .right{margin-left:0}
  .kv{grid-template-columns:1fr}
}
</style>
</head>

<script>

// Khoá công khai (anon) chỉ gọi được các hàm kt_* — hàm tự kiểm MÃ TRUY CẬP rồi mới trả dữ liệu
// (xem supabase-schema-kt.sql). Bảng kt_* không cho đọc thẳng. KHÔNG đặt khoá quản trị ở đây.
const APP_VERSION='05/10/2026 09:22';
const SB_URL='https://bcrpxfvvjsjpvbksqzls.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjcnB4ZnZ2anNqcHZia3NxemxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNzE0OTgsImV4cCI6MjEwMjg0NzQ5OH0.XGEUvHP1YBhxYKD9Xq1yH2gl95-V9VgaY5HfsAnFb2c';

const TT_CHI={cho_duyet:['Chờ duyệt','warn'],cho_tt:['Chờ thanh toán','info'],da_tt:['Đã thanh toán','ok'],tu_choi:['Từ chối','bad'],tu_choi_tt:['Từ chối thanh toán','bad']};

const KIOT={khong:'Không ảnh hưởng TK cửa hàng',da_tao:'Đã tạo phiếu trên Kiot (4A)',khong_tao:'Không tạo phiếu Kiot (4B)'};

  vao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7 7 7-7"/></svg>',

// ── Tiện ích ───────────────────────────────────────────────────────────────
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n==null||n==='')?'':Math.round(Number(n)).toLocaleString('vi-VN');
const fmtD=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';
const fmtDT=d=>d?new Date(d).toLocaleString('vi-VN',{hour12:false}):'';
const so=v=>{const x=String(v??'').replace(/[^\d-]/g,'');return x?Number(x):null};
const homNay=()=>{const d=new Date(Date.now()+7*3600e3);return d.toISOString().slice(0,10)};
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);

const vietTat=t=>{const w=String(t||'').trim().split(/\s+/);return ((w.length>1?w[w.length-2][0]:'')+(w[w.length-1]||'?')[0]).toUpperCase()};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

      boPhan=()=>S.dm.don_vi.filter(x=>x.hoat_dong&&x.la_bo_phan), loai=n=>S.dm.loai.filter(x=>x.hoat_dong&&x.nhom===n);

async function rpc(fn,args={}){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON,'Content-Type':'application/json'},
    body:JSON.stringify({p_ma:S.ma,...args})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){
    const msg=(j&&(j.message||j.hint))||t||('Lỗi '+r.status);
    if(r.status===403&&/Sai mã/.test(msg)){lock(true);throw new Error(msg)}
    throw new Error(msg);
  }
  return j;
}

// ── Cổng mã truy cập ───────────────────────────────────────────────────────
function renderGate(err){
  $('#app').innerHTML=`<div class="gate"><h1>Kế Toán</h1>
    <input type="password" id="ma" placeholder="Mã truy cập" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <label style="display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px"><input type="checkbox" id="nho"> Nhớ trên máy này</label>
    <div class="err" id="err">${esc(err||'')}</div>
    <button class="btn pri" style="width:100%" onclick="login()">Vào</button></div>`;
  setTimeout(()=>$('#ma')&&$('#ma').focus(),50);
}
async function login(){
  const ma=$('#ma').value.trim();if(!ma)return;
  S.ma=ma;$('#err').textContent='Đang kiểm tra...';
  try{await rpc('kt_dang_nhap');
    try{($('#nho').checked?localStorage:sessionStorage).setItem('kt_ma',ma)}catch(e){}
    await boot();
  }catch(e){S.ma=null;renderGate(e.message)}
}
function lock(saiMa){S.ma=null;S.toi=null;S.cache={};try{localStorage.removeItem('kt_ma');sessionStorage.removeItem('kt_ma')}catch(e){}
  renderGate(saiMa?'Mã không còn đúng — nhập lại':'')}
async function boot(){
  $('#app').innerHTML='<div class="empty">Đang tải...</div>';
  const [dm,gy]=await Promise.all([rpc('kt_danh_muc'),rpc('kt_goi_y')]);
  S.dm=dm;S.toi=dm.toi;S.gy=gy;fillDatalists();
  if(!S.tu)setKy('thang',true);

function fillDatalists(){

// ── Kỳ báo cáo ─────────────────────────────────────────────────────────────
function setKy(k,silent){
  S.ky=k;const t=homNay(),d=new Date(t+'T00:00:00');let tu=t,den=t;
  if(k==='thang'){tu=t.slice(0,8)+'01'}
  else if(k==='thang_truoc'){const a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);tu=ymd(a);den=ymd(b)}
  else if(k==='7'){tu=ymd(new Date(d.getTime()-6*864e5))}
  else if(k==='tu_moc'){tu=MOC}
  if(k!=='tuy')[S.tu,S.den]=[tu<MOC?MOC:tu,den];
  if(!silent)render();
}
function kyBar(){
  return `<div class="seg">${[['thang','Tháng này'],['thang_truoc','Tháng trước'],['7','7 ngày'],['tu_moc','Từ 1/8']].map(([k,l])=>
    `<button class="${S.ky===k?'on':''}" onclick="setKy('${k}')">${l}</button>`).join('')}</div>
    <input type="date" class="sel ${S.ky==='tuy'?'on':''}" value="${S.tu}" min="${MOC}" onchange="S.ky='tuy';S.tu=this.value;render()">
    <input type="date" class="sel ${S.ky==='tuy'?'on':''}" value="${S.den}" min="${MOC}" onchange="S.ky='tuy';S.den=this.value;render()">`;
}

const IC_CANH='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
// Cột 2 chiều quanh 1 đường gốc: Thu lên (xanh), Chi xuống (đỏ). 1 trục, đầu cột bo 4px, cột tối đa 24px, rê chuột xem số.
function veThuChiNgay(){
  const box=$('#ch-ngay');if(!box)return;const data=S.cache.ngay||[];
  const W=Math.max(300,box.clientWidth),H=box.clientWidth<500?220:270,L=52,R=8,T=12,B=26;
  const mx=Math.max(1,...data.map(x=>Math.max(x.thu,x.chi)));
  const h=(H-T-B)/2,y0=T+h,sc=v=>v/mx*h,slot=(W-L-R)/Math.max(1,data.length),bw=Math.min(24,Math.max(3,slot*.62));
  const rnd=(x,y,w,hh,up)=>{if(hh<1)return'';const r=Math.min(4,hh,w/2);
    return up?`M${x},${y0} V${y0-hh+r} Q${x},${y0-hh} ${x+r},${y0-hh} H${x+w-r} Q${x+w},${y0-hh} ${x+w},${y0-hh+r} V${y0} Z`
             :`M${x},${y0} V${y0+hh-r} Q${x},${y0+hh} ${x+r},${y0+hh} H${x+w-r} Q${x+w},${y0+hh} ${x+w},${y0+hh-r} V${y0} Z`};
  const step=Math.ceil(data.length/Math.max(1,Math.floor((W-L)/58)));
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Thu và chi theo ngày">
    <line x1="${L}" x2="${W-R}" y1="${T}" y2="${T}" stroke="var(--border)" stroke-dasharray="3 4"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <text class="ax" x="${L-6}" y="${T+4}" text-anchor="end">${fmtN(mx)}</text><text class="ax" x="${L-6}" y="${y0+4}" text-anchor="end">0</text><text class="ax" x="${L-6}" y="${H-B+4}" text-anchor="end">${fmtN(mx)}</text>`;
  data.forEach((x,i)=>{const cx=L+slot*i+(slot-bw)/2;
    s+=`<path d="${rnd(cx,0,bw,sc(x.thu),true)}" fill="var(--s1)"/><path d="${rnd(cx,0,bw,sc(x.chi),false)}" fill="var(--s2)"/>`;
    if(i%step===0)s+=`<text class="ax" x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${x.ng.slice(8,10)}/${x.ng.slice(5,7)}</text>`;
    s+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent" data-tip="${fmtD(x.ng)}|Thu ${fmt(x.thu)}|Chi ${fmt(x.chi)}|Chênh lệch ${fmt(x.thu-x.chi)}"/>`});
  s+=`<line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  box.innerHTML=s;
}

function bindTip(){
  $$('.chart-wrap').forEach(w=>{if(w.dataset.tipOn)return;w.dataset.tipOn=1;let tip=null;
    w.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){if(tip)tip.remove(),tip=null;return}
      if(!tip){tip=document.createElement('div');tip.className='tip';w.appendChild(tip)}
      const p=t.dataset.tip.split('|');tip.innerHTML='<b>'+esc(p[0])+'</b>'+p.slice(1).map(esc).join('<br>');
      const r=w.getBoundingClientRect();let x=e.clientX-r.left+14;if(x+tip.offsetWidth>r.width)x=e.clientX-r.left-tip.offsetWidth-14;
      tip.style.left=Math.max(0,x)+'px';tip.style.top=(e.clientY-r.top+12)+'px'});
    w.addEventListener('mouseleave',()=>{if(tip)tip.remove(),tip=null})});
}

function pbChiaDeu(){const r=$$('#pb .pb');const t=so($('#f [name=so_tien]').value)||0;if(!r.length)return;

      ${g&&['tu_choi','tu_choi_tt'].includes(x.trang_thai)?`<button class="btn" onclick="doiTTChi(${id},'cho_duyet')">Mở lại</button>`:''}</div>`,true);

async function doiTTChi(id,tt){
  const x=S.cache.chi.find(c=>c.id===id);
  const o={...x};delete o.tao_luc;delete o.sua_luc;delete o.duyet_luc;
  const ftt=$('#ftt');if(ftt)Object.assign(o,formData(ftt));
  const fhd=$('#fhd');if(fhd)Object.assign(o,formData(fhd));
  if(tt)o.trang_thai=tt;else delete o.trang_thai;
  if(tt==='da_tt'&&(!o.tai_khoan_id||!o.loai_id||!o.ngay_tt))return alert('Cần ngày thanh toán, tài khoản chi, loại chi');
  if(o.kiot==='khong_tao'&&!(o.kiot_ly_do||'').trim())return alert('Ghi lý do không tạo phiếu Kiot');
  await save('kt_luu_chi',{p_dong:o},tt==='cho_tt'?'Đã duyệt':tt==='da_tt'?'Đã ghi thanh toán':'Đã lưu');render()}

function arrIn(v){return (v||'').split(',').map(s=>s.trim()).filter(Boolean)}

  const x=id?src.find(r=>r.id===id):{hoat_dong:true,thu_tu:100,loai:'ngan_hang',ngay_ton_dau:MOC,ton_dau:0,la_co_so:true,nhom:'chi',cach_chia:'rieng'};
  const f={
    tai_khoan:`<label class="full">Tên tài khoản (ngân hàng + chủ + số)<input name="ten" value="${esc(x.ten||'')}"></label>
      <label>Loại<select name="loai">${optsObj(LOAI_TK,x.loai)}</select></label><label>Thứ tự<input name="thu_tu" type="number" value="${x.thu_tu}"></label>
      <label>Ngày mốc tồn đầu<input type="date" name="ngay_ton_dau" value="${x.ngay_ton_dau}"></label><label>Tồn đầu tại ngày mốc${moneyIn('ton_dau',x.ton_dau)}</label>

    don_vi:`<label class="full">Tên<input name="ten" value="${esc(x.ten||'')}"></label>
      <label class="chk"><input type="checkbox" name="la_co_so" ${x.la_co_so?'checked':''}> Chịu chi phí / có trong báo cáo cơ sở</label>
      <label class="chk"><input type="checkbox" name="la_bo_phan" ${x.la_bo_phan?'checked':''}> Là bộ phận đề nghị chi</label>
      <label>Thứ tự<input name="thu_tu" type="number" value="${x.thu_tu}"></label>
      <label>Chi nhánh Kiot tương ứng (cách nhau dấu phẩy)<input name="kiot_chi_nhanh" value="${esc((x.kiot_chi_nhanh||[]).join(', '))}"></label>`,
    loai:`<label>Nhóm<select name="nhom" ${id?'disabled':''}>${optsObj({thu:'Thu',chi:'Chi'},x.nhom)}</select></label><label>Tên loại<input name="ten" value="${esc(x.ten||'')}"></label>
      <label>Nhóm báo cáo<input name="nhom_bc" value="${esc(x.nhom_bc||'')}" placeholder="vd: Chi vận hành & quản lý"></label>
      <label>Cách chia theo cơ sở (loại chi)<select name="cach_chia">${optsObj({rieng:'Riêng (theo phiếu)',ty_le_thu:'Theo tỉ lệ thu (chi phí chung)'},x.cach_chia)}</select></label>
      <label>Thứ tự<input name="thu_tu" type="number" value="${x.thu_tu}"></label>`}[bang];

    <div class="acts"><button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" onclick="luuDM('${bang}',${id||'null'})">Lưu</button></div>`);
}
async function luuDM(bang,id){const o=formData($('#f'));o.id=id;
  if('ton_dau' in o)o.ton_dau=so(o.ton_dau)||0;if('kiot_ma' in o)o.kiot_ma=arrIn(o.kiot_ma);if('kiot_chi_nhanh' in o)o.kiot_chi_nhanh=arrIn(o.kiot_chi_nhanh);
  if(id&&bang==='loai')o.nhom=S.dm.loai.find(x=>x.id===id).nhom;
  await save('kt_luu_danh_muc',{p_bang:bang,p_dong:o});await reloadDm();render()}

    toast('Đã đổi mã');render()}catch(e){alert(e.message)}}

// ── Khởi động ──────────────────────────────────────────────────────────────
try{const th=localStorage.getItem('kt_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
(async()=>{let ma=null;try{ma=sessionStorage.getItem('kt_ma')||localStorage.getItem('kt_ma')}catch(e){}
  if(!ma)return renderGate();S.ma=ma;try{await boot()}catch(e){if(S.ma)renderGate(e.message)}})();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGES[h]&&h!==S.page&&S.toi){S.page=h;shell()}});
</script>
