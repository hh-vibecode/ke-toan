<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Kế Toán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&subset=vietnamese&display=swap" rel="stylesheet">
<style>
/* App KẾ TOÁN — thu · chi · điều chuyển · công nợ · dòng tiền. Monsieur Claude */
:root{
  --bg:#f5f6f8;--surface:#fff;--bg2:#f1f3f6;--border:#e3e6eb;--text:#111827;--text2:#374151;--muted:#6b7280;
  --accent:#0078c8;--accent-fg:#fff;--sel-bg:#e6f2fa;--nav:#0b2a43;
  --ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#be123c;--bad-bg:#ffe4e6;
  --info:#0e7490;--info-bg:#cffafe;--grey:#4b5563;--grey-bg:#e5e7eb;--vio:#6d28d9;--vio-bg:#ede9fe;--teal:#0f766e;--teal-bg:#ccfbf1;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a21;--bg2:#1e222b;--border:#2b303b;--text:#e5e7eb;--text2:#cbd5e1;--muted:#8b93a3;
  --accent:#4cb3f0;--accent-fg:#06192a;--sel-bg:#12283b;--nav:#0a1a28;
  --ok:#4ade80;--ok-bg:#12301f;--warn:#fbbf24;--warn-bg:#352812;--bad:#fb7185;--bad-bg:#3a1520;
  --info:#67e8f9;--info-bg:#0e2e36;--grey:#cbd5e1;--grey-bg:#2b303b;--vio:#c4b5fd;--vio-bg:#2a1f47;--teal:#5eead4;--teal-bg:#0f2f2c;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a21;--bg2:#1e222b;--border:#2b303b;--text:#e5e7eb;--text2:#cbd5e1;--muted:#8b93a3;
  --accent:#4cb3f0;--accent-fg:#06192a;--sel-bg:#12283b;--nav:#0a1a28;
  --ok:#4ade80;--ok-bg:#12301f;--warn:#fbbf24;--warn-bg:#352812;--bad:#fb7185;--bad-bg:#3a1520;
  --info:#67e8f9;--info-bg:#0e2e36;--grey:#cbd5e1;--grey-bg:#2b303b;--vio:#c4b5fd;--vio-bg:#2a1f47;--teal:#5eead4;--teal-bg:#0f2f2c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:12.5px;color:var(--text)}
.wrap{padding:22px 28px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.title{font-size:20px;font-weight:800;margin-right:auto}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:var(--bg2);color:var(--text2);font-size:11px;font-weight:700;white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.ok{background:var(--ok-bg);color:var(--ok)}
.btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.bad{color:var(--bad)}.btn.ok{color:var(--ok)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .right,.top .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
select,input,textarea{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);font-weight:600;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.sel{height:30px;padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
.sel.on{border-color:var(--accent);color:var(--accent)}
input.sel{cursor:text;font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--text2)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.kpi-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1.5px solid var(--border);border-left:4px solid var(--c,var(--accent));border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--c)}
.kpi .ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.kpi .ic svg{width:20px;height:20px}
.kpi .l{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}
.sec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--bg2);padding:9px 10px;font-size:11px;font-weight:800;color:var(--muted);text-align:left;white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.c,td.c{text-align:center}
td.nw{white-space:nowrap}
td.wrap2{max-width:340px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg2)}
tr.tong td{font-weight:800;background:var(--bg2)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.vb{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}.neg{color:var(--bad)}.pos{color:var(--ok)}
a{color:var(--accent);font-weight:700;text-decoration:none}
.gate{max-width:360px;margin:14vh auto 0;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:22px}
.gate h1{font-size:18px;margin:0 0 12px}
.gate input[type=password]{width:100%;margin-bottom:10px;padding:9px 12px}
.err{color:var(--bad);font-weight:700;font-size:12px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--surface);border-radius:16px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
.modal h2{font-size:16px;margin:0 0 12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.form label.full{grid-column:1/-1}
.form label>input,.form label>select,.form label>textarea{text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);width:100%}
.form .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:12.5px;color:var(--text2)}
.form .chk input{width:auto}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.acts .left{margin-right:auto}
.pb{display:grid;grid-template-columns:1fr 160px 30px;gap:6px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12.5px}
.kv .k{color:var(--muted);font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;font-weight:700;font-size:12.5px;z-index:60}
.empty{padding:22px;text-align:center;color:var(--muted)}
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1.5px solid var(--border);display:flex;flex-direction:column}
.sb-strip{height:4px;background:linear-gradient(90deg,var(--accent),#7c3aed,#0d9488,#16a34a);flex-shrink:0}
.sb-brand{padding:16px 18px 6px;font-size:15px;font-weight:800}
.sb-who{padding:0 18px 4px;font-size:11px;color:var(--muted);font-weight:600}
.sb-section{padding:14px 18px 6px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:2px 8px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);border:1.5px solid transparent}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--sel-bg);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 18%,transparent)}
.nav-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px}
.sb-bottom{margin-top:auto;border-top:1.5px solid var(--border);padding:8px 0 10px}
.sb-tools{display:flex;gap:6px;padding:6px 16px 0}
.sb-tools .btn{flex:1;padding:5px 8px;font-size:11.5px}
.sb-ver{padding:6px 18px 0;font-size:10px;color:var(--muted)}
.sb-menu{display:none;padding:3px 10px}
.sb-brand .muted{display:none}
@media (max-width:760px){.sb-brand .muted{display:inline}}
.main{flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.doc h3{font-size:14px;margin:20px 0 6px}
.doc p,.doc li{color:var(--text2);line-height:1.65}
.doc ol,.doc ul{margin:4px 0;padding-left:20px}
.doc .rule{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.doc .rule b{color:var(--text)}
.tt-input{width:130px;text-align:right;padding:3px 8px;font-variant-numeric:tabular-nums}
/* Giao diện kiểu phần mềm kế toán (anh Hải 05/10: "đừng làm giống gg sheet") — bảng thoáng, không kẻ ô,
   tổng quan dạng thẻ + biểu đồ, xem phiếu bằng ngăn kéo bên phải (kiểu MISA AMIS / Xero / QuickBooks). */
th{background:transparent;border-bottom:1.5px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:11px 14px}
td{padding:11px 14px;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
tr:last-child td{border-bottom:none}
td.num b{font-weight:800}
.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:16px 18px}
.panel h4{margin:0 0 12px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid-2-1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.acc{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;cursor:pointer}
.acc:hover{border-color:var(--accent)}
.acc .n{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .t{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.acc .b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.acc .d{font-size:11.5px;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.st-bad{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--bad)}
.todo{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;font-weight:600;color:var(--text2)}
.todo:last-child{border-bottom:none}.todo:hover{color:var(--text)}
.todo .cnt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;min-width:28px;text-align:right;color:var(--text)}
.todo .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.todo.xong{opacity:.55;cursor:default}
.hbar{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:4px 12px;align-items:center;margin-bottom:9px;font-size:12px}
.hbar .lb{font-weight:600;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{display:flex;align-items:center;gap:8px;min-width:0}
.hbar .bar-fill{height:14px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hbar .v{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
.hbar .v span{color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--text2);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:8px 11px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:5;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:3px}
.ax{font-size:10px;fill:var(--muted);font-family:var(--font)}
:root{--s1:#2a78d6;--s2:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#e66767}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#e66767}
.modal.drawer{justify-content:flex-end;padding:0}
.modal.drawer>div{max-width:560px;height:100vh;max-height:100vh;border-radius:16px 0 0 16px;padding:20px 22px}
.tabs .btn.on .muted{color:inherit;opacity:.8}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ct-item{position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg2)}
.ct-thumb{height:92px;display:flex;align-items:center;justify-content:center;cursor:zoom-in;overflow:hidden;background:var(--surface)}
.ct-thumb img{width:100%;height:100%;object-fit:cover}
.ct-pdf{font-weight:800;font-size:13px;color:var(--bad);border:2px solid var(--bad);border-radius:6px;padding:6px 10px}
.ct-ten{font-size:10.5px;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.ct-nut{position:absolute;top:4px;right:4px;display:flex;gap:3px;opacity:.9}
.ct-nut button{border:none;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;cursor:pointer}
.ct-them{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:118px;border:1.5px dashed var(--border);border-radius:8px;cursor:pointer;color:var(--accent);font-size:11.5px;font-weight:700}
.ct-them small{font-size:10px;font-weight:600;color:var(--muted)}
.ct-thumb{position:relative}.ct-item.dang img{opacity:.6}
.ct-tt{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:700;padding:3px 6px;text-align:center}
.ct-item.loi .ct-tt{background:var(--bad)}.ct-item.loi .ct-thumb{cursor:pointer}.ct-item.xong .ct-tt{background:var(--ok)}
.modal.keo>div{outline:3px dashed var(--accent);outline-offset:-8px}
.ghim{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 7px;border-radius:10px;background:var(--sel-bg);color:var(--accent);font-size:11px;font-weight:700;cursor:pointer;vertical-align:middle}
.ghim svg{width:12px;height:12px}.ghim:hover{background:var(--accent);color:#fff}
.ct-them b{font-size:22px;line-height:1}.ct-them:hover{border-color:var(--accent);background:var(--sel-bg)}
.ct-lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:flex;flex-direction:column}
.ct-lb-top{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;font-size:12.5px;font-weight:700}
.ct-lb-top button{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:700}
.ct-lb-body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px 16px;min-height:0}
.ct-lb-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;background:#fff}
.ct-lb-body iframe{width:min(1000px,100%);height:100%;border:none;background:#fff;border-radius:4px}
table.pl td{padding:8px 14px}table.pl .pl-h{background:var(--bg2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.pl tr.tong td{background:transparent;border-top:1.5px solid var(--border)}table.pl tr.pl-net td{background:var(--sel-bg);font-size:13.5px}
.kpi[style*="--grey"] .ic{color:var(--grey)}
/* Tổng quan dạng biểu đồ (anh 05/10: "hiện đại, bảng biểu kiểu sơ đồ, thoáng mắt") */
.dvrow,.sdrow{display:grid;align-items:center;gap:10px;padding:6px 4px;border-radius:6px;font-size:12px}
.dvrow{grid-template-columns:minmax(110px,30%) 1fr 92px 84px}
.sdrow{grid-template-columns:minmax(150px,32%) 1fr 120px;cursor:pointer}
.dvrow:hover,.sdrow:hover{background:var(--bg2)}
.dvrow .lb,.sdrow .lb{font-weight:600;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvrow .bars{display:flex;flex-direction:column;gap:3px}
.dvrow .b1,.dvrow .b2{height:9px;border-radius:0 4px 4px 0;min-width:2px}
.dvrow .b1{background:var(--s1)}.dvrow .b2{background:var(--s2)}
.dvrow .vv{display:flex;flex-direction:column;text-align:right;font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;line-height:1.35}
.dvrow .cl{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.sdrow .trk{position:relative;height:14px}
.sdrow .z{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.sdrow .fill{position:absolute;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0}
.sdrow .fill.am{background:var(--s2);border-radius:4px 0 0 4px}
.sdrow .vv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:12.5px}
@media (max-width:760px){.dvrow{grid-template-columns:1fr 84px}.dvrow .bars,.dvrow .cl{display:none}.sdrow{grid-template-columns:1fr 110px}.sdrow .trk{display:none}}
.tb-dd{position:relative}
.tb-menu-dd{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:40}
.tb-dd.open .tb-menu-dd{display:block}
.dot-loi{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chuong{position:relative;display:inline-flex;align-items:center;padding:5px 8px}.chuong svg{width:17px;height:17px}
.cb-so{position:absolute;top:-6px;right:-7px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;line-height:17px;border-radius:9px;padding:0 4px;text-align:center}
.cb-ds{width:360px;max-height:70vh;overflow:auto;padding:0}
.cb-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;position:sticky;top:0;background:var(--surface)}
.cb-h a{font-size:11.5px;color:var(--accent);font-weight:700;text-decoration:none}
.cb-i{display:flex;gap:9px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border)}.cb-i:hover{background:var(--bg2)}

const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pct=(a,b)=>b?Math.round(a*1000/b)/10+'%':'';
const vb=(t,c)=>`<span class="vb" style="background:var(--${c}-bg);color:var(--${c})">${esc(t)}</span>`;
const sumBy=(a,f)=>a.reduce((s,x)=>s+(Number(f(x))||0),0);
const vietTat=t=>{const w=String(t||'').replace(/\(.*?\)/g,'').trim().split(/\s+/);return ((w.length>1?w[w.length-2][0]:'')+(w[w.length-1]||'?')[0]).toUpperCase()};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function opts(list,cur,trong){return (trong!=null?`<option value="">${esc(trong)}</option>`:'')+list.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(cur??'')?'selected':''}>${esc(x.ten)}</option>`).join('')}
function optsObj(o,cur){return Object.entries(o).map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${esc(v)}</option>`).join('')}
// ô tiền: gõ số → tự thêm dấu chấm hàng nghìn
function moneyIn(name,val,extra=''){return `<input name="${name}" inputmode="numeric" value="${val!=null&&val!==''?fmt(val):''}" oninput="fmtMoney(this)" ${extra} style="text-align:right">`}
function fmtMoney(el){const n=so(el.value);el.value=n==null?'':fmt(n)}
function formData(root){const o={};root.querySelectorAll('[name]').forEach(el=>{if(el.type==='checkbox')o[el.name]=el.checked;else if(el.type==='radio'){if(el.checked)o[el.name]=el.value}else o[el.name]=el.value});return o}

// Gọi hàm kt_* kèm phiên đăng nhập. Ô để trống ('') đổi thành null trước khi gửi (hàm SQL ép kiểu ngày / số).
async function rpc(fn,args={},khongPhien){
  const sach=v=>v===''?null:(v&&typeof v==='object'&&!Array.isArray(v))?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,sach(x)])):v;
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON,'Content-Type':'application/json'},
    body:JSON.stringify(sach(khongPhien?args:{p_phien:S.phien,...args}))});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){
    const msg=(j&&(j.message||j.hint))||t||('Lỗi '+r.status);
    if(r.status===403&&/Phiên đăng nhập/.test(msg)){lock(true);throw new Error(msg)}
    throw new Error(msg);
  }
  return j;
}

async function login(){

  $('#err').textContent='Đang kiểm tra...';
  try{const r=await rpc('kt_dang_nhap',{p_tk:tk,p_mk:mk,p_nho:nho},true);
    if(r.loi)return renderGate(r.loi);
    S.phien=r.phien;try{(nho?localStorage:sessionStorage).setItem('kt_phien',r.phien)}catch(e){}
    await boot();
  }catch(e){S.phien=null;renderGate(e.message)}
}
function lock(hetHan){const p=S.phien;S.phien=null;S.toi=null;S.cache={};
  try{localStorage.removeItem('kt_phien');sessionStorage.removeItem('kt_phien')}catch(e){}
  if(p&&!hetHan)rpc('kt_dang_xuat',{p_phien:p},true).catch(()=>{});
  renderGate(hetHan?'Phiên đăng nhập hết hạn — đăng nhập lại':'')}

function setKy(k,silent){
  S.ky=k;const t=homNay(),d=new Date(t+'T00:00:00');let tu=t,den=t;
  if(k==='thang'){tu=t.slice(0,8)+'01'}
  else if(k==='thang_truoc'){const a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);tu=ymd(a);den=ymd(b)}
  else if(k==='7'){tu=ymd(new Date(d.getTime()-6*864e5))}
  else if(k==='nam'){tu=t.slice(0,4)+'-01-01'}

  if(!silent)render();
}

const fmtN=n=>{n=Number(n)||0;const a=Math.abs(n),s=n<0?'−':'';
  if(a>=1e9)return s+(a/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ';
  if(a>=1e6)return s+(a/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr';
  return s+fmt(a)};
async function pageTongQuan(){
  const el=$('#page');el.innerHTML=head('Tổng quan',kyBar())+'<div class="empty">Đang tính...</div>';
  const [b,dt]=await Promise.all([rpc('kt_bao_cao',{p_tu:S.tu,p_den:S.den,p_chi_theo:S.f.chi_theo||'ngay_tt'}),rpc('kt_dong_tien',{p_tu:S.tu,p_den:S.den})]);

function veThuChiNgay(){
  const box=$('#ch-ngay');if(!box)return;const data=S.cache.ngay||[];
  const W=Math.max(300,box.clientWidth),H=box.clientWidth<500?220:270,L=52,R=8,T=12,B=26;
  const mx=Math.max(1,...data.map(x=>Math.max(x.thu,x.chi)));
  const h=(H-T-B)/2,y0=T+h,sc=v=>v/mx*h,slot=(W-L-R)/Math.max(1,data.length),bw=Math.min(24,Math.max(3,slot*.62));
  const rnd=(x,y,w,hh,up)=>{if(hh<1)return'';const r=Math.min(4,hh,w/2);
    return up?`M${x},${y0} V${y0-hh+r} Q${x},${y0-hh} ${x+r},${y0-hh} H${x+w-r} Q${x+w},${y0-hh} ${x+w},${y0-hh+r} V${y0} Z`
             :`M${x},${y0} V${y0+hh-r} Q${x},${y0+hh} ${x+r},${y0+hh} H${x+w-r} Q${x+w},${y0+hh} ${x+w},${y0+hh-r} V${y0} Z`};
  const step=Math.ceil(data.length/Math.max(1,Math.floor((W-L)/58)));
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Thu và chi theo ngày">
    <line x1="${L}" x2="${W-R}" y1="${T}" y2="${T}" stroke="var(--border)" stroke-dasharray="3 4"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <text class="ax" x="${L-6}" y="${T+4}" text-anchor="end">${fmtN(mx)}</text><text class="ax" x="${L-6}" y="${y0+4}" text-anchor="end">0</text><text class="ax" x="${L-6}" y="${H-B+4}" text-anchor="end">${fmtN(mx)}</text>`;
  data.forEach((x,i)=>{const cx=L+slot*i+(slot-bw)/2;
    s+=`<path d="${rnd(cx,0,bw,sc(x.thu),true)}" fill="var(--s1)"/><path d="${rnd(cx,0,bw,sc(x.chi),false)}" fill="var(--s2)"/>`;
    if(i%step===0)s+=`<text class="ax" x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${x.ng.slice(8,10)}/${x.ng.slice(5,7)}</text>`;
    s+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent" data-tip="${fmtD(x.ng)}|Thu ${fmt(x.thu)}|Chi ${fmt(x.chi)}|Chênh lệch ${fmt(x.thu-x.chi)}"/>`});

  box.innerHTML=s;

async function doiTTChi(id,tt){
  const x=S.cache.chi.find(c=>c.id===id);
  const o={...x};delete o.tao_luc;delete o.sua_luc;delete o.duyet_luc;
  const ftt=$('#ftt');if(ftt)Object.assign(o,formData(ftt));
  const fhd=$('#fhd');if(fhd)Object.assign(o,formData(fhd));
  if(tt)o.trang_thai=tt;else delete o.trang_thai;

// ── LUỒNG MỚI 08/10: BÁO CÁO TỪ KIOT + NHẬP LIỆU BỔ SUNG ───────────────────
// Cột đơn giản 1 dãy (doanh thu theo ngày...) — dùng chung tooltip data-tip
function veCot(id,data,mau){const box=$('#'+id);if(!box)return;const W=Math.max(300,box.clientWidth),H=210,L=52,R=8,T=12,B=26;
  const mx=Math.max(1,...data.map(x=>x.v)),slot=(W-L-R)/Math.max(1,data.length),bw=Math.min(24,Math.max(3,slot*.62)),sc=v=>v/mx*(H-T-B);
  const step=Math.ceil(data.length/Math.max(1,Math.floor((W-L)/58)));
  let s=`<svg width="${W}" height="${H}" role="img"><line x1="${L}" x2="${W-R}" y1="${T}" y2="${T}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <text class="ax" x="${L-6}" y="${T+4}" text-anchor="end">${fmtN(mx)}</text><text class="ax" x="${L-6}" y="${H-B+4}" text-anchor="end">0</text>`;
  data.forEach((x,i)=>{const cx=L+slot*i+(slot-bw)/2,h=sc(x.v),y=H-B-h,r=Math.min(4,h,bw/2);
    if(h>=1)s+=`<path d="M${cx},${H-B} V${y+r} Q${cx},${y} ${cx+r},${y} H${cx+bw-r} Q${cx+bw},${y} ${cx+bw},${y+r} V${H-B} Z" fill="var(${mau||'--s1'})"/>`;
    if(i%step===0)s+=`<text class="ax" x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${x.nhan}</text>`;
    s+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent" data-tip="${esc(x.tip)}"/>`});
  box.innerHTML=s+`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--muted)"/></svg>`}
const kpiBox=(c,ic,l,v,s)=>`<div class="kpi" style="--c:var(--${c})"><div class="ic">${IC[ic]}</div><div><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div></div>`;
const hb=(rows,nhan,giaTri,ghi)=>{const mx=Math.max(1,...rows.map(giaTri));return rows.length?rows.map(r=>`<div class="hbar" data-tip="${esc(nhan(r))}|${fmt(giaTri(r))}${ghi?'|'+ghi(r):''}"><div class="lb" title="${esc(nhan(r))}">${esc(nhan(r))}</div>
  <div class="tr"><div class="bar-fill" style="width:${Math.max(1,giaTri(r)/mx*78)}%"></div><div class="v">${fmtN(giaTri(r))}${ghi?' <span>'+esc(ghi(r))+'</span>':''}</div></div></div>`).join(''):'<div class="empty">Chưa có</div>'};
const nguonKiot=b=>`<span class="badge">Nguồn: Kiot · tự kéo 3 tiếng/lần</span>`;

  c.innerHTML=`<div class="panel" style="margin-bottom:12px;font-size:12px;color:var(--text2)">Tiền mặt tại quầy từng cửa hàng theo sổ quỹ Kiot: <b>thu</b> tiền mặt − <b>chi</b> tiền mặt tại quầy − <b>nộp</b> về két / quỹ khác + <b>nhận</b> thêm = tiền mặt <b>còn giữ ở quầy</b> (cộng dồn trong kỳ). Cuối ngày đã nộp đủ thì "còn giữ" về gần 0.</div>`+
    (cns.map(cn=>{let giu=0;const r=ds.filter(x=>x.cn===cn).map(x=>{giu+=(+x.thu||0)-(+x.chi||0)-(+x.nop||0)+(+x.nhan||0);return {...x,giu}});
      return `<div class="sec">${esc(cn||'(không rõ)')} <span class="badge">thu ${fmtN(sumBy(r,x=>x.thu))} · chi ${fmtN(sumBy(r,x=>x.chi))} · nộp ${fmtN(sumBy(r,x=>x.nop))}</span></div>
        <div class="card scroll" style="margin-bottom:12px"><table><tr><th>Ngày</th><th class="num">Thu tiền mặt</th><th class="num">Chi tại quầy</th><th class="num">Nộp két / quỹ</th><th class="num">Nhận thêm</th><th class="num">Còn giữ ở quầy</th></tr>
        ${r.slice().reverse().map(x=>`<tr><td class="nw">${fmtD(x.ngay)}</td><td class="num">${x.thu?fmt(x.thu):''}</td><td class="num">${x.chi?fmt(x.chi):''}</td><td class="num">${x.nop?fmt(x.nop):''}</td><td class="num">${x.nhan?fmt(x.nhan):''}</td><td class="num ${x.giu<0?'neg':''}"><b>${fmt(x.giu)}</b></td></tr>`).join('')}</table></div>`}).join('')||'<div class="empty">Chưa có phát sinh tiền mặt</div>');
}

function dtTabs(){return `<div class="tabs" style="margin-bottom:12px">${[['tk','Tài khoản & đối soát'],['quy','Quỹ tiền mặt 3 cửa hàng (Kiot)']].map(([k,t])=>`<button class="btn ${(S.f.dt_view||'tk')===k?'on':''}" onclick="S.f.dt_view='${k}';render()">${t}</button>`).join('')}</div>`}
// ── CHỨNG TỪ (ảnh / PDF) lưu và xem trên app (anh chốt 08/10) ──────────────
// Kho riêng tư; Edge Function kt-chung-tu kiểm phiên + quyền rồi cấp link ký tên sống 5 phút. Ảnh nén trên máy trước khi tải lên.
const FN_CT=SB_URL+'/functions/v1/kt-chung-tu';
const TEN_BANG={thu:'Thu',chi:'Chi',dieu_chuyen:'Dieu-chuyen',vay:'Vay',tai_san:'Tai-san'};
async function ctFn(b){const r=await fetch(FN_CT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phien:S.phien,...b})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.loi||'Lỗi chứng từ '+r.status);return j}
// Nén ảnh: cạnh dài tối đa 2000px, JPEG 82% (~400–600 KB, vẫn đọc rõ hoá đơn). PDF / ảnh không đọc được (HEIC trên máy không hỗ trợ) giữ nguyên.
async function nenAnh(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<350*1024)return f;
  try{const bm=await createImageBitmap(f);const k=Math.min(1,2000/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(!b||b.size>=f.size)return f;
    return new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})}catch(e){return f}}
// Ô chứng từ (anh 08/10: "gọn nhất cho người up, giảm dung lượng ngầm, click lại ra luôn"):
// bấm ＋ / kéo thả / dán Ctrl+V là xong — nén + tải lên chạy NGẦM theo hàng đợi, ô hiện ảnh xem trước + %; đóng phiếu vẫn tải tiếp.
// Phiếu MỚI chưa lưu: ảnh chọn trước được giữ lại, bấm Lưu phiếu là tự tải lên. ganCT() tự vẽ ô sau khi mở form / ngăn kéo.
const CTQ=[],CT_MOI={};let ctChay=false,ctUid=0;
const ctBox=(bang,id,sua)=>{if(!id)CT_MOI[bang]=[];
  return `<div class="sec" style="margin-top:14px">Chứng từ đính kèm</div><div class="ct" data-bang="${bang}" data-id="${id||''}" data-sua="${sua?1:0}"><div class="muted" style="font-size:12px">Đang tải chứng từ…</div></div>`};
function ganCT(){$$('.ct[data-bang]:not([data-xong])').forEach(el=>{el.dataset.xong=1;veCT(el)})}
const ctAnh=f=>/^image\//.test(f.type||'');
const ctNhan=q=>({cho:'Chờ tải',nen:'Đang nén…',tai:'Đang tải '+(q.pct||0)+'%',xong:'✓ Đã lưu',loi:'Lỗi — bấm thử lại',moi:'Lưu phiếu là tải lên'}[q.tt]);
function ctO(q,i){return `<div class="ct-item dang ${q.tt}" data-q="${q.uid||''}">
    <div class="ct-thumb" ${q.tt==='loi'?`onclick="ctThuLai(${q.uid})" title="${esc(q.loi||'')}"`:''}>${q.url?`<img src="${q.url}" alt="">`:`<span class="ct-pdf">${/pdf/i.test(q.file.type+q.file.name)?'PDF':'TỆP'}</span>`}<span class="ct-tt">${ctNhan(q)}</span></div>
    <div class="ct-ten" title="${esc(q.file.name)}">${esc(q.file.name)}</div>
    ${q.tt==='moi'?`<div class="ct-nut"><button title="Bỏ" onclick="ctBoMoi('${q.bang}',${i})">✕</button></div>`:''}</div>`}
function ctLuoi(bang,id,ds,u,sua){
  const dang=id?CTQ.filter(q=>q.k===bang+':'+id):(CT_MOI[bang]||[]);
  return `<div class="ct-grid">${ds.map(x=>{const anh=/^image\//.test(x.mime||'');return `<div class="ct-item">
        <div class="ct-thumb" onclick="xemCT('${bang}',${id},${x.id})">${anh&&u[x.id]?`<img src="${esc(u[x.id])}" alt="${esc(x.ten)}" loading="lazy">`:`<span class="ct-pdf">${/pdf/.test(x.mime||'')?'PDF':'TỆP'}</span>`}</div>
        <div class="ct-ten" title="${esc(x.ten)} · ${esc(x.tao_boi||'')} ${fmtDT(x.tao_luc)}">${esc(x.ten)}</div>
        <div class="ct-nut"><button title="Tải về" onclick="taiVeCT([${x.id}])">⬇</button>${sua?`<button title="Xoá" onclick="xoaCT('${bang}',${id},${x.id})">✕</button>`:''}</div></div>`}).join('')}
      ${dang.map(ctO).join('')}
      ${sua?`<label class="ct-them"><input type="file" multiple accept="image/*,application/pdf" hidden onchange="ctThem('${bang}',${id||0},this.files);this.value=''"><b>＋</b><span>Thêm ảnh / PDF</span><small>kéo thả · Ctrl+V</small></label>`:''}</div>
    ${ds.length>1?`<div style="margin-top:6px"><button class="btn sm" onclick="taiVeCT([${ds.map(x=>x.id).join(',')}])">⬇ Tải tất cả (${ds.length})</button></div>`:''}
    ${!ds.length&&!dang.length&&!sua?'<div class="muted" style="font-size:12px">Chưa có chứng từ</div>':''}`}
async function veCT(el){
  const bang=el.dataset.bang,id=+el.dataset.id||0,sua=el.dataset.sua==='1';
  if(!id){el.innerHTML=ctLuoi(bang,0,[],{},sua);return}
  try{const ds=await rpc('kt_ds_chung_tu',{p_bang:bang,p_dong_id:id});
    const urls=ds.length?(await ctFn({viec:'xem',ids:ds.map(x=>x.id)})).ds:[];const u=Object.fromEntries(urls.map(x=>[x.id,x.url]));
    S.cache['ct_'+bang+id]=ds.map(x=>({...x,url:u[x.id]}));
    el.innerHTML=ctLuoi(bang,id,ds,u,sua);
  }catch(e){el.innerHTML=`<div class="neg" style="font-size:12px">${esc(e.message)}</div>`}}
// vẽ lại ô của 1 phiếu đang mở (nếu có): taiLai = đọc lại danh sách từ máy chủ, không thì chỉ vẽ lại phần đang tải
function veLaiCT(bang,id,taiLai){$$(`.ct[data-bang="${bang}"][data-id="${id||''}"]`).forEach(el=>{
  if(taiLai||!id){veCT(el);return}
  const g=el.querySelector('.ct-grid');if(!g)return;g.querySelectorAll('.ct-item.dang').forEach(n=>n.remove());
  const them=g.querySelector('.ct-them');const h=CTQ.filter(q=>q.k===bang+':'+id).map(ctO).join('');
  them?them.insertAdjacentHTML('beforebegin',h):g.insertAdjacentHTML('beforeend',h)})}
function veTienDo(q){$$(`.ct-item[data-q="${q.uid}"] .ct-tt`).forEach(n=>n.textContent=ctNhan(q))}
function ctThem(bang,id,files){
  const fs=[...(files||[])].filter(f=>ctAnh(f)||/pdf/i.test(f.type)||/\.(pdf|jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if(!fs.length)return toast('Chỉ nhận ảnh hoặc PDF');
  const moi=fs.map(f=>({uid:++ctUid,bang,id,k:bang+':'+id,file:f,url:ctAnh(f)?URL.createObjectURL(f):null,tt:id?'cho':'moi',pct:0}));
  if(!id){(CT_MOI[bang]=CT_MOI[bang]||[]).push(...moi);veLaiCT(bang,0);return}
  CTQ.push(...moi);veLaiCT(bang,id);chayCT()}
function ctBoMoi(bang,i){const d=CT_MOI[bang]||[];if(d[i]&&d[i].url)URL.revokeObjectURL(d[i].url);d.splice(i,1);veLaiCT(bang,0)}
// Gọi ngay sau khi lưu phiếu mới (có id) → đẩy ảnh đã chọn vào hàng đợi
function ctGuiMoi(bang,id){const d=CT_MOI[bang]||[];CT_MOI[bang]=[];if(!id||!d.length)return;
  d.forEach(q=>{q.id=id;q.k=bang+':'+id;q.tt='cho'});CTQ.push(...d);chayCT()}
function ctThuLai(uid){const q=CTQ.find(x=>x.uid===uid);if(!q)return;q.tt='cho';q.pct=0;veTienDo(q);chayCT()}
function putTienDo(url,f,cb){return new Promise((ok,loi)=>{const x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('Content-Type',f.type||'application/octet-stream');
  x.upload.onprogress=e=>{if(e.lengthComputable)cb(Math.round(e.loaded*100/e.total))};
  x.onload=()=>x.status<300?ok():loi(new Error('Tải lên lỗi '+x.status));x.onerror=()=>loi(new Error('Mất mạng khi tải lên'));x.send(f)})}
async function chayCT(){if(ctChay)return;ctChay=true;let n=0;
  try{for(let q;(q=CTQ.find(x=>x.tt==='cho'));){
    try{q.tt='nen';veTienDo(q);const f=await nenAnh(q.file);if(f.size>15*1024*1024)throw new Error(q.file.name+' quá 15 MB');
      const {duong_dan,url}=await ctFn({viec:'tai_len',bang:q.bang,dong_id:q.id,ten:f.name});
      q.tt='tai';veTienDo(q);await putTienDo(url,f,p=>{q.pct=p;veTienDo(q)});
      await rpc('kt_them_chung_tu',{p_bang:q.bang,p_dong_id:q.id,p_duong_dan:duong_dan,p_ten:f.name,p_mime:f.type||null,p_kich_thuoc:f.size});
      q.tt='xong';n++}catch(e){q.tt='loi';q.loi=e.message}
    veTienDo(q);
    // xong cả lô của phiếu này → bỏ khỏi hàng đợi, vẽ lại ô từ máy chủ (ảnh thật + nút xem / tải / xoá)
    if(!CTQ.some(x=>x.k===q.k&&['cho','nen','tai'].includes(x.tt))){
      for(let i=CTQ.length-1;i>=0;i--)if(CTQ[i].k===q.k&&CTQ[i].tt==='xong'){if(CTQ[i].url)URL.revokeObjectURL(CTQ[i].url);CTQ.splice(i,1)}
      veLaiCT(q.bang,q.id,true)}}
  }finally{ctChay=false}
  const loi=CTQ.filter(x=>x.tt==='loi').length;
  if(n)toast(`Đã lưu ${n} chứng từ`+(loi?` · ${loi} lỗi (bấm ô lỗi để thử lại)`:''));else if(loi)toast(loi+' chứng từ tải lỗi — bấm ô lỗi để thử lại')}
// Kéo thả / dán ảnh vào form hoặc ngăn kéo đang mở có ô chứng từ
const ctDich=()=>{const m=$('#modal');return m&&m.querySelector('.ct[data-sua="1"]')};
const coFile=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
document.addEventListener('paste',e=>{const el=ctDich();const fs=e.clipboardData?[...e.clipboardData.files]:[];if(!el||!fs.length)return;
  e.preventDefault();ctThem(el.dataset.bang,+el.dataset.id||0,fs)});
document.addEventListener('dragover',e=>{if(!coFile(e)||!ctDich())return;e.preventDefault();$('#modal').classList.add('keo')});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget){const m=$('#modal');if(m)m.classList.remove('keo')}});
document.addEventListener('drop',e=>{const el=ctDich();if(!el||!coFile(e))return;e.preventDefault();$('#modal').classList.remove('keo');
  ctThem(el.dataset.bang,+el.dataset.id||0,e.dataTransfer.files)});
window.addEventListener('beforeunload',e=>{if(CTQ.some(x=>['cho','nen','tai'].includes(x.tt))){e.preventDefault();e.returnValue=''}});
// Ghim giấy trên danh sách: số chứng từ, bấm mở thẳng trình xem
const ghim=(bang,x)=>x.so_ct?`<span class="ghim" title="${x.so_ct} chứng từ — bấm để xem" onclick="event.stopPropagation();moCT('${bang}',${x.id})">${IC.ghim}${x.so_ct}</span>`:'';
async function moCT(bang,id){try{const ds=await rpc('kt_ds_chung_tu',{p_bang:bang,p_dong_id:id});if(!ds.length)return toast('Phiếu chưa có chứng từ');
  const {ds:urls}=await ctFn({viec:'xem',ids:ds.map(x=>x.id)});const u=Object.fromEntries(urls.map(x=>[x.id,x.url]));
  S.cache['ct_'+bang+id]=ds.map(x=>({...x,url:u[x.id]}));xemCT(bang,id,ds[0].id)}catch(e){alert(e.message)}}
async function taiVeCT(ids){try{const {ds}=await ctFn({viec:'xem',ids,tai_ve:true});
  for(const x of ds){if(!x.url)continue;const a=document.createElement('a');a.href=x.url;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,400))}}catch(e){alert(e.message)}}
async function xoaCT(bang,id,ctId){if(!confirm('Xoá chứng từ này? (ẩn khỏi phiếu, vẫn còn trong nhật ký)'))return;
  try{await rpc('kt_xoa_chung_tu',{p_id:ctId});const el=$(`.ct[data-bang="${bang}"][data-id="${id}"]`);if(el){delete el.dataset.xong;ganCT()}}catch(e){alert(e.message)}}
function xemCT(bang,id,ctId){const ds=S.cache['ct_'+bang+id]||[];let i=ds.findIndex(x=>x.id===ctId);if(i<0)return;
  const lb=document.createElement('div');lb.className='ct-lb';document.body.appendChild(lb);
  const ve=()=>{const x=ds[i];const anh=/^image\//.test(x.mime||'');
    lb.innerHTML=`<div class="ct-lb-top"><span>${esc(x.ten)} · ${i+1}/${ds.length}</span><span style="margin-left:auto;display:flex;gap:6px">
      ${ds.length>1?'<button data-k="-1">‹ Trước</button><button data-k="1">Sau ›</button>':''}<button data-t="1">⬇ Tải về</button><button data-x="1">✕ Đóng</button></span></div>
      <div class="ct-lb-body">${anh?`<img src="${esc(x.url)}">`:`<iframe src="${esc(x.url)}"></iframe>`}</div>`};
  ve();lb.onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.k){i=(i+ +b.dataset.k+ds.length)%ds.length;ve()}else if(b&&b.dataset.t)taiVeCT([ds[i].id]);
    else if((b&&b.dataset.x)||e.target===lb||e.target.classList.contains('ct-lb-body'))lb.remove()};}
// (09/10/2026 anh bỏ nút tải chứng từ cả kỳ .zip — cần file nào vào phiếu tải)

// ── CHUÔNG THÔNG BÁO (anh 08/10: "có cái chuông báo trên app là được giao việc, kiểu Facebook" — không đẩy về điện thoại) ──
// Hàm SQL tự sinh thông báo khi: có đề nghị chi mới / được duyệt / đã TT / bị từ chối, có điều chuyển mới / được xác nhận.
// Trang đếm số chưa đọc mỗi phút (chỉ khi tab đang mở); bấm chuông xem 40 cái gần nhất, bấm 1 cái → mở đúng phiếu.
S.tb=0;
const chuongHtml=()=>`<div class="tb-dd tb-chuong"><button class="tb-btn chuong" title="Thông báo" onclick="event.stopPropagation();moChuong(this)">${IC.chuong}<span class="cb-so" ${S.tb?'':'hidden'}>${S.tb>99?'99+':S.tb}</span></button><div class="tb-menu-dd cb-ds" onclick="event.stopPropagation()"></div></div>`;
function veSoChuong(){$$('.cb-so').forEach(n=>{n.hidden=!S.tb;n.textContent=S.tb>99?'99+':S.tb})}
async function demChuong(){if(!S.phien||document.visibilityState!=='visible')return;
  try{const n=await rpc('kt_dem_thong_bao');if(n!==S.tb){const tang=n>S.tb;S.tb=n;veSoChuong();if(tang&&$('.tb-chuong.open'))veChuong()}}catch(e){}}
setInterval(demChuong,60000);document.addEventListener('visibilitychange',demChuong);
const tuLuc=t=>{const s=(Date.now()-new Date(t))/1000;return s<60?'vừa xong':s<3600?Math.floor(s/60)+' phút trước':s<86400?Math.floor(s/3600)+' giờ trước':s<7*86400?Math.floor(s/86400)+' ngày trước':fmtDT(t)};
const MAU_TB={chi_trung:'bad',chi_moi:'warn',chi_kiot:'warn',chi_cho_gd:'teal',chi_cho_tt:'info',chi_duyet:'ok',chi_da_tt:'ok',chi_tu_choi:'bad',dc_moi:'vio',dc_xac_nhan:'ok'};
async function moChuong(b){const d=b.parentNode,o=d.classList.contains('open');$$('.tb-dd.open').forEach(x=>x.classList.remove('open'));if(o)return;
  d.classList.add('open');d.querySelector('.cb-ds').innerHTML='<div class="muted" style="padding:12px;font-size:12px">Đang tải…</div>';await veChuong()}
async function veChuong(){const box=$('.tb-chuong .cb-ds');if(!box)return;
  try{const ds=await rpc('kt_ds_thong_bao');S.cache.tb=ds;S.tb=ds.filter(x=>!x.da_doc).length;veSoChuong();
    box.innerHTML=`<div class="cb-h"><b>Thông báo</b>${S.tb?`<a href="#" onclick="event.preventDefault();docChuong()">Đánh dấu đã đọc hết</a>`:''}</div>
      ${ds.map(x=>`<div class="cb-i ${x.da_doc?'':'moi'}" style="--c:var(--${MAU_TB[x.loai]||'accent'})" onclick="moThongBao(${x.id})">
        <span class="cb-dot"></span><div><div class="cb-t">${esc(x.tieu_de)}</div><div class="cb-n">${esc(x.noi_dung||'')}</div>
        <div class="cb-l">${esc(x.tu||'')} · ${tuLuc(x.tao_luc)}</div></div></div>`).join('')||'<div class="muted" style="padding:14px;font-size:12px">Chưa có thông báo</div>'}`;
  }catch(e){box.innerHTML=`<div class="neg" style="padding:12px;font-size:12px">${esc(e.message)}</div>`}}
async function docChuong(id){try{await rpc('kt_doc_thong_bao',{p_id:id||null});if(!id){S.tb=0;veSoChuong();veChuong()}}catch(e){}}
async function moThongBao(id){const x=(S.cache.tb||[]).find(t=>t.id===id);if(!x)return;
  $$('.tb-dd.open').forEach(d=>d.classList.remove('open'));
  if(!x.da_doc){x.da_doc=true;S.tb=Math.max(0,S.tb-1);veSoChuong();docChuong(id)}
  const trang=x.bang==='chi'?'chi':x.bang==='dieu_chuyen'?'dieu_chuyen':null;if(!trang||!coXem(trang))return;
  // thông báo gộp (vd nhiều đề xuất chi từ Kiot) → mở tab chờ kế toán kiểm, lọc nguồn Kiot
  if(!x.dong_id){if(trang==='chi'){S.f.chi_tt='cho_duyet';S.f.chi_nguon=x.loai==='chi_kiot'?'kiot':''}setKy('nam',true);go(trang);return}
  // mở trang + kỳ "Từ 1/9" để chắc chắn thấy phiếu, đợi danh sách tải xong rồi mở đúng phiếu
  const k=trang==='chi'?'chi':'dc';delete S.cache[k];setKy('nam',true);if(trang==='chi')S.f.chi_tt='tat_ca';

async function moLoi(bang,id){

  const l=ds.filter(x=>loc==='tat_ca'||(loc==='chua'?!x.tra_loi:!!x.tra_loi));const chua=ds.filter(x=>!x.tra_loi).length;

    `<div class="panel" style="margin-bottom:14px;font-size:12.5px;color:var(--text2)">Các câu Monsieur Claude cần hỏi để số liệu đúng. Anh hỏi kế toán rồi <b>bấm chọn câu trả lời có sẵn</b> hoặc gõ thêm vào ô, bấm <b>Lưu</b>. Lần sau Claude đọc và làm theo.</div>`+
    (l.length?nhom.map(n=>`<div class="sec">${esc(n)}</div>`+l.filter(x=>x.nhom===n).map(x=>`<div class="panel cauhoi ${x.tra_loi?'xong':''}" id="ch${x.id}">

      <div class="gt">${esc(x.giai_thich)}</div>

function oTraLoi(x){return `<div class="tl-form">${(x.lua_chon||[]).map((c,i)=>`<button class="btn sm" onclick="chonTL(${x.id},${i})">${esc(c)}</button>`).join('')}

  <div class="acts" style="margin-top:6px"><button class="btn pri" onclick="luuTL(${x.id})">Lưu trả lời</button></div></div>`}
function chonTL(id,i){const x=S.cache.ch.find(c=>c.id===id);const t=$('#tl'+id);const v=x.lua_chon[i];
  t.value=t.value&&!x.lua_chon.includes(t.value.split('\n')[0])?v+'\n'+t.value:v+(t.value.includes('\n')?t.value.slice(t.value.indexOf('\n')):'');t.focus()}

  '<b>Công nợ khách / NCC</b> trong báo cáo Khách hàng / NCC = số Kiot đang ghi. Khách: dương = khách còn nợ, âm = khách trả trước. NCC: giữ nguyên dấu Kiot (chờ kế toán xác nhận ý nghĩa dấu).',
  'Phiếu nhập trạng thái 4 (theo Kiot là đã huỷ) không tính.']],
 ['Quỹ tiền mặt 3 cửa hàng (đối chiếu cuối ngày)',[
  'Từ sổ quỹ Kiot, chỉ phiếu <b>tiền mặt</b>: thu tại quầy − chi tại quầy − nộp về két / quỹ khác (Chuyển rút) + nhận thêm = tiền <b>còn giữ ở quầy</b> (cộng dồn trong kỳ).',
  'Cuối ngày nộp đủ thì "còn giữ" về 0. Số khác 0 kéo dài = tiền chưa nộp hoặc thiếu phiếu.']],
 ['P&L — lãi / lỗ (theo thực thu / thực chi, anh chốt 08/10/2026)',[
  '<b>Doanh thu</b> = khoản thu đã duyệt loại Thu bán hàng + Thu đặt cọc + Thu công nợ (theo ngày thu). <b>Thu khác</b> (vốn góp, lãi NH, hoàn tiền) để riêng ở phần ngoài hoạt động.',
  '<b>Giá vốn</b> = chi đã thanh toán nhóm "Chi nhập hàng". <b>Chi phí hoạt động</b> = chi nhóm "Chi vận hành & quản lí". Chi tài chính, chi đầu tư để riêng.',
  '<b>Lợi nhuận ròng</b> = tổng thu − tổng chi (không gồm điều chuyển). Chi tài chính hiện gồm CẢ trả gốc vay — khi trang Vay & lãi vay có đủ dữ liệu sẽ tách gốc / lãi.',
  'Phần "Tham chiếu Kiot" (doanh thu hoá đơn, giá vốn hàng bán) để so — không cộng vào lợi nhuận.']],
 ['Vay & lãi vay · Tài sản (nhập trên app)',[
  'Vay: nhập khoản vay (số tiền, lãi suất, đáo hạn) và các lần trả / lịch trả (gốc, lãi). Dư nợ = số vay − gốc đã trả. Tiền trả thật vẫn ghi ở trang Chi.',
  'Tài sản: khấu hao <b>đường thẳng theo tháng</b>: mỗi tháng = nguyên giá / số tháng khấu hao; giá trị còn lại = nguyên giá − khấu hao luỹ kế tới hôm nay.']],
 ['Chứng từ (ảnh / PDF)',[
  'Lưu và xem <b>ngay trên app</b> (anh chốt 08/10/2026): phiếu Thu, Chi, Điều chuyển, Vay, Tài sản đều có ô "Chứng từ đính kèm" — thêm nhiều ảnh / PDF, bấm ảnh để xem to, tải về từng file hoặc cả phiếu.',
  'Thêm chứng từ: bấm ô <b>＋</b>, <b>kéo thả</b> file vào phiếu, hoặc <b>dán (Ctrl+V)</b> ảnh chụp màn hình. Phiếu MỚI chọn ảnh luôn trong form, bấm Lưu là tự tải lên. Nén + tải chạy <b>ngầm</b> (ô hiện % ), đóng phiếu vẫn tải tiếp; ô lỗi bấm để thử lại (anh chốt 08/10/2026).',
  'Danh sách Thu / Chi / Điều chuyển có <b>ghim giấy + số chứng từ</b>: bấm là mở thẳng trình xem ảnh.',
  'Ảnh tự <b>nén trên máy trước khi tải lên</b> (cạnh dài tối đa 2000px, ~400–600 KB, vẫn đọc rõ hoá đơn); PDF giữ nguyên; tối đa 15 MB / file.',
  'Kho file <b>riêng tư</b>: chỉ người đăng nhập và có quyền xem trang đó mới mở được; mỗi lần xem app cấp link sống 5 phút. Xoá = ẩn khỏi phiếu, file vẫn còn, có nhật ký.',
  'Link Google Drive cũ (chuyển từ sheet) vẫn giữ và bấm mở được ở mục "Hồ sơ".']],
 ['Công nợ khách',[
  '<b>Dùng số công nợ trên Kiot</b> (anh chốt 08/10/2026: "kiot là đủ"): dương = khách còn nợ, âm = khách trả trước. Là số <b>hiện tại</b>, tự cập nhật 3 tiếng 1 lần. Xem ở Tổng quan và Báo cáo → Khách hàng.',
  'Trang công nợ nhập tay (chuyển từ sheet cũ, phân loại COD / nợ / nợ NPP...) đã ẩn khỏi menu, dữ liệu cũ giữ nguyên để tra lại; không nhập mới.']],
 ['Quyền và nhật ký',[
  'Đăng nhập bằng <b>tài khoản + mật khẩu</b> riêng của app kế toán (không dùng chung tài khoản app MKT/Sale). Mật khẩu lưu dạng băm, không ai đọc lại được. Sai 5 lần liền → khoá 15 phút.',
  'Phân quyền: tick <b>Toàn quyền</b>, hoặc tick từng trang — <b>Xem</b> và <b>Nhập / sửa</b> riêng (anh bỏ ô Vị trí 05/10/2026). Quyền kiểm ở máy chủ (hàm SQL), không chỉ ẩn nút trên trang.',
  'Hiện tại: anh Hải, giám đốc, kế toán — đều Admin toàn quyền (anh chốt 05/10/2026). Riêng tài khoản anh Hải là chủ app: chỉ anh cấp / bỏ quyền giám đốc xác nhận chi.',
  'Chi — quyền (anh chốt 08/10/2026): <b>"Kế toán kiểm lượt 1 & thanh toán"</b> (Admin luôn có) · <b>"Giám đốc xác nhận lượt 2"</b> — KHÔNG đi theo Toàn quyền, phải tick riêng ở tài khoản (hiện: giám đốc; tài khoản anh Hải luôn có) · "Chỉ tạo đề nghị" (thấy phiếu mình — hiện không dùng, nhân viên đề xuất trên Kiot). Kiểm ở máy chủ, không chỉ ẩn nút.',
  'Mọi thêm / sửa / xoá đều ghi nhật ký: ai, lúc nào, nội dung. Xoá = ẩn khỏi báo cáo, không mất dữ liệu.']],
 ['Duyệt chi 2 lượt + đề xuất chi từ Kiot',[
  'Anh chốt 08/10/2026: <b>nhân viên đề xuất chi trên Kiot</b> → app tự kéo về (3 tiếng / lần) thành phiếu <b>Chờ kế toán kiểm</b> → kế toán kiểm, <b>xác nhận lượt 1</b> → <b>Chờ giám đốc xác nhận</b> → giám đốc <b>xác nhận lại</b> → <b>Chờ thanh toán</b> → kế toán chi, ghi Đã thanh toán.',
  'Người đã kiểm lượt 1 không tự xác nhận lượt 2. Giám đốc có thể Từ chối hoặc Trả lại kế toán. Phiếu đã được giám đốc xác nhận: chỉ giám đốc đổi được số tiền.',
  'Phiếu từ Kiot: lấy phiếu CHI trên sổ quỹ Kiot từ 08/10/2026, bỏ chuyển quỹ nội bộ (nhóm "Chuyển rút", mã TTD_ / CTD_, nội dung có số tài khoản công ty). Người đề nghị = người tạo trên Kiot, cơ sở = chi nhánh Kiot, tài khoản gợi ý: tiền mặt → két, chuyển khoản → tài khoản Kiot đã ghép. Kiot không có trạng thái "chờ duyệt" (phiếu Kiot luôn ghi Đã thanh toán) — app là nơi duyệt.',
  'Chống tính 2 lần: phiếu app đã đánh dấu "Đã tạo phiếu Kiot (4A)" cùng số tiền, lệch ≤ 5 ngày → GHÉP, không tạo phiếu mới. Cùng số tiền ±5 ngày với phiếu app khác → vẫn tạo nhưng gắn nhãn đỏ <b>"Nghi trùng #…"</b> để kế toán Từ chối nếu là cùng 1 khoản.',
  'Phiếu Kiot bị huỷ → phiếu app chưa thanh toán tự chuyển Từ chối. Phiếu Kiot sửa số tiền khi app còn chờ kế toán kiểm (chưa ai sửa) → cập nhật theo. Báo cáo tiền chỉ cộng phiếu Đã thanh toán.',
  '"Đã thanh toán luôn" (kế toán tự chi, không qua duyệt) — anh chốt 09/10/2026: KHÔNG cần giám đốc xác nhận.',
  'Phiếu chi Kiot tự sinh khi trả hàng (TTTH) / trả NCC lúc nhập hàng (PCPN) cũng qua đủ 2 lượt (anh chốt 09/10/2026).']],
 ['Luật loại chi (Claude chốt) + nghi sai loại',[
  'Anh chốt 09/10/2026: các khoản cùng nội dung bị gán lệch loại → Claude quyết 1 loại theo bản chất khoản chi. TRƯỚC ngày áp dụng app: Claude đã tự sửa phiếu cũ (37 phiếu, có nhật ký để hoàn tác). TỪ ngày áp dụng: phiếu chọn loại khác luật → nhãn đỏ "Nghi sai loại" (tab ở trang Chi + Việc cần làm), kế toán bấm Đổi / Giữ — app KHÔNG tự sửa.',
  '<b>Trả thẻ tín dụng công ty (sao kê, phí lãi thẻ)</b> → FINANCE - Tài chính - vay,lãi.',
  '<b>Phí dịch vụ ngân hàng</b> → OPEX - Vận hành & Quản lí.',
  '<b>Mua hàng nhập: phí chuyển tiền NN, vận chuyển TQ</b> → COGS - Giá vốn & Nhập Hàng.',
  '<b>NCC hàng hoá (Thảo Nến)</b> → COGS - Giá vốn & Nhập Hàng.',
  '<b>Tiền điện</b> → OPEX - Vận hành & Quản lí.',
  '<b>Bù quỹ ngoài cửa hàng</b> → OPEX - Vận hành & Quản lí.',
  '<b>Chưa rõ nguyên nhân</b> → OPEX - Khác.',
  '<b>Chuyển tiền mặt cho bà Bùi Thị Hiền</b> → OPEX - Khác.',
  'Trả thẻ tín dụng công ty để "Tài chính" vì là trả khoản vay ngắn hạn (không đoán thẻ quẹt mua gì). Phí dịch vụ ngân hàng là chi phí quản lý, không phải lãi vay. Phí chuyển tiền nước ngoài / vận chuyển hàng TQ tính vào giá vốn hàng nhập.']],
 ['Chuông thông báo',[
  'Chuông trên thanh menu (thay báo Zalo, không đẩy về điện thoại — anh chốt 08/10/2026). Số đỏ = chưa đọc, tự cập nhật mỗi phút khi đang mở app. Bấm 1 thông báo → mở đúng phiếu.',
  'Chi: phiếu mới / từ Kiot / mở lại → kế toán. Kế toán xác nhận lượt 1 → giám đốc. Giám đốc xác nhận → kế toán (thanh toán) + người tạo phiếu. Giám đốc trả lại → kế toán. Đã thanh toán / bị từ chối → người tạo (và người đã kiểm). Nhiều đề xuất Kiot cùng lúc gộp 1 thông báo.',
  'Điều chuyển mới tạo trên app → người sửa được trang Điều chuyển (để xác nhận). Đã xác nhận → người tạo. Không báo cho chính người vừa thao tác; dữ liệu kéo từ Kiot / sheet cũ không sinh thông báo. Thông báo đã đọc quá 90 ngày tự dọn.']],
 ['Kéo bù từ sheet cũ (08/10/2026)',[
  'Các khoản chi phát sinh trên Google Sheet sau 05/10 được kéo tạm vào app, ghi chú bắt đầu bằng <b>[Kéo từ sheet cũ 08/10 …]</b>, người đề nghị "Chưa rõ (sheet cũ)" — nhãn tím <b>"Kéo từ sheet cũ — cần bổ sung"</b>. Kế toán sửa dần (người đề nghị, chứng từ); sửa phiếu xong nhãn tự mất. Lọc nhanh: trang Chi → ô nguồn.',
  'Ghép với phiếu đã có theo <b>nội dung + số tiền</b> (không theo số dòng, vì tab sheet bị xếp lại); không bao giờ hạ trạng thái phiếu đã có; chỉ lấy khoản phát sinh từ 01/09.']],
 ['Hạn chế nhập tay',[
  'Tài khoản, cơ sở, bộ phận, loại thu, loại chi, phân loại công nợ, ngân hàng: chỉ <b>chọn</b> từ danh sách (danh mục sửa ở Cài đặt) — hết lỗi tên ghi nhiều kiểu.',
  'Ngày mặc định hôm nay; số tiền tự thêm dấu chấm; người thụ hưởng, người đề nghị, khách công nợ, nội dung thu có gợi ý từ dữ liệu cũ.']],
];
async function pageCaiDat(mod){
  const el=$('#page');S.f.cd=mod;
  el.innerHTML=head(PAGES[S.page].ten+' <span class="badge" style="vertical-align:middle">Cài đặt · '+PAGES[S.page].cd+'</span>')+'<div id="cd"></div>';
  const c=$('#cd');const qt=can('danh_muc',true);
  if(S.f.cd==='logic'){
    const lc=S.dm.loai.filter(x=>x.nhom==='chi'&&x.hoat_dong);
    c.innerHTML=`<div class="doc">${LOGIC.map(([t,ls],i)=>`<h3>${i+1}. ${t}</h3><div class="rule"><ul>${ls.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}
      <h3>${LOGIC.length+1}. Cách chia từng loại chi (đang áp dụng)</h3>
      <div class="card scroll"><table><tr><th>Loại chi</th><th>Nhóm báo cáo</th><th>Cách chia theo cơ sở</th></tr>${lc.map(x=>`<tr><td>${esc(x.ten)}</td><td>${esc(x.nhom_bc||'')}</td><td>${x.cach_chia==='ty_le_thu'?'Theo tỉ lệ thu':'Riêng (theo phiếu)'}</td></tr>`).join('')}</table></div>
      <h3>${LOGIC.length+2}. Mốc tồn đầu từng tài khoản</h3>
      <div class="card scroll"><table><tr><th>Tài khoản</th><th>Ngày mốc</th><th class="num">Tồn đầu</th></tr>${S.dm.tai_khoan.filter(x=>x.hoat_dong).map(x=>`<tr><td>${esc(x.ten)}</td><td>${fmtD(x.ngay_ton_dau)}</td><td class="num">${fmt(x.ton_dau)}</td></tr>`).join('')}</table></div></div>`;
  }else if(S.f.cd==='tai_khoan'){
    c.innerHTML=`${qt?'<div class="bar"><button class="btn pri" onclick="formDM(\'tai_khoan\')">+ Thêm tài khoản</button></div>':''}<div class="card scroll"><table><tr><th>Tài khoản</th><th>Loại</th><th>Ngày mốc</th><th class="num">Tồn đầu</th><th>Bên Kiot</th><th>Trạng thái</th></tr>
      ${S.dm.tai_khoan.map(x=>`<tr class="${qt?'click':''}" ${qt?`onclick="formDM('tai_khoan',${x.id})"`:''}><td>${esc(x.ten)}</td><td>${esc(LOAI_TK[x.loai])}</td><td>${fmtD(x.ngay_ton_dau)}</td><td class="num">${fmt(x.ton_dau)}</td><td>${esc((x.kiot_ma||[]).join(', '))}</td><td>${x.hoat_dong?vb('Đang dùng','ok'):vb('Tắt','grey')}</td></tr>`).join('')}</table></div>`;
  }else if(S.f.cd==='don_vi'){
    c.innerHTML=`${qt?'<div class="bar"><button class="btn pri" onclick="formDM(\'don_vi\')">+ Thêm</button></div>':''}<div class="card scroll"><table><tr><th>Tên</th><th class="c">Chịu chi phí / báo cáo</th><th class="c">Bộ phận đề nghị</th><th>Chi nhánh Kiot</th><th>Trạng thái</th></tr>
      ${S.dm.don_vi.map(x=>`<tr class="${qt?'click':''}" ${qt?`onclick="formDM('don_vi',${x.id})"`:''}><td>${esc(x.ten)}</td><td class="c">${x.la_co_so?'✓':''}</td><td class="c">${x.la_bo_phan?'✓':''}</td><td>${esc((x.kiot_chi_nhanh||[]).join(', '))}</td><td>${x.hoat_dong?vb('Đang dùng','ok'):vb('Tắt','grey')}</td></tr>`).join('')}</table></div>`;
  }else if(S.f.cd==='loai'){
    c.innerHTML=`${qt?'<div class="bar"><button class="btn pri" onclick="formDM(\'loai\')">+ Thêm loại</button></div>':''}<div class="card scroll"><table><tr><th>Nhóm</th><th>Loại</th><th>Nhóm báo cáo</th><th>Cách chia</th><th>Trạng thái</th></tr>
      ${S.dm.loai.map(x=>`<tr class="${qt?'click':''}" ${qt?`onclick="formDM('loai',${x.id})"`:''}><td>${x.nhom==='thu'?'Thu':'Chi'}</td><td>${esc(x.ten)}</td><td>${esc(x.nhom_bc||'')}</td><td>${x.nhom==='chi'?(x.cach_chia==='ty_le_thu'?'Theo tỉ lệ thu':'Riêng'):''}</td><td>${x.hoat_dong?vb('Đang dùng','ok'):vb('Tắt','grey')}</td></tr>`).join('')}</table></div>`;
  }else if(S.f.cd==='nguoi_dung'){
    const ds=await rpc('kt_ds_nguoi_dung');S.cache.nd=ds;const sua=can('phan_quyen',true);
    const qtxt=x=>{const gdx=(x.vi_tri==='supreme'||(x.quyen||[]).includes('chi_gd'))?' <span class="badge" style="background:var(--teal-bg);color:var(--teal)">GĐ xác nhận chi</span>':'';
      if(['supreme','admin'].includes(x.vi_tri)||(x.quyen||[]).includes('*'))return '<span class="pos" style="font-weight:800">TOÀN QUYỀN</span>'+gdx;
      const p=(x.quyen||[]).filter(q=>!q.includes(':'));if(!p.length)return '<span class="muted">Chưa có quyền</span>';
      const ten=p.map(q=>(TRANG_QUYEN[q]||q).split(' (')[0]+(QUYEN_1_O.includes(q)?'':(x.quyen||[]).includes(q+':ghi')?' (sửa)':' (xem)'));
      return `<span title="${esc(ten.join(', '))}">${p.length} trang · ${esc(ten[0])}${ten.length>1?'…':''}</span>`};
    c.innerHTML=`<div class="listbox"><div class="bar"><span class="badge ok">${ds.filter(x=>x.hoat_dong).length} tài khoản đang hoạt động</span>
      ${sua?'<button class="btn pri" style="margin-left:auto" onclick="formND()">+ Tạo tài khoản</button>':''}</div>
      <div class="card scroll"><table><tr><th>Họ tên</th><th>Tài khoản</th><th>Quyền truy cập</th><th>Đăng nhập gần nhất</th><th>Trạng thái</th><th></th></tr>
      ${ds.map(x=>`<tr><td><b>${esc(x.ho_ten)}</b>${x.vi_tri==='supreme'?' <span class="badge" style="background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff">Admin</span>':''}</td>
        <td><code>${esc(x.ten_dang_nhap)}</code></td><td>${qtxt(x)}</td><td class="nw">${fmtDT(x.dang_nhap_luc)}</td>
        <td>${!x.hoat_dong?vb('Đã khoá','grey'):x.dang_khoa?vb('Tạm khoá (sai MK)','warn'):vb('Đang hoạt động','ok')}</td>
        <td class="nw">${sua&&x.vi_tri!=='supreme'?`<button class="btn sm" onclick="formND(${x.id})">✏ Sửa</button> <button class="btn sm" onclick="datLaiMK(${x.id})">Đặt lại mật khẩu</button> ${x.hoat_dong?`<button class="btn sm bad" onclick="khoaND(${x.id},false)">Khoá</button>`:`<button class="btn sm ok" onclick="khoaND(${x.id},true)">Mở lại</button>`}`:sua&&x.id===S.toi.id?`<button class="btn sm" onclick="formND(${x.id})">✏ Sửa</button>`:''}</td></tr>`).join('')}</table></div></div>`;
  }else if(S.f.cd==='nhat_ky'){
    const ds=await rpc('kt_ds_nhat_ky');
    c.innerHTML=`<div class="card scroll"><table><tr><th>Lúc</th><th>Người</th><th>Bảng</th><th>Dòng</th><th>Việc</th><th>Chi tiết</th></tr>
      ${ds.map(x=>`<tr><td class="nw">${fmtDT(x.luc)}</td><td class="nw">${esc(x.nguoi)}</td><td>${esc(x.bang)}</td><td class="num">${x.dong_id??''}</td><td>${esc(x.hanh_dong)}</td><td style="font-size:11px;max-width:420px;word-break:break-word" class="muted">${esc(x.du_lieu?JSON.stringify(x.du_lieu).slice(0,300):'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Chưa có</td></tr>'}</table></div>`;
  }else if(S.f.cd==='doi_ma'){
    c.innerHTML=`<div class="card" style="max-width:420px;padding:16px"><div class="muted" style="margin-bottom:10px">Tài khoản: <b>${esc(S.toi.ten_dang_nhap)}</b></div><div class="form" id="f" style="grid-template-columns:1fr">
      <label>Mật khẩu hiện tại<input type="password" name="m0" autocomplete="current-password"></label>
      <label>Mật khẩu mới (từ 8 ký tự)<input type="password" name="m1" autocomplete="new-password"></label><label>Nhập lại mật khẩu mới<input type="password" name="m2" autocomplete="new-password"></label></div>
      <div class="acts"><button class="btn pri" onclick="doiMa()">Đổi mật khẩu</button></div></div>`;
  }
}
function arrIn(v){return (v||'').split(',').map(s=>s.trim()).filter(Boolean)}
function formDM(bang,id){
  const src={tai_khoan:S.dm.tai_khoan,don_vi:S.dm.don_vi,loai:S.dm.loai}[bang];
  const x=id?src.find(r=>r.id===id):{hoat_dong:true,thu_tu:100,loai:'ngan_hang',ngay_ton_dau:MOC_SODU,ton_dau:0,la_co_so:true,nhom:'chi',cach_chia:'rieng'};
  const f={
    tai_khoan:`<label class="full">Tên tài khoản (ngân hàng + chủ + số)<input name="ten" value="${esc(x.ten||'')}"></label>
      <label>Loại<select name="loai">${optsObj(LOAI_TK,x.loai)}</select></label><label>Thứ tự<input name="thu_tu" type="number" value="${x.thu_tu}"></label>
      <label>Ngày mốc tồn đầu<input type="date" name="ngay_ton_dau" value="${x.ngay_ton_dau}"></label><label>Tồn đầu tại ngày mốc${moneyIn('ton_dau',x.ton_dau)}</label>
      <label class="full">Tài khoản tương ứng bên Kiot (cách nhau dấu phẩy)<input name="kiot_ma" value="${esc((x.kiot_ma||[]).join(', '))}"></label>`,
    don_vi:`<label class="full">Tên<input name="ten" value="${esc(x.ten||'')}"></label>
      <label class="chk"><input type="checkbox" name="la_co_so" ${x.la_co_so?'checked':''}> Chịu chi phí / có trong báo cáo cơ sở</label>
      <label class="chk"><input type="checkbox" name="la_bo_phan" ${x.la_bo_phan?'checked':''}> Là bộ phận đề nghị chi</label>
      <label>Thứ tự<input name="thu_tu" type="number" value="${x.thu_tu}"></label>
      <label>Chi nhánh Kiot tương ứng (cách nhau dấu phẩy)<input name="kiot_chi_nhanh" value="${esc((x.kiot_chi_nhanh||[]).join(', '))}"></label>`,
    loai:`<label>Nhóm<select name="nhom" ${id?'disabled':''}>${optsObj({thu:'Thu',chi:'Chi'},x.nhom)}</select></label><label>Tên loại<input name="ten" value="${esc(x.ten||'')}"></label>
      <label>Nhóm báo cáo<input name="nhom_bc" value="${esc(x.nhom_bc||'')}" placeholder="vd: Chi vận hành & quản lý"></label>
      <label>Cách chia theo cơ sở (loại chi)<select name="cach_chia">${optsObj({rieng:'Riêng (theo phiếu)',ty_le_thu:'Theo tỉ lệ thu (chi phí chung)'},x.cach_chia)}</select></label>
      <label>Thứ tự<input name="thu_tu" type="number" value="${x.thu_tu}"></label>`}[bang];
  modal(`<h2>${id?'Sửa':'Thêm'}</h2><div class="form" id="f">${f}<label class="full chk"><input type="checkbox" name="hoat_dong" ${x.hoat_dong?'checked':''}> Đang dùng (tắt = ẩn khỏi danh sách chọn, dữ liệu cũ giữ nguyên)</label></div>
    <div class="acts"><button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" onclick="luuDM('${bang}',${id||'null'})">Lưu</button></div>`);
}
async function luuDM(bang,id){const o=formData($('#f'));o.id=id;
  if('ton_dau' in o)o.ton_dau=so(o.ton_dau)||0;if('kiot_ma' in o)o.kiot_ma=arrIn(o.kiot_ma);if('kiot_chi_nhanh' in o)o.kiot_chi_nhanh=arrIn(o.kiot_chi_nhanh);
  if(id&&bang==='loai')o.nhom=S.dm.loai.find(x=>x.id===id).nhom;
  await save('kt_luu_danh_muc',{p_bang:bang,p_dong:o});await reloadDm();render()}
function formND(id){const x=id?S.cache.nd.find(n=>n.id===id):{vi_tri:'nhan_vien',hoat_dong:true,quyen:[]};
  const q=x.quyen||[],sup=x.vi_tri==='supreme',full=sup||x.vi_tri==='admin'||q.includes('*');
  modal(`<h2>${id?'Sửa tài khoản':'Thêm tài khoản'}</h2><div class="form" id="f">
    <label>Tên đăng nhập (chữ thường, không dấu)<input name="ten_dang_nhap" value="${esc(x.ten_dang_nhap||'')}" autocapitalize="none"></label>
    <label>Họ tên<input name="ho_ten" value="${esc(x.ho_ten||'')}"></label>
    <label class="full">${id?'Đặt lại mật khẩu (để trống = giữ)':'Mật khẩu (từ 8 ký tự)'}<input type="password" name="mk_moi" autocomplete="new-password"></label>
    <div class="full" style="grid-column:1/-1">${sup?'<span class="badge">Tài khoản người làm app — luôn toàn quyền</span>':
      `<label class="chk"><input type="checkbox" id="q_all" ${full?'checked':''} onchange="$('#qbox').style.display=this.checked?'none':''"> <b>Toàn quyền</b> — xem, nhập, sửa mọi trang, quản lý tài khoản</label>`}
      <label class="chk" style="margin-top:6px"><input type="checkbox" id="q_gd" ${sup||q.includes('chi_gd')?'checked':''} ${sup||S.toi.vi_tri!=='supreme'?'disabled':''}> <b>Giám đốc xác nhận chi (lượt 2)</b> — tick riêng, Toàn quyền không tự có${S.toi.vi_tri!=='supreme'?' · chỉ anh Hải cấp / bỏ':''}</label></div>
    <div class="full" id="qbox" style="grid-column:1/-1;${full?'display:none':''}">
      <div class="sec" style="margin-top:4px">Quyền theo trang</div>
      <div class="card"><table><tr><th>Module / trang</th><th class="c">Xem</th><th class="c">Nhập / sửa</th></tr>
      ${NHOM_QUYEN.map(([g,ks])=>`<tr class="tong"><td colspan="3">${g}</td></tr>`+ks.map(k=>`<tr><td style="padding-left:24px">${esc(TRANG_QUYEN[k])}</td>${QUYEN_1_O.includes(k)?`<td class="c" colspan="2"><input type="checkbox" data-q="${k}" ${q.includes(k)?'checked':''}></td>`:`<td class="c"><input type="checkbox" data-q="${k}" ${q.includes(k)?'checked':''}></td><td class="c"><input type="checkbox" data-q="${k}:ghi" ${q.includes(k+':ghi')?'checked':''}></td>`}</tr>`).join('')).join('')}</table></div></div>
    <label class="full chk"><input type="checkbox" name="hoat_dong" ${x.hoat_dong?'checked':''}> Đang dùng (bỏ tick = khoá tài khoản, đăng xuất ngay)</label></div>
    <div class="acts"><button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" onclick="luuND(${id||'null'})">Lưu</button></div>`)}
async function luuND(id){const f=$('#f');const x=id?S.cache.nd.find(n=>n.id===id):{};const all=$('#q_all');
  const toan=x.vi_tri==='supreme'||(all&&all.checked);
  const o={id,ten_dang_nhap:f.querySelector('[name=ten_dang_nhap]').value.trim().toLowerCase(),ho_ten:f.querySelector('[name=ho_ten]').value.trim(),
    vi_tri:x.vi_tri==='supreme'?'supreme':toan?'admin':'nhan_vien',mk_moi:f.querySelector('[name=mk_moi]').value,hoat_dong:f.querySelector('[name=hoat_dong]').checked};
  const q=new Set(toan?[]:$$('#f [data-q]').filter(c=>c.checked).map(c=>c.dataset.q));
  [...q].filter(k=>k.endsWith(':ghi')).forEach(k=>q.add(k.split(':')[0]));   // được sửa thì phải được xem
  if($('#q_gd')&&$('#q_gd').checked)q.add('chi_gd');else q.delete('chi_gd');   // ô riêng, giữ cả khi Toàn quyền
  o.quyen=[...q];
  if(!/^[a-z0-9._-]{3,40}$/.test(o.ten_dang_nhap))return alert('Tên đăng nhập 3–40 ký tự: chữ thường không dấu, số, dấu chấm, gạch');
  if(!o.ho_ten)return alert('Nhập họ tên');if(!id&&o.mk_moi.length<8)return alert('Mật khẩu từ 8 ký tự');
  if(!toan&&!o.quyen.filter(k=>k!=='chi_gd').length)return alert('Chưa tick quyền trang nào');
  await save('kt_luu_nguoi_dung',{p_dong:o});render()}
function datLaiMK(id){const x=S.cache.nd.find(n=>n.id===id);
  modal(`<h2>Đặt lại mật khẩu — ${esc(x.ho_ten)}</h2><div class="form" id="f" style="grid-template-columns:1fr">
    <label>Mật khẩu mới (từ 8 ký tự)<input type="password" name="m1" autocomplete="new-password"></label></div>
    <div class="muted" style="font-size:11.5px;margin-top:6px">Người này bị đăng xuất ngay, đăng nhập lại bằng mật khẩu mới.</div>
    <div class="acts"><button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" onclick="luuDatLaiMK(${id})">Lưu</button></div>`)}
async function luuDatLaiMK(id){const x=S.cache.nd.find(n=>n.id===id);const m=$('#f [name=m1]').value;if(m.length<8)return alert('Mật khẩu từ 8 ký tự');
  await save('kt_luu_nguoi_dung',{p_dong:{id,ten_dang_nhap:x.ten_dang_nhap,ho_ten:x.ho_ten,vi_tri:x.vi_tri,quyen:x.quyen,hoat_dong:x.hoat_dong,mk_moi:m}},'Đã đặt lại mật khẩu');render()}
async function khoaND(id,mo){const x=S.cache.nd.find(n=>n.id===id);if(!mo&&!confirm('Khoá tài khoản '+x.ho_ten+'? Người này bị đăng xuất ngay.'))return;
  await save('kt_luu_nguoi_dung',{p_dong:{id,ten_dang_nhap:x.ten_dang_nhap,ho_ten:x.ho_ten,vi_tri:x.vi_tri,quyen:x.quyen,hoat_dong:mo}},mo?'Đã mở lại':'Đã khoá');render()}
async function doiMa(){const o=formData($('#f'));if(o.m1.length<8)return alert('Mật khẩu mới từ 8 ký tự');if(o.m1!==o.m2)return alert('Hai lần nhập không khớp');
  try{await rpc('kt_doi_mat_khau',{p_mk_cu:o.m0,p_mk_moi:o.m1});toast('Đã đổi mật khẩu');render()}catch(e){alert(e.message)}}

// Nút con mắt xem / ẩn mật khẩu — tự gắn cho MỌI ô mật khẩu xuất hiện trên trang (đăng nhập, đổi MK, form tài khoản)
const IC_MAT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const IC_MAT_TAT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.9 17.9A10 10 0 0 1 12 19c-7 0-11-7-11-7a18 18 0 0 1 5.1-5.9M9.9 5.2A9 9 0 0 1 12 5c7 0 11 7 11 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>';
function ganMat(){document.querySelectorAll('input[type=password]:not([data-mat])').forEach(i=>{i.dataset.mat=1;
  const w=document.createElement('span');w.className='mk-wrap';i.parentNode.insertBefore(w,i);w.appendChild(i);
  const b=document.createElement('button');b.type='button';b.className='mk-mat';b.title='Xem / ẩn mật khẩu';b.innerHTML=IC_MAT;
  b.onclick=()=>{const an=i.type==='password';i.type=an?'text':'password';b.innerHTML=an?IC_MAT_TAT:IC_MAT;i.focus()};w.appendChild(b)})}
new MutationObserver(ganMat).observe(document.body,{childList:true,subtree:true});


// ── Khởi động ──────────────────────────────────────────────────────────────
try{const th=localStorage.getItem('kt_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
(async()=>{let p=null;try{p=sessionStorage.getItem('kt_phien')||localStorage.getItem('kt_phien')}catch(e){}
  if(!p)return renderGate();S.phien=p;try{await boot()}catch(e){if(S.phien)renderGate(e.message)}})();
document.addEventListener('click',()=>{const d=$('.tb-dd.open');if(d)d.classList.remove('open')});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGES[h]&&h!==S.page&&S.toi){S.page=h;shell()}});
</script>
</body>
</html>
